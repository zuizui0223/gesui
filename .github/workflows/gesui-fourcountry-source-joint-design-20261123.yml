name: External fourcountry original DOCX XLSX source design and sample code joint QA
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_fourcountry_original_docx_xlsx_sampling_design_joint_20261123.py
      - .github/workflows/gesui-fourcountry-source-joint-design-20261123.yml
permissions:
  contents: read
jobs:
  original-source-design:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Source-only original accompanying DOCX + quantitative XLSX exact publisher hashes
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 480 "https://ndownloader.figshare.com/files/43299384" -o "${{ runner.temp }}/source_design.docx"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 480 "https://ndownloader.figshare.com/files/43299387" -o "${{ runner.temp }}/source_data.xlsx"
          printf '08d81e4d97af34053b453a1c1e4f8c7d  %s\n' "${{ runner.temp }}/source_design.docx" | md5sum --check
          printf '1e4d6e37b73c663406e5567dd79d9452  %s\n' "${{ runner.temp }}/source_data.xlsx" | md5sum --check
      - name: Audit true original country sample keys and study source methods without fitting biological outcomes
        run: |
          python -m py_compile scripts/gesui_fourcountry_original_docx_xlsx_sampling_design_joint_20261123.py
          python -u scripts/gesui_fourcountry_original_docx_xlsx_sampling_design_joint_20261123.py \
            --original-docx "${{ runner.temp }}/source_design.docx" \
            --original-xlsx "${{ runner.temp }}/source_data.xlsx" \
            --out "${{ runner.temp }}/country_design_source_joint_QA.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-fourcountry-original-sampling-design-source-ID-grain-joint-QA
          path: ${{ runner.temp }}/country_design_source_joint_QA.json
          if-no-files-found: warn
          retention-days: 60
