name: gesui official BMLUK 2020-2022 FW1 2022 actual river chemistry national source
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/stage_BMLUK_2020_2022_FW1_annual.py'
      - '.github/workflows/gesui-20261116-BMLUK-2020-2022-FW1-2022-annualsource.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_Austria_2022_annual_river_nutrient_table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only original public HTTP retrieval
        run: python -m pip install --quiet requests
      - name: Verify Austrian original 2020–2022 government publisher water result archive and temporarily stage FW1 2022 annual source
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/stage_BMLUK_2020_2022_FW1_annual.py
          python -u analysis/20261116_austria_wisa_official_source/stage_BMLUK_2020_2022_FW1_annual.py \
            --output '${{ runner.temp }}/BMLUK_2020_2022_river_source'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-official-Austria-2022-national-FW1-annual-river-report-xlsx-source
          path: '${{ runner.temp }}/BMLUK_2020_2022_river_source/'
          retention-days: 2
          if-no-files-found: warn
