name: gesui preserve 2022 BQE attrition, independent diffuse agriculture coverage and conditional load permutation audit

on:
  push:
    branches:
      - "analysis/bqe2022-missingness-wfd-pressure-20261108"
    paths:
      - ".github/workflows/gesui-preserve-bqe-falsification.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  immutable-research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore existing original successful source and null artifacts without new API calls
        run: |
          set -euo pipefail
          mkdir -p /tmp/gesui-falsification/attrition /tmp/gesui-falsification/wfd /tmp/gesui-falsification/emissions-metadata /tmp/gesui-falsification/emissions2022 /tmp/gesui-falsification/np1 /tmp/gesui-falsification/permutations
          gh run download 42438230754 --repo zuizui0223/gesui \
            --name gesui-2022-EEA-Biology-original-normalized-EQR-missingness-audit \
            --dir /tmp/gesui-falsification/attrition
          gh run download 42438360158 --repo zuizui0223/gesui \
            --name gesui-WFD2022-public-pressure-source-metadata \
            --dir /tmp/gesui-falsification/wfd
          gh run download 42438505287 --repo zuizui0223/gesui \
            --name gesui-EEA2026-Waterbase-Emissions-source-inventory \
            --dir /tmp/gesui-falsification/emissions-metadata
          gh run download 42438695309 --repo zuizui0223/gesui \
            --name gesui-2022-EEA-Waterbase-Emissions-nutrient-source-coverage \
            --dir /tmp/gesui-falsification/emissions2022
          gh run download 42439118473 --repo zuizui0223/gesui \
            --name gesui-2022-NP1-agricultural-nutrient-source-only-BQE-crosswalk \
            --dir /tmp/gesui-falsification/np1
          gh run download 42439198765 --repo zuizui0223/gesui \
            --name gesui-EEA2022-BQE-source-mass-conditional-permutation-null \
            --dir /tmp/gesui-falsification/permutations
      - name: Cross-validate source denominators and archive exact original QC/data
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib,shutil
          base=Path("/tmp/gesui-falsification")
          names={
            "attrition/BQE_2022_ORIGINAL_MISSINGNESS_AUDIT.json":"BQE_2022_ORIGINAL_MISSINGNESS_AUDIT.json",
            "wfd/PRESSURE_SOURCE_SCHEMA.json":"WFD2022_REGULATORY_PRESSURE_SOURCE_METADATA.json",
            "emissions-metadata/EEA_2026_SOURCE_INVENTORY.json":"EMISSIONS2026_OFFICIAL_SOURCE_INVENTORY.json",
            "emissions2022/EMISSIONS_2022_SOURCE_COVERAGE.json":"EMISSIONS_2022_SOURCE_GRAIN_QC.json",
            "np1/SOURCE_2022_AGRICULTURAL_TNTP_COVERAGE.json":"NP1_AGRICULTURAL_2022_SOURCE_SUPPORT.json",
            "np1/SOURCE_ONLY_BQE_MONITOR_AGRICULTURAL_NP1_2022.csv":"NP1_2022_INDEPENDENT_REGIONAL_SOURCE_STATION_CROSSWALK.csv",
            "permutations/SOURCE_MASS_WITHIN_COUNTRY_Q_PERMUTATIONS.json":"CONDITIONAL_COUNTRY_FLOW_WWTP_LOAD_PERMUTATIONS.json"}
          for k in names:assert (base/k).is_file() and (base/k).stat().st_size>0,k
          q=json.loads((base/"attrition/BQE_2022_ORIGINAL_MISSINGNESS_AUDIT.json").read_text())
          ag=json.loads((base/"np1/SOURCE_2022_AGRICULTURAL_TNTP_COVERAGE.json").read_text())
          perm=json.loads((base/"permutations/SOURCE_MASS_WITHIN_COUNTRY_Q_PERMUTATIONS.json").read_text())
          em=json.loads((base/"emissions2022/EMISSIONS_2022_SOURCE_COVERAGE.json").read_text())
          assert q["pandas_nullable_numeric_NA_counted_explicitly"] is True
          assert q["original_EEA_Biology_model_run"]==42432384196
          assert (q["findings"]["benthic_invertebrates"]["source_site_n_before_numeric_EQR_validation"],
                  q["findings"]["benthic_invertebrates"]["numeric_EQR_usable_sites"],
                  q["findings"]["benthic_invertebrates"]["missing_upstream_reported_load_positive"])==(3282,2475,247)
          assert (q["findings"]["phytobenthos"]["source_site_n_before_numeric_EQR_validation"],
                  q["findings"]["phytobenthos"]["numeric_EQR_usable_sites"],
                  q["findings"]["phytobenthos"]["missing_upstream_reported_load_positive"])==(3663,2784,293)
          assert em["source_period_contains_2022_rows"]==13185
          assert ag["source_2022_diffuse_NP1_by_BQE"]["benthic_invertebrates"]["source_2022_agricultural_P_reported_sites"]==142
          assert ag["source_2022_diffuse_NP1_by_BQE"]["benthic_invertebrates"]["agricultural_P_reporting_countries"]==2
          assert ag["source_2022_diffuse_NP1_by_BQE"]["phytobenthos"]["source_2022_agricultural_P_reported_sites"]==184
          assert ag["no_2022_EQR_biological_outcome_read"] is True
          assert perm["status"]=="PASS_SOURCE_LOCKED_CONDITIONAL_PERMUTATION_EXPLORATORY"
          assert perm["posthoc_not_preregistered"] is True
          assert perm["original_5_geographic_folds_reused"] is True
          for group,expo in (("benthic_invertebrates",147),("phytobenthos",110)):
              for chemical in ("P","N"):
                  for name,item in perm["results"][group][chemical].items():
                      assert item["n_permutations"]==199
                      assert item["source_positive_presence_preserved"]
                      assert 0<=item["null_randomized_better_or_equal_count"]<=199
          dst=Path("results/eea2022_bqe_falsification_20261108")
          dst.mkdir(parents=True,exist_ok=True)
          sources=[]
          for old,new in names.items():
              source=base/old
              shutil.copyfile(source,dst/new)
              sources.append({"file":new,"original_run_id":{
                "attrition":42438230754,"wfd":42438360158,
                "emissions-metadata":42438505287,"emissions2022":42438695309,
                "np1":42439118473,"permutations":42439198765}[old.split("/")[0]],
                "original_file_SHA256":hashlib.sha256(source.read_bytes()).hexdigest(),
                "bytes":source.stat().st_size})
          provenance={
            "scientific_scope":"2022 WWTP N/P mass association with benthic EQR; missing-data, agricultural source-coverage and posthoc permutation falsification",
            "source_original_EEA_Biology2026_uncompressed_EQR_sha256":"f11001a57172b618bee95f58fd0ec51c8e71be7b9c01a70927dde21b7ca6e2a9",
            "source_original_2022_EEA_WWTP_BQE_site_registry_sha256":
              "e12df511d64c4c580ef2422dccdbbd11a1309c84d29d467fd4527206e41fa636",
            "original_EEA_biological_model_run":42432384196,
            "original_independent_model_audit_run":42436814278,
            "source_original_2022_EEA_Emissions2026_archive_sha256":
              "8765eea4b5a4d48fc8b34d7a05e2ba42a4af098013dbf992455009c4126252ef",
            "new_source_exact_file_sha256":sources,
            "raw_2026_EEA_Biology_or_Emissions_ZIP_rehosted":False,
            "no_new_network_calls_to_publisher_in_archive":True,
            "primary_causal_sewage_effect_or_P_vs_N_mechanism_proven":False
          }
          (dst/"SOURCE_RECEIPT.json").write_text(json.dumps(provenance,indent=2,ensure_ascii=False,sort_keys=True)+"\n")
          report="""# Wastewater nutrient load and freshwater BQE 2022: reproducibility stress and falsification gates

          This branch is a **follow-up to source-backed exploratory EEA benthic-invertebrate EQR prediction PR #14**, not a new confirmatory ecological effect. All original 2022 source-only site/fold definitions, original measured P/N WWTP tons and normalized EQR outcomes are unchanged. No new EEA biological outcomes were selected to favor significance.

          ## Significant independent data-quality finding
          Original official 2026 Biology EQR table SHA256 is verified. From 3,282 source-linked river benthic records, just **2,475** have original numeric normalized 2022 EQR; **807 Polish** source river sites have missing original raw/normalized EQR and are correctly excluded. Of **394** source-positive candidates, **247 (62.69%)** are missing — original 2022 final analysis includes **147** source-positive.
          For phytobenthos 3,663 candidates, **879** original normalized EQR missing (**802 Poland, 77 Austria**) and 293/403 source-positive (72.70%) dropped, leaving 110 exposed. For fish 57 Austria records missing, including 43 source-positive. Thus original year/region inference has serious reporting selection bias.
          Original old model source QA had incorrectly shown **zero** invalid numeric EQR, due to pandas nullable Boolean NA propagation. This was an **accounting bug**: original model DID exclude these records; numerical fitted EQR results remain unchanged and the QA counts are corrected here. The missing site scores cannot be safely imputed.
          [Actual original source QC](https://github.com/zuizui0223/gesui/actions/runs/42438230754).

          ## Agricultural alternative load is not adequately sampled
          EEA [Waterbase Emissions 2026](https://www.eea.europa.eu/en/datahub/datahubitem-view/5bd950b1-52b9-42f3-b0d7-bf51ff3056b7), first public data source reviewed, has 13,185 records for 2022 and source-coded 2022 regional NP1 **agricultural diffuse** N/P emissions. Correct source categories and no hierarchical double count; kg/a or t/a normalized to tonnes/a, with original measured/estimated/modelled method retained. The data are reported for RBD/subunits, NOT exact river segments.
          Only **142** source-linked benthic candidate sites from **Lithuania/Netherlands** have regional 2022 agriculture P emissions (all **modelled**, not measured), including 20 upstream-WWTP-positive; phytobenthos **184** sites (Lithuania only), 20 source-positive. Therefore the predeclared cross-country P/N–EQR effect cannot be robustly adjusted for independently reported agricultural N/P with this public source. Unreported country/catchment loads remain **missing**, NOT zero.
          [Original source crosswalk](https://github.com/zuizui0223/gesui/actions/runs/42439118473).

          ## NEW exploratory source-amount permutation falsifier
          The original benthic EQR N/P load model gains about P+1.10% and N+1.40% relative heldout MSE. A **posthoc** permutation of **annual load amounts ONLY among original upstream-WWTP-source-positive stations**, keeping all source-zero sites, countries, original 5 spatial folds and (in strict version) river-Q quantile strata fixed, was run 199 times each nutrient. Actual original annual-load station assignment had smaller MSE than **all 199** permutations for **both P and N** in the benthic group, within-country and within-country×Q strata: Monte Carlo extremeness (1+0)/(199+1)=**0.005**, exploratory only.
          For phytobenthos the *strict within-country×Q* permuted-load null beat or tied original **42/199 for P** (Monte Carlo 0.215) and **2/199 for N** (0.015), although the actual geographic heldout MSE gain is only +0.16–0.18% and loses cross-country/geo robustness. Do not promote it to another taxon-wide mechanism.
          This permutation is **not a randomized experiment or a confirmatory p-value**. Source load exchangeability within country/Q is unverified; agricultural runoff, urbanization, river engineering, source nonreporting, and P/N mass collinearity remain. It supports the narrower hypothesis that the reported **magnitude** of wastewater discharge load has some extra predictive arrangement conditional on registered facility presence among observed sites, NOT wastewater-caused EQR change.

          ## Next required independent corroboration
          Require country-independent 2022 agriculture/source loading coverage, fix official WFD significant-pressure reporting codes without using outcome-derived pressure labels as exogenous confounders, independently validate the river-source graph against original HydroRIVERS, and test an **unopened** future region/year cohort with original EQR methods and source-complete years. The existing 2022 physical exposure+prediction cannot establish direct N-vs-P cause.

          All raw original Biology/Emissions archives are with EEA; this branch publishes only matched source-only derived counts, sample QC, original source hashes, a station–regional-source lookup and quantitative exploratory permutation results, without rehosting raw big EEA zip files.
          """
          (dst/"RESULTS.md").write_text("\n".join(s.strip() for s in report.splitlines())+"\n")
          print("GESUI_BQE_2022_SOURCE_AND_FALSIFICATION_AUDIT_ARCHIVED",
               json.dumps({"original_invertebrate_missing_source_sites":807,
                 "invertebrate_source_positive_missing":247,
                 "original_2012_2024_Biology_year":"2022",
                 "agricultural_available_invertebrate_sites":142,
                 "permutation_n_each":199,
                 "source_files_archived":len(sources)},sort_keys=True))
          PY
      - name: Commit strictly audited results on independent research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2022_bqe_falsification_20261108
          git commit -m "Archive independent 2022 EEA EQR nonrandom missingness, agricultural source coverage limitations and posthoc WWTP mass permutation"
          git push origin HEAD:analysis/bqe2022-missingness-wfd-pressure-20261108
