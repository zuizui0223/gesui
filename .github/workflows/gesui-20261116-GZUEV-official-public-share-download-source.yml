name: gesui official Austrian BMLUK GZUEV freshwater station UBA public share file audit
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/original_uba_nextcloud_public_share.py'
      - '.github/workflows/gesui-20261116-GZUEV-official-public-share-download-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get_gzuev_real_station_file_public_share:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public source HTTP library only
        run: python -m pip install --quiet requests
      - name: Inspect only exact original public BMLUK distribution UBA share and its declared file links
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/original_uba_nextcloud_public_share.py
          python -u analysis/20261116_austria_wisa_official_source/original_uba_nextcloud_public_share.py \
            --output '${{ runner.temp }}/original_gzuev_public_share'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-real-BMLUK-GZUEV-UBA-public-share-file-QA
          path: '${{ runner.temp }}/original_gzuev_public_share/'
          retention-days: 90
          if-no-files-found: warn
