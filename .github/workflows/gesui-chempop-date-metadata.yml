name: ChemPop chemistry date metadata source audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'analysis/20261125_chempop_lagged_nutrients/audit_chemistry_dates.py'
      - '.github/workflows/gesui-chempop-date-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'analysis/gesui-chempop-lagged-nutrients-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Audit published source metadata and chemistry date columns
        run: |
          mkdir -p "$RUNNER_TEMP/receipt" "$RUNNER_TEMP/dateaudit"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14599583276/zip > "$RUNNER_TEMP/receipt/chemistry.zip"
          python -u analysis/20261125_chempop_lagged_nutrients/audit_chemistry_dates.py --work "$RUNNER_TEMP/receipt" --out "$RUNNER_TEMP/dateaudit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-chempop-chemistry-date-metadata
          path: ${{ runner.temp }}/dateaudit
          if-no-files-found: warn
          retention-days: 14
