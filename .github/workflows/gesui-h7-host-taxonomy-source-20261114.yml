name: gesui original H7 species to larval host taxonomy source
on:
  push:
    paths:
      - '.github/workflows/gesui-h7-host-taxonomy-source-20261114.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  host-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original recovered 234 H7 source identities
        uses: actions/download-artifact@v4
        with:
          run-id: 43593227162
          name: gesui-H7-234x2x6-only429-source-merged-20261114
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/h7_source
      - name: Test exact-name rank and kingdom gates before remote sources
        run: |
          python -m py_compile scripts/gesui_h7_host_source_20261114.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from gesui_h7_host_source_20261114 import binomial,plant_key
          assert binomial('Urtica dioica')=='urtica dioica'
          assert binomial('Urtica sp.') is None
          assert binomial('Urtica dioica subsp. dioica') is None
          j={'matchType':'EXACT','rank':'SPECIES','kingdom':'Plantae','canonicalName':'Urtica dioica','status':'ACCEPTED','usageKey':123}
          assert plant_key('Urtica dioica',j)=='123'
          assert plant_key('Urtica dioica',dict(j,matchType='FUZZY')) is None
          assert plant_key('Urtica dioica',dict(j,rank='GENUS')) is None
          assert plant_key('Urtica dioica',dict(j,canonicalName='Urtica urens')) is None
          assert plant_key('Urtica dioica',dict(j,status='SYNONYM',acceptedUsageKey=456))=='456'
          print('8 exact taxonomy gate tests PASS; fixtures are not ecological results')
          PY
      - name: Collect exact species aliases, original host records and plant crosswalk
        env:
          H7_SOURCE: ${{ runner.temp }}/h7_source/GESUI_H7_234x2x6_SPECIESKEY_MERGED_SOURCE.json
          HOST_OUT: ${{ runner.temp }}/host_source
        run: python scripts/gesui_h7_host_source_20261114.py
      - name: Preserve all original receipts and explicit source status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-H7-original-303-butterfly-host-taxonomy-20261114
          path: ${{ runner.temp }}/host_source/
          if-no-files-found: warn
          retention-days: 90
