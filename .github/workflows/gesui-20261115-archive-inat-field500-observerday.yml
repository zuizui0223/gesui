name: GESUI archive SHA-pinned iNaturalist observer-day photo reuse audit (no images)
on:
  push:
    branches:
      - analysis/gesui-hns-family-taxon-attribution-20261115
    paths:
      - .github/workflows/gesui-20261115-archive-inat-field500-observerday.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  source-only-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 43705857353
          name: gesui-inat-746-original-observer-day-duplicate-photo-sourceonly
          repository: zuizui0223/gesui
          github-token: "${{ github.token }}"
          path: /tmp/gesui-inat-observer-day-source
      - name: Authenticate source bytes and confirm non-biological inference before copying
        shell: bash
        run: |
          set -euo pipefail
          echo "074c15c7bb408db5d5aba301911035b1ecc89b35e159c2eb3474c31b0baf9c07  /tmp/gesui-inat-observer-day-source/INAT_FIELD500_OBSERVER_DAY_PHOTO_DUPLICATE_SOURCE_QA.json" | sha256sum -c -
          mkdir -p results/20261115_adult_resource_behavior
          cp /tmp/gesui-inat-observer-day-source/INAT_FIELD500_OBSERVER_DAY_PHOTO_DUPLICATE_SOURCE_QA.json results/20261115_adult_resource_behavior/
          python - <<'PY'
          import json
          q=json.load(open("results/20261115_adult_resource_behavior/INAT_FIELD500_OBSERVER_DAY_PHOTO_DUPLICATE_SOURCE_QA.json"))
          assert q["n_full_original_field500_observations"] == 746
          assert q["carrion_candidate_annotated_observations"] == 3
          assert q["carrion_candidate_distinct_observer_days"] == 2
          assert q["n_original_owners_with_both_Lyca_Nymph"] == 18
          assert q["all_original_photo_pixels_NOT_DOWNLOADED_OR_VIEWED"]
          assert q["no_original_HNS_WWTP_or_nutrient_exposure_assessed"]
          PY
      - name: Commit aggregate-only source QA to existing Draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/20261115_adult_resource_behavior/INAT_FIELD500_OBSERVER_DAY_PHOTO_DUPLICATE_SOURCE_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive original 746 iNaturalist source photo-ID and observer-day independence QA"
          git fetch origin analysis/gesui-hns-family-taxon-attribution-20261115
          git rebase origin/analysis/gesui-hns-family-taxon-attribution-20261115
          git push origin HEAD:analysis/gesui-hns-family-taxon-attribution-20261115
