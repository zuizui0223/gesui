name: External original fourcountry sediment paired sample grain and taxon field QA
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_external_fourcountry_source_grain_20261122.py
      - scripts/gesui_external_fourcountry_xlsx_readonly_ooxml.py
      - .github/workflows/gesui-external-fourcountry-source-grain-20261122.yml
permissions:
  contents: read
jobs:
  publisher-sample-identity-and-units:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download original publisher scientific data, exact checksum only
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 480 "https://ndownloader.figshare.com/files/43299387" -o "${{ runner.temp }}/external4c.xlsx"
          printf '1e4d6e37b73c663406e5567dd79d9452  %s\n' "${{ runner.temp }}/external4c.xlsx" | md5sum --check
      - name: Inspect original ANALYSIS_ID pairing and taxon measurement units without fitting ecology models
        run: |
          python -m py_compile scripts/gesui_external_fourcountry_xlsx_readonly_ooxml.py scripts/gesui_external_fourcountry_source_grain_20261122.py
          python -u scripts/gesui_external_fourcountry_source_grain_20261122.py \
            --xlsx "${{ runner.temp }}/external4c.xlsx" \
            --out "${{ runner.temp }}/external4c_source_grain_QA.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-external-fourcountry-source-grain-6491-samples
          path: ${{ runner.temp }}/external4c_source_grain_QA.json
          if-no-files-found: warn
          retention-days: 60
