name: gesui 20261116 reported upstream vs downstream N-P plant NUTRI and butterfly HNS source-faithful H6 test
on:
  push:
    branches:
      - analysis/gesui-20261116-reported-np-direction-plant-hns
    paths:
      - 'analysis/20261116_directional_reported_np/conditional_models.py'
      - '.github/workflows/gesui-20261116-reported-np-direction-plant-hns.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-451-H7-period-up-down-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source WLS / fixed H6 holdout numerical tools
        run: python -m pip install --quiet numpy pandas scipy statsmodels
      - name: Original exact European 4011 EIV-scored species and 451 source-approved H7 periods
        uses: actions/download-artifact@v4
        with:
          run-id: 43718069015
          name: gesui-20261115-EU454-11511-EIV-source-v2-official-hybrid-qa-no-trait-change
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_EIV_451
      - name: Previously source-gated exact original 454 WWTP-report direction crosswalk
        uses: actions/download-artifact@v4
        with:
          run-id: 43789733828
          name: gesui-20261116-updown-2018-2022-reported-NP-plant-HNS-sourceonly-454
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_only_gate
      - name: Reproduce original positive models and test nested N/P up/down directional specificity on full 451 H7 periods
        run: |
          python -m py_compile analysis/20261116_directional_reported_np/conditional_models.py
          python -u analysis/20261116_directional_reported_np/conditional_models.py \
            --eiv '${{ runner.temp }}/original_EIV_451' \
            --gate '${{ runner.temp }}/source_only_gate' \
            --output '${{ runner.temp }}/nested_nutrient_report'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-genuine-451-H7-N-P-reported-updown-vs-plantN-butterflyHNS
          path: ${{ runner.temp }}/nested_nutrient_report/
          retention-days: 90
          if-no-files-found: warn
