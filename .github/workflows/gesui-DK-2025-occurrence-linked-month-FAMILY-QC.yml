name: gesui DK 2025 same-site/month published-Occurrence-linked day butterfly family quality sensitivity
on:
  push:
    branches: ["analysis/dk-ebms-2025-outoftime-lycaenidae-20261110"]
    paths:
      - ".github/workflows/gesui-DK-2025-occurrence-linked-month-FAMILY-QC.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-2023-2025-licensed-joined-event-and-linked-month:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reconstruct the original licensed Event and Occurrence join, and count only dates with published observations
        run: |
          python -m py_compile scripts/gesui_DK_EBMS_2025_same_month_Occurrence_linked_days_posthoc.py
          python -u scripts/gesui_DK_EBMS_2025_same_month_Occurrence_linked_days_posthoc.py \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_SAME_MONTH_OCCURRENCE_LINKED_FAMILY_SENSITIVITY.json
      - name: Preserve aggregate QA and source-cluster leverage on the Draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_SAME_MONTH_OCCURRENCE_LINKED_FAMILY_SENSITIVITY.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit Denmark 2025 same-month original occurrence-linked sample and four-source sensitivity"
          git fetch origin analysis/dk-ebms-2025-outoftime-lycaenidae-20261110
          git rebase origin/analysis/dk-ebms-2025-outoftime-lycaenidae-20261110
          git push origin HEAD:analysis/dk-ebms-2025-outoftime-lycaenidae-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-DK-2025-original-month-linked-occurrence-family-quality-QC
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_SAME_MONTH_OCCURRENCE_LINKED_FAMILY_SENSITIVITY.json
          retention-days: 90
