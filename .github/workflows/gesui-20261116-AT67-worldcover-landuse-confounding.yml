name: gesui original Austria67 2021 ESA WorldCover local urban crop land confounding of 2022 measured WWTP P TP EQR
on:
  push:
    branches:
      - analysis/gesui-20261116-AT67-same-riverbank-S2-landgreenness
    paths:
      - 'analysis/20261116_AT67_riparian_satellite/WorldCover2021_67_WWTP_PQ_confounded_streamTP_benthic.py'
      - '.github/workflows/gesui-20261116-AT67-worldcover-landuse-confounding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_original_WorldCover2021_landuse_against_WWTP_source_PQ:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
      GDAL_HTTP_MAX_RETRY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-official WorldCover COG, genuine 2022 government river chemistry and numerical QA dependencies
        run: python -m pip install --quiet numpy scipy requests "rasterio>=1.4,<2" "pyproj>=3,<4"
      - name: Audit fixed 67 source-station WorldCover local 2021 landclass and test independent 5-geographic-region reported wastewater P/Q gain over landcover
        run: |
          python -m py_compile analysis/20261116_AT67_riparian_satellite/WorldCover2021_67_WWTP_PQ_confounded_streamTP_benthic.py
          python -u analysis/20261116_AT67_riparian_satellite/WorldCover2021_67_WWTP_PQ_confounded_streamTP_benthic.py \
            --output '${{ runner.temp }}/austrian67_official_worldcover2021_landuse_controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-AT67-authentic-WorldCover2021-cropbuilt-2022-riverTP-EQR-WWTP-P-flow
          path: '${{ runner.temp }}/austrian67_official_worldcover2021_landuse_controls/'
          retention-days: 90
          if-no-files-found: warn
