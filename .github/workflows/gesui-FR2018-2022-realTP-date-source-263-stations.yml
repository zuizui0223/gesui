name: gesui real 2018 Peters TP dates at same 263 FR I2M2 river sites, 2022 TP/EQR source

on:
  push:
    paths:
      - "scripts/gesui_FR2018_realTP_harmonized_original_dates_same_263_I2M2_EEA_station_source_gate.py"
      - ".github/workflows/gesui-FR2018-2022-realTP-date-source-263-stations.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-2018-measured-source:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore original source-only 263 EEA2018→2022 same site biological registry and 273 observed-2022 TP stations
        uses: actions/download-artifact@v4
        with:
          run-id: 43372659602
          name: gesui-FR2022-273-trueTP-EQR-reportedP-2018-I2M2-sourcegate
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_EEA_2018_2022_same_station
      - name: Read official Peters TP.2 zip actual date/positive validity ONLY at frozen EEA2018/2022 paired I2M2 source stations
        env:
          ORIGINAL_SOURCE_FR2022_273_TP_EQR_2018_BIOLOGY_QUALITY: ${{ runner.temp }}/original_EEA_2018_2022_same_station/FR2022_273_TP_EQR_SOURCE_P_EEA2018_STATION_CONTINUITY.json
        run: |
          python -m py_compile scripts/gesui_FR2018_realTP_harmonized_original_dates_same_263_I2M2_EEA_station_source_gate.py
          python scripts/gesui_FR2018_realTP_harmonized_original_dates_same_263_I2M2_EEA_station_source_gate.py
      - name: Preserve authenticated original 2018-2022 actual-measured source dates, H7/H6 gate and no numeric outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-FR2018-22-realTP-I2M2-same-263-site-date-SOURCE
          path: ${{ runner.temp }}/gesui_FR2018_2022_TP_datewise_source/
          if-no-files-found: warn
          retention-days: 30
