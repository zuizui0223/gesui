name: gesui USA NWCA2021 EXO External Outfall-only 27state matched standardized plants
on:
  push:
    branches: ["analysis/nwca2021-EXO-external-only-source-20261111"]
    paths:
      - ".github/workflows/gesui-NWCA2021-externalEXO-only-plants-after-source.yml"
      - "scripts/gesui_NWCA2021_external_EXO_only_near10_far20_HALL_FQAI_afterSOURCE.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_corrected_2021_NWCA_plants_true_EXO_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify new true EXO-only source file committed and original unchanged 568 first-visit NWCA site IDs
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy statsmodels
          python -m py_compile scripts/gesui_NWCA2021_external_EXO_only_near10_far20_HALL_FQAI_afterSOURCE.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_NPDES_EXTERNAL_OUTFALL_ONLY_568SITE_SOURCE_GATE.json")
          x=json.loads(p.read_text())
          assert x["all_568_frozen_nwca_plant_water_locations_source_complete"] is True
          assert x["frozen_before_corrected_source_type_biological_comparison_GATES"]["may_open_new_externalOutfall_source_sensitive_2021_biodiversity_effect"] is True
          assert x["new_ExternalOutfall_near10_site_n"]==124
          assert x["new_ExternalOutfall_far20_site_n"]==314
          assert x["new_source_matched_2021_NWCA_sites"]["near10_original_site_n"]==99
          assert x["new_source_matched_2021_NWCA_sites"]["far20_original_site_n"]==140
          print("PASS SOURCE BEFORE 2021 HALL: EXO-only 99 near / 140 far in 27 states")
          PY
      - name: Reacquire exact original 2021 EPA NWCA community and water chemistry CSV with no NPDES 2026 source changes
        run: |
          mkdir -p /tmp/gesui-NWCA2021-exo-bio
          for item in siteinfo waterchem_wide vegmetrics hydrology_sources_wide; do
            curl --retry 4 --connect-timeout 25 --max-time 240 --fail --location --silent --show-error \
              "https://www.epa.gov/system/files/other-files/2024-05/nwca21_$item-data.csv" \
              -o "/tmp/gesui-NWCA2021-exo-bio/nwca21_$item-data.csv"
          done
      - name: On identical original source sites run site-equal and NWCA acreage-weighted plant Shannon/Floristic Quality with EXO-only source
        run: |
          python -u scripts/gesui_NWCA2021_external_EXO_only_near10_far20_HALL_FQAI_afterSOURCE.py \
            --source-dir /tmp/gesui-NWCA2021-exo-bio \
            --out results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_EXOONLY_239SITE_PLANTS_TNTP_EXPOSURE_SENSITIVITY.json
      - name: Archive every EXO-only site-equal/area-weighted sign, original 2026 source uncertainty and observed 2021 water NP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_EXOONLY_239SITE_PLANTS_TNTP_EXPOSURE_SENSITIVITY.json
          git diff --cached --quiet && exit 0
          git commit -m "Report strict true EXO-only USA NWCA2021 239 standard vegetation source proximity effects regardless of sign"
          git fetch origin analysis/nwca2021-EXO-external-only-source-20261111
          git rebase origin/analysis/nwca2021-EXO-external-only-source-20261111
          git push origin HEAD:analysis/nwca2021-EXO-external-only-source-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NWCA2021-239plot-external-outfall-only-plants-and-water
          path: results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_EXOONLY_239SITE_PLANTS_TNTP_EXPOSURE_SENSITIVITY.json
          retention-days: 90
