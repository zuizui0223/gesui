name: gesui locked outfall24249 public measured TN TP verification and TP companion

on:
  push:
    branches:
      - "analysis/nutrient-source-coverage-20261107"
    paths:
      - "scripts/gesui_focal_24249_measured_tntp.py"
      - ".github/workflows/gesui-focal-tntp-measurements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests pandas numpy
      - name: Original figshare v5 measured TN TP and unavailable-site audit
        run: python -u scripts/gesui_focal_24249_measured_tntp.py --out /tmp/gesui24249/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-focal24249-original-TNTP-source-and-measured-TP
          path: /tmp/gesui24249/
          if-no-files-found: warn
          retention-days: 30
