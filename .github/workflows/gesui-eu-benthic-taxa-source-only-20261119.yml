name: gesui Europe benthic source-only original sample-taxon availability
on:
  push:
    paths:
      - 'analysis/20261119_europe_benthic_taxa/**'
      - '.github/workflows/gesui-eu-benthic-taxa-source-only-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded source-only original dataset catalogue and availability
        run: |
          python -m py_compile analysis/20261119_europe_benthic_taxa/source_inventory.py
          python -u analysis/20261119_europe_benthic_taxa/source_inventory.py \
            --output "${{ runner.temp }}/gesui_benthic_source/EU_ORIGINAL_BENTHIC_TAXON_AVAILABILITY_SOURCEONLY.json"
      - name: Download and inspect official EA Biosys sample taxon schemas (no biological outcomes)
        run: |
          python -m py_compile analysis/20261119_europe_benthic_taxa/inspect_ea_biosys_zip_schema.py
          python -u analysis/20261119_europe_benthic_taxa/inspect_ea_biosys_zip_schema.py \
            --out "${{ runner.temp }}/gesui_benthic_source/EA_BIOSYS_AND_CHEMPOP_SOURCE_SCHEMA.json"
      - name: Inspect official ChemPop version 2 data ZIP within bounded original source audit
        run: |
          python -m py_compile analysis/20261119_europe_benthic_taxa/inspect_chempop_v2_zip_schema.py
          python -u analysis/20261119_europe_benthic_taxa/inspect_chempop_v2_zip_schema.py \
            --out "${{ runner.temp }}/gesui_benthic_source/CHEMPOP_V2_ORIGINAL_ZIP_SCHEMAS.json"
      - name: Source-verify UK family BMWP scoring dictionary and exact EA taxon names
        run: |
          python -m pip install --quiet 'pyreadr>=0.5,<1'
          python -m py_compile analysis/20261119_europe_benthic_taxa/audit_biotic_family_scores_source.py
          python -u analysis/20261119_europe_benthic_taxa/audit_biotic_family_scores_source.py \
            --out "${{ runner.temp }}/gesui_benthic_source/UK_BMWP_FAMILY_SCORE_SOURCE_ONLY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261119-European-benthic-sample-taxon-source-only
          path: ${{ runner.temp }}/gesui_benthic_source/
          if-no-files-found: warn
          retention-days: 90
