name: gesui NRSA 2023-24 official PHab source and pre-outcome metric QA
on:
  push:
    paths:
      - scripts/gesui_NRSA2324_PHAB_source_only.py
      - .github/workflows/gesui-nrsa2324-PHAB-source.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  original-EPA-PHAB:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_UID
      - name: Original EPA PHab UID and publisher metadata before ecological outcome regression
        env:
          FROZEN_2129_SOURCE: ${{ runner.temp }}/frozen_UID/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
        run: |
          python -m py_compile scripts/gesui_NRSA2324_PHAB_source_only.py
          python -u scripts/gesui_NRSA2324_PHAB_source_only.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa2324-phab-original-UID-source-only
          path: ${{ runner.temp }}/gesui_phab_source/NRSA2324_PHAB_SOURCE_ONLY_QA_20261114.json
          if-no-files-found: warn
          retention-days: 60
