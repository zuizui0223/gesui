name: gesui DK 2025 NEW399 original month x 1deg region 3vs5-family source-scale sensitivity
on:
  push:
    branches: ["analysis/dk-ebms-2025-new399-source-coverage-20261110"]
    paths:
      - ".github/workflows/gesui-DK-2025-NEW399-region-month-standardization.yml"
      - "scripts/gesui_DK_2025_NEW399_1deg_calendar_month_family_standardization.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  NEW399-source-frozen-month-region-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reparse original licensed eBMS family counts, exact NEW399 source cohort, 1degree common months with available observations
        run: |
          python -m py_compile scripts/gesui_DK_2025_NEW399_1deg_calendar_month_family_standardization.py
          python -u scripts/gesui_DK_2025_NEW399_1deg_calendar_month_family_standardization.py \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_NEW399_1DEG_MONTH_MATCHED_LYCAENIDAE_3VS5_FAMILY_QC.json
      - name: Freeze only licensed source-aggregated month/region calendar and 4000 descriptive geographic block resamples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_NEW399_1DEG_MONTH_MATCHED_LYCAENIDAE_3VS5_FAMILY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Record 2025 Danish NEW399 month and region matched family composition denominator and recording-rate sensitivity"
          git fetch origin analysis/dk-ebms-2025-new399-source-coverage-20261110
          git rebase origin/analysis/dk-ebms-2025-new399-source-coverage-20261110
          git push origin HEAD:analysis/dk-ebms-2025-new399-source-coverage-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-DK-2025-NEW399-month1degree-source-matched-family
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2025_NEW399_1DEG_MONTH_MATCHED_LYCAENIDAE_3VS5_FAMILY_QC.json
          retention-days: 90
