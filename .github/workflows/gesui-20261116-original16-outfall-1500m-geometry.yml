name: gesui same-river ±1500m original sixteen WWTP source geometry
on:
  push:
    branches:
      - analysis/gesui-outfall-local-riparian-trait-source-gate-20261116
    paths:
      - 'analysis/20261116_outfall_riparian_local_source/local_1500m_hydrologic_route.py'
      - '.github/workflows/gesui-20261116-original16-outfall-1500m-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate_original_outfall_anchored_two_riparian_geometries:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial original source formats and projection controls
        run: python -m pip install --quiet numpy pandas pyarrow geopandas "shapely>=2,<3" pyproj
      - uses: actions/download-artifact@v4
        with:
          run-id: 42364866919
          name: gesui-real-hydrorivers-eu-geometry-source-gate-v01
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_original16
      - name: Acquire exact signed original Europe HydroRIVERS v1 conversion with physical directed segment lines
        run: |
          mkdir -p '${{ runner.temp }}/rivers'
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o '${{ runner.temp }}/rivers/HydroRIVERS_v10_eu.geoparquet'
          echo '5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  ${{ runner.temp }}/rivers/HydroRIVERS_v10_eu.geoparquet' | sha256sum -c -
      - name: Walk the actual directed four-reach U2-U1-outfall-D1 path ±1500m and source-only geometry gates
        run: |
          python -m py_compile analysis/20261116_outfall_riparian_local_source/local_1500m_hydrologic_route.py
          python -u analysis/20261116_outfall_riparian_local_source/local_1500m_hydrologic_route.py \
            --source '${{ runner.temp }}/source_original16' \
            --rivers '${{ runner.temp }}/rivers/HydroRIVERS_v10_eu.geoparquet' \
            --output '${{ runner.temp }}/original16_local_output'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-source-authentic-local1500m-original16-outfalls-geospatial-QA
          path: ${{ runner.temp }}/original16_local_output/
          retention-days: 90
          if-no-files-found: warn
