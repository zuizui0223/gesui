name: gesui independent NumPy check 2008 raw counted EPT and benthic TN TP
on:
  push:
    paths:
      - scripts/audit_NRSA0809_raw_EPT_NP_PHab_manual_numpy.py
      - .github/workflows/gesui-nrsa0809-EPT-numeric-independent-QA.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  raw-2008-source-manual-HUC8-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-five-original-EPA-source-census
          run-id: 43562414140
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/first_source
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa0809-original-BERWW-TAXA-ID-to-ORDER-source-QA
          run-id: 43563239544
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/taxon_source
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-EPT-fraction-source-fidelity
          run-id: 43563366026
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fidelity
      - name: Reconstitute full original US EPA 2008 source and strict raw counted EPT fraction per UID
        env:
          ORIGINAL_2008_SOURCE: ${{ runner.temp }}/first_source/NRSA0809_EPA_ORIGINAL_SOURCE_ONLY_COUNT_AND_GRANULARITY.json
          ORIGINAL_TAXON_QA: ${{ runner.temp }}/taxon_source/NRSA0809_BERWW_TOTAL300_TAXA_ID_ORDER_ORIGINAL_CROSSWALK_SOURCE_QA.json
          ORIGINAL_EPT_FIDELITY: ${{ runner.temp }}/fidelity/NRSA0809_EPT_REAL_TOTAL300_SOURCE_PUBLISHED_FIDELITY_QA.json
        run: python scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py > ${{ runner.temp }}/original_source_model.log
      - name: Independent source raw panel NumPy Ridge, HUC8 sandwich and unclassified taxon bound
        run: |
          python -m py_compile scripts/audit_NRSA0809_raw_EPT_NP_PHab_manual_numpy.py
          python scripts/audit_NRSA0809_raw_EPT_NP_PHab_manual_numpy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa0809-EPT-NP-PHab-independent-matrix-original-countQA
          path: ${{ runner.temp }}/gesui0809_reconstructed_EPT/NRSA0809_EPT_TNTP_PHab_THREE_RESPONSES_MANUAL_NUMPY_QA.json
          if-no-files-found: warn
          retention-days: 60
