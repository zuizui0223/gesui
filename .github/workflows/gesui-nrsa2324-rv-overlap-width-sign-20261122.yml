name: NRSA23 matched river-size width sign falsifier
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_nrsa2324_rv_overlap_width_sign_20261122.py
      - .github/workflows/gesui-nrsa2324-rv-overlap-width-sign-20261122.yml
permissions:
  contents: read
  actions: read
jobs:
  original-rv-physical-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install same original-analysis numeric tools
        run: |
          python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.3,<2" "statsmodels>=0.14,<1"
          python -m py_compile scripts/gesui_nrsa2324_rv_overlap_width_sign_20261122.py
      - name: Freeze ORIGINAL source-only RV flow/width cutoffs from prior distinct run
        uses: actions/download-artifact@v4
        with:
          name: nrsa2324-rv-overlap-original-source-only
          run-id: 45016249520
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_rv_source_qa
      - name: Download original same-visit EPA site, water, habitat and benthic biology
        run: |
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_siteinfo.csv" -o "${{ runner.temp }}/siteinfo.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_waterchemistry.csv" -o "${{ runner.temp }}/waterchem.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_physicalhabitat_metrics.csv" -o "${{ runner.temp }}/physicalhabitat.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-09/nrsa2324_benthiccount.csv" -o "${{ runner.temp }}/benthiccount.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-09/nrsa2324_benthicmmi.csv" -o "${{ runner.temp }}/benthicmmi.csv"
      - name: Compare unchanged models in official RV and source-locked common flow+width bands
        run: |
          python -u scripts/gesui_nrsa2324_rv_overlap_width_sign_20261122.py \
            --siteinfo "${{ runner.temp }}/siteinfo.csv" \
            --waterchem "${{ runner.temp }}/waterchem.csv" \
            --physicalhabitat "${{ runner.temp }}/physicalhabitat.csv" \
            --benthiccount "${{ runner.temp }}/benthiccount.csv" \
            --benthicmmi "${{ runner.temp }}/benthicmmi.csv" \
            --source-qa "${{ runner.temp }}/original_rv_source_qa/rv_overlap_source_qa.json" \
            --out "${{ runner.temp }}/rv_overlap_benthic_results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2324-rv-flow-width-common-support-signed-results
          path: ${{ runner.temp }}/rv_overlap_benthic_results.json
          if-no-files-found: warn
          retention-days: 60
