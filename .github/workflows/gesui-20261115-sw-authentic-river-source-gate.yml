name: GESUI Sweden 2022 authentic river x EEA outfall x BMS point source-only
on:
  push:
    branches:
      - analysis/gesui-hns-family-taxon-attribution-20261115
    paths:
      - analysis/20261115_riparian_source_only/audit_sw2022_original_river_and_outfalls.py
      - .github/workflows/gesui-20261115-sw-authentic-river-source-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-eea-hydrorivers-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Restore exact legacy 2022 official EEA SE369 14-outfall geodesic source-only comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gesui-2022-sw-authentic
          curl -fLsS --retry 3 --max-time 100 \
            "https://raw.githubusercontent.com/zuizui0223/gesui/57dc7edab3c23244bdff5430265c0a346906f3b6/results/lycaenidae_2022_effort_rich_new5km/SWEDEN_2022_SEBMS_EVENT_SITE_METADATA_OUTFALL_DISTANCES_SOURCE_ONLY.csv" \
            -o /tmp/gesui-2022-sw-authentic/PR21_LEGACY_SWEDEN2022.csv
      - name: Install original hydraulic geospatial readers and EEA REST tools
        run: python -m pip install -q "numpy>=1.26,<3" "pandas>=2.1,<3" "requests>=2.31" "geopandas>=1.0" "pyogrio>=0.9" "pyproj>=3.6" "shapely>=2.0"
      - name: Verify locked SeBMS sites, old EEA source geometry and real original HydroRIVERS; no species outcome
        shell: bash
        run: |
          set -euo pipefail
          python -u analysis/20261115_riparian_source_only/audit_sw2022_original_river_and_outfalls.py \
            --freeze docs/FROZEN_PROTOCOL_20261115_WITHIN_H7_RIPARIAN_HNS_ONE_SHOT.md \
            --sites results/20261115_riparian_source_only/SEBMS_2022_POINT_SITE_LOCATIONS_SOURCE_ONLY.csv \
            --legacy /tmp/gesui-2022-sw-authentic/PR21_LEGACY_SWEDEN2022.csv \
            --tmpdir /tmp/gesui-2022-sw-authentic \
            --output results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_SOURCE_FEASIBILITY.json \
            --siteoutput results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_SITE_DISTANCE_SOURCE_ONLY.csv \
            --relations results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_DIRECTION_SOURCE_RELATIONS.csv
          python -c "import json; z=json.load(open('results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_SOURCE_FEASIBILITY.json')); assert z['study']['n_2022_point_site_locations']==264 and not z['biological_primary_run'] and z['source_original_eea2022']['qualified_single_freshwater_outfalls']==14"
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-sebms-sw2022-authentic-original-river-outfall-sourceonly
          path: |
            results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_SOURCE_FEASIBILITY.json
            results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_SITE_DISTANCE_SOURCE_ONLY.csv
            results/20261115_riparian_source_only/SW2022_ORIGINAL_RIVER_DIRECTION_SOURCE_RELATIONS.csv
          if-no-files-found: error
