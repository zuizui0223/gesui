name: gesui FR263 HydroRIVERS source pinned converted GeoParquet geometry QA
on:
  push:
    branches:
      - analysis/gesui-20261117-onepaper-pathway-identification-decision
    paths:
      - 'analysis/20261117_FR263_riverland/fr263_SHA_pinned_HydroRIVERS_geoparquet_geometry_QA.py'
      - '.github/workflows/gesui-20261117-FR263-thirdparty-SHA-HydroRIVERS-geoparquet-geometry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/20261117_FR263_riverland/fr263_SHA_pinned_HydroRIVERS_geoparquet_geometry_QA.py'
      - '.github/workflows/gesui-20261117-FR263-thirdparty-SHA-HydroRIVERS-geoparquet-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_station_with_pinned_conversion_riverline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source GIS dependencies
        run: python -m pip install --quiet numpy pandas geopandas "shapely>=2,<3" pyproj pyarrow
      - uses: actions/download-artifact@v4
        with:
          run-id: 43373061409
          name: gesui-FR2018-22-realTP-I2M2-same-263-site-date-SOURCE
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original263-date-source
      - name: Download pinned v1 HydroRIVERS GeoParquet third-party converted source, never call it original ZIP
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/river_conversion"
          curl --fail --location --show-error --silent --retry 3 --max-time 350 \
            'https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet' \
            --output "${{ runner.temp }}/river_conversion/HydroRIVERS_v10_eu.geoparquet"
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  ${{ runner.temp }}/river_conversion/HydroRIVERS_v10_eu.geoparquet" | sha256sum --check -
      - name: Recover same 263 physical WQ/EQR sites with original 262 native HYRIV IDs and metric line geometry
        run: |
          python -m py_compile analysis/20261117_FR263_riverland/fr263_SHA_pinned_HydroRIVERS_geoparquet_geometry_QA.py
          python -u analysis/20261117_FR263_riverland/fr263_SHA_pinned_HydroRIVERS_geoparquet_geometry_QA.py \
            --geo results/20261117_FR263_FIXED_ORIGINAL_EEA2022_STATION_COORDINATES_SOURCE_ONLY.csv \
            --datesource '${{ runner.temp }}/original263-date-source/FR2018_2022_TRUE_TP_I2M2_SOURCE_ONLY_STATION_DATES_ELIGIBLE.json' \
            --hydrorivers '${{ runner.temp }}/river_conversion/HydroRIVERS_v10_eu.geoparquet' \
            --out '${{ runner.temp }}/FR263_converted_hydrorivers_sourceQA'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261117-FR263-HydroRIVERS-v1-thirdparty-conversion-geometry-only
          path: '${{ runner.temp }}/FR263_converted_hydrorivers_sourceQA/'
          retention-days: 90
          if-no-files-found: warn
