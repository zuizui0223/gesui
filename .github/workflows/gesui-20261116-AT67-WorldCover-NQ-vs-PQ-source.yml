name: gesui Austria67 original reported 2022 wastewater N over Q versus P over Q nutrient specificity
on:
  push:
    branches:
      - analysis/gesui-20261116-AT67-same-riverbank-S2-landgreenness
    paths:
      - 'analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_NQ_vs_PQ_reported_WWTP.py'
      - '.github/workflows/gesui-20261116-AT67-WorldCover-NQ-vs-PQ-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_original_Austria67_measuredWQ_benthic_vs_WWTP_N_P_report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
      GDAL_HTTP_MAX_RETRY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source government water observations and original WorldCover pixel and statistics dependencies
        run: python -m pip install --quiet numpy scipy requests "rasterio>=1.4,<2" "pyproj>=3,<4"
      - name: Compare same original 2022 source plant N and P/Q upstream and downstream predictive information to real Austria river TP and benthic EQR with 2021 landcover, five spatial blocks, no causality
        run: |
          python -m py_compile analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_NQ_vs_PQ_reported_WWTP.py
          python -u analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_NQ_vs_PQ_reported_WWTP.py \
            --output '${{ runner.temp }}/austria67_observed_upstream_reported_N_vs_P_WWTP_source'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-Austria67-source-reportedN-vs-P-Q-realstreamTP-benthicEQ
          path: '${{ runner.temp }}/austria67_observed_upstream_reported_N_vs_P_WWTP_source/'
          retention-days: 90
          if-no-files-found: warn
