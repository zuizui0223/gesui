name: gesui source-authentic EIV 6-trait complete-case same-plant-source H7 support
on:
  push:
    branches:
      - analysis/gesui-eu454-eiv-specificity-20261115
    paths:
      - 'analysis/20261115_eiv_specificity/assemble_common_six.py'
      - '.github/workflows/gesui-eiv6-common-original-source-gate-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-six-indicator-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy pandas requests
      - uses: actions/download-artifact@v4
        with:
          run-id: 43718069015
          name: gesui-20261115-EU454-11511-EIV-source-v2-official-hybrid-qa-no-trait-change
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_v2
      - uses: actions/download-artifact@v4
        with:
          run-id: 43593227162
          name: gesui-H7-234x2x6-only429-source-merged-20261114
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_facets
      - name: Confirm same original GBIF plant species score all 6 EIV, no HNS/W outcome opened
        run: |
          python -m py_compile analysis/20261115_eiv_specificity/assemble_common_six.py
          python -u analysis/20261115_eiv_specificity/assemble_common_six.py \
            --v2 '${{ runner.temp }}/source_v2' \
            --facets '${{ runner.temp }}/original_facets' \
            --output '${{ runner.temp }}/six_eiv_source'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-EU454-EIV-six-indicator-shared-species-source-gate
          path: ${{ runner.temp }}/six_eiv_source/
          retention-days: 90
          if-no-files-found: warn
