name: GESUI archive source verified 2015 carrion photo geometry and licence-only QA
on:
  push:
    branches:
      - analysis/gesui-hns-family-taxon-attribution-20261115
    paths:
      - .github/workflows/gesui-20261115-archive-three-carrion-original-features.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  source-only-feature-output:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 43707869730
          name: gesui-three-carrion-only-original-photo-metadata-feature-distances
          repository: zuizui0223/gesui
          github-token: "${{ github.token }}"
          path: /tmp/gesui-2015-carrion-photo-features
      - name: Check numerical feature source file and no original photo bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "629e8ea6dd51a73b38ef5034a156b3ff49b5ef023cd0e552f3332d65dce37820  /tmp/gesui-2015-carrion-photo-features/INAT_3_CARRION_ORIGINAL_TRANSIENT_PHOTO_FEATURE_QA.json" | sha256sum -c -
          mkdir -p results/20261115_adult_resource_behavior
          cp /tmp/gesui-2015-carrion-photo-features/INAT_3_CARRION_ORIGINAL_TRANSIENT_PHOTO_FEATURE_QA.json results/20261115_adult_resource_behavior/
          python - <<'PY'
          import json
          q=json.load(open("results/20261115_adult_resource_behavior/INAT_3_CARRION_ORIGINAL_TRANSIENT_PHOTO_FEATURE_QA.json"))
          pairs=q["photo_pair_source_similarity_NO_BEHAVIOR_CONCLUSION"]
          x=next(p for p in pairs if p["original_photo_ids"]==[260028346,260029204])
          assert x["ORB_Lowe_ratio0p7_matching_keypoint_count"]==77
          assert x["ORB_RANSAC_5px_homography_inliers"]==75
          assert q["same_owner_same_day_2015_public_site_distance_km"]==0
          assert q["no_original_photo_pixel_bytes_stored_in_GitHub_results"]
          assert q["no_visible_proboscis_or_carcase_identity_confirmed"]
          assert q["no_HNS_WWTP_or_measured_nutrient_exposure"]
          PY
      - name: Archive only original numeric source features on existing Draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/20261115_adult_resource_behavior/INAT_3_CARRION_ORIGINAL_TRANSIENT_PHOTO_FEATURE_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive license-checked original iNat 2015 shared-photo-scene features, no images"
          git fetch origin analysis/gesui-hns-family-taxon-attribution-20261115
          git rebase origin/analysis/gesui-hns-family-taxon-attribution-20261115
          git push origin HEAD:analysis/gesui-hns-family-taxon-attribution-20261115
