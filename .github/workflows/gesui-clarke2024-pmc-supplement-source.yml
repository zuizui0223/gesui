name: gesui Clarke2024 original NLM supplementary tables source
on:
  push:
    paths: ['.github/workflows/gesui-clarke2024-pmc-supplement-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve declared public open-access package and original supplementary tables
        run: |
          python - <<'PY'
          import urllib.request,xml.etree.ElementTree as ET,pathlib,json,hashlib,tarfile,io
          out=pathlib.Path('clarke2024_pmc');out.mkdir()
          receipts=[]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'gesui-ecology-source/1'})
              with urllib.request.urlopen(req,timeout=120) as r:b=r.read();ct=r.headers.get('Content-Type','')
              receipts.append({'url':url,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'content_type':ct})
              return b
          try:
              raw=get('https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id=PMC10771928')
              (out/'oa_manifest.xml').write_bytes(raw)
              root=ET.fromstring(raw)
              links=[x.attrib['href'] for x in root.iter('link') if x.attrib.get('format')=='tgz']
              if len(links)!=1:raise RuntimeError('No unique publicly declared OA article package')
              url=links[0].replace('ftp://','https://',1)
              blob=get(url)
              with tarfile.open(fileobj=io.BytesIO(blob),mode='r:gz') as tar:
                  for m in tar.getmembers():
                      if m.isfile() and m.name.lower().endswith(('.xlsx','.xml','.nxml','.txt','.csv')):
                          b=tar.extractfile(m).read();name=pathlib.PurePosixPath(m.name).name
                          (out/name).write_bytes(b)
                          receipts.append({'package_member':m.name,'file':name,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
                          print('ORIGINAL_PACKAGE_MEMBER',name,len(b),flush=True)
          finally:
              (out/'SOURCE_MANIFEST.json').write_text(json.dumps(receipts,indent=2))
              print(json.dumps(receipts,indent=2),flush=True)
          PY
      - name: Preserve publisher article and original supplementary tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-clarke2024-nlm-original-supplements-20261114
          path: clarke2024_pmc/
          retention-days: 90
          if-no-files-found: error
