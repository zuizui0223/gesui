name: gesui Clarke2024 original NLM supplementary tables source
on:
  push:
    paths: ['.github/workflows/gesui-clarke2024-pmc-supplement-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve NLM documented 2026 anonymous S3 article objects and verify declared MD5
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,pathlib,json,hashlib
          out=pathlib.Path('clarke2024_pmc');out.mkdir()
          receipts=[];base='https://pmc-oa-opendata.s3.amazonaws.com/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'gesui-ecology-source/1'})
              with urllib.request.urlopen(req,timeout=120) as r:b=r.read();ct=r.headers.get('Content-Type','')
              receipts.append({'url':url,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'content_type':ct})
              return b
          try:
              raw=get(base+'?list-type=2&prefix=PMC10771928.&delimiter=/')
              (out/'version_listing.xml').write_bytes(raw)
              root=ET.fromstring(raw);ns={'s':'http://s3.amazonaws.com/doc/2006-03-01/'}
              prefixes=[x.text for x in root.findall('s:CommonPrefixes/s:Prefix',ns)]
              if not prefixes:raise RuntimeError('No public article version listed')
              prefix=sorted(prefixes,key=lambda x:int(x.rstrip('/').split('.')[-1]))[-1]
              stem=prefix.rstrip('/')
              raw=get(base+prefix+stem+'.json');(out/'article_metadata.json').write_bytes(raw);meta=json.loads(raw)
              if meta.get('pmcid')!='PMC10771928' or meta.get('doi','').lower()!='10.1002/ece3.10834':raise RuntimeError('Wrong article')
              if meta.get('is_retracted') or not meta.get('is_pmc_openaccess'):raise RuntimeError('Article eligibility failed')
              print('IDENTITY_AND_LICENSE',json.dumps(meta),flush=True)
              selected=[meta.get('xml_url'),meta.get('text_url')]+meta.get('media_urls',[])
              n_xlsx=0
              for address in selected:
                  if not address:continue
                  u=urllib.parse.urlparse(address);name=pathlib.PurePosixPath(u.path).name
                  if not name.lower().endswith(('.xlsx','.xml','.nxml','.txt','.csv')):continue
                  if u.scheme!='s3' or u.netloc!='pmc-oa-opendata':raise RuntimeError('Unexpected declared download host')
                  expected=urllib.parse.parse_qs(u.query).get('md5',[None])[0]
                  if not expected:raise RuntimeError('Missing publisher MD5')
                  b=get(base+u.path.lstrip('/'))
                  if hashlib.md5(b).hexdigest()!=expected:raise RuntimeError('Declared source MD5 mismatch')
                  (out/name).write_bytes(b);receipts[-1].update({'file':name,'MD5_verified':expected})
                  n_xlsx+=name.lower().endswith('.xlsx')
                  print('ORIGINAL_OBJECT_VERIFIED',name,len(b),flush=True)
              if n_xlsx<1:raise RuntimeError('No original tabular supplements')
          finally:
              (out/'SOURCE_MANIFEST.json').write_text(json.dumps(receipts,indent=2))
              print(json.dumps(receipts,indent=2),flush=True)
          PY
      - name: Preserve article text and original supplementary tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-clarke2024-nlm-original-supplements-20261114
          path: clarke2024_pmc/
          retention-days: 90
          if-no-files-found: error
