name: gesui true NRSA2324 physical canopy riverbed confounders nutrient biomass
on:
  push:
    paths:
      - scripts/gesui_NRSA2324_PHAB_NP_AFDM_CHLA_models.py
      - .github/workflows/gesui-nrsa2324-PHAB-biofilm-numeric.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  source-frozen-true-PHab-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "statsmodels>=0.14,<1" "scipy>=1.12,<2"
      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen18
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen2324
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa2324-phab-original-UID-source-only
          run-id: 43459407538
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozenPHab
      - name: Reconstruct the earlier same-UID 1828 original N/P AFDM Chla EPA observations
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/frozen18/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/frozen2324/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
        run: |
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/original_biofilm_aggregate_only.txt
      - name: Pre-numeric EPA PHab SHA and native UID source-only frozen; fit same-visit HUC8 geo+physical+N/P contrasts
        env:
          FROZEN_PHAB_SOURCE_QA: ${{ runner.temp }}/frozenPHab/NRSA2324_PHAB_SOURCE_ONLY_QA_20261114.json
        run: |
          python -m py_compile scripts/gesui_NRSA2324_PHAB_NP_AFDM_CHLA_models.py
          python -u scripts/gesui_NRSA2324_PHAB_NP_AFDM_CHLA_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa2324-phab-NP-areal-AFDM-chla-pigment-observed
          path: ${{ runner.temp }}/gesui_biomass_numeric/NRSA2324_PHAB_NUTRIENT_PIGMENT_AREAL_BIOMASS_POSTHOC.json
          if-no-files-found: warn
          retention-days: 60
