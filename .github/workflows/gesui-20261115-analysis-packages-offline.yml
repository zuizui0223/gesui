name: gesui offline source packages 42-test cross-environment verification
on:
  push:
    paths:
      - "analysis/20261114_host_network/**"
      - "analysis/20261114_network_robustness/**"
      - "analysis/20261115_host_scores/**"
      - "analysis/20261115_hns/**"
      - ".github/workflows/gesui-20261115-analysis-packages-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-source-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [20261114_host_network, 20261114_network_robustness, 20261115_host_scores, 20261115_hns]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical libraries (no external ecology source download)
        run: python -m pip install --quiet "numpy>=1.26,<3" "scipy>=1.11" "pandas>=2" "scikit-learn>=1.3"
      - name: Test original frozen package without pretending third-party source retrieval
        run: python -m unittest discover -s "analysis/${{ matrix.package }}/tests" -p 'test_*.py' -v
