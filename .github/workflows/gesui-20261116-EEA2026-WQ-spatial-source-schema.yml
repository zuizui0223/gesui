name: gesui official EEA 2026 2.8MB WQ spatial site-ID coordinates source schema
on:
  push:
    branches:
      - analysis/gesui-reported-np-40h6-source-gate-20261116
    paths:
      - 'analysis/20261116_reported_np_source/audit_official_2026_wq_spatial_schema.py'
      - '.github/workflows/gesui-20261116-EEA2026-WQ-spatial-source-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_2026_waterquality_spatial_schema_only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: Verify official 2026 2.8MB spatial metadata ZIP source SHA and native station ID geometry columns
        run: |
          python -m py_compile analysis/20261116_reported_np_source/audit_official_2026_wq_spatial_schema.py
          python -u analysis/20261116_reported_np_source/audit_official_2026_wq_spatial_schema.py \
             --output '${{ runner.temp }}/official_spatial_schema'
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-20261116-EEA2026-original-WQ-spatial-monitoring-schema-only
          path: ${{ runner.temp }}/official_spatial_schema/
          retention-days: 90
          if-no-files-found: warn
