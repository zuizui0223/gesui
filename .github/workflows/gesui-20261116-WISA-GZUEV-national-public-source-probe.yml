name: gesui Austrian WISA H2O GZUEV genuine official 2022 common river source access
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/public_catalog_and_wisa_access.py'
      - '.github/workflows/gesui-20261116-WISA-GZUEV-national-public-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_official_gzuev_mz_benthos_chemistry_access_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public source HTTP client only
        run: python -m pip install --quiet requests
      - name: Read documented official public GZÜV dataset metadata and public WISA H2O entrypoints
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/public_catalog_and_wisa_access.py
          python -u analysis/20261116_austria_wisa_official_source/public_catalog_and_wisa_access.py \
            --output '${{ runner.temp }}/WISA_official_source_access'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-WISA-GZUEV-river-2022-public-access-sourceonly
          path: '${{ runner.temp }}/WISA_official_source_access/'
          retention-days: 90
          if-no-files-found: warn
