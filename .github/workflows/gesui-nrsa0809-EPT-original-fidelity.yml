name: gesui original EPA2008 EPT counted vs published metric source fidelity
on:
  push:
    paths:
      - scripts/gesui_NRSA0809_EPT_raw_to_published_fidelity.py
      - .github/workflows/gesui-nrsa0809-EPT-original-fidelity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exactly-source-reconstructed-EPT-published-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "pandas>=2.1,<3" "numpy>=1.26,<3"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa0809-original-BERWW-TAXA-ID-to-ORDER-source-QA
          run-id: 43563239544
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_taxonomy
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-wade-BERWW-CHEMW-HUC8-gate
          run-id: 43562599406
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_survey
      - name: Audit exact original EPT count fraction against EPA-published EPT percentage
        env:
          ORIGINAL_TAXON_SOURCE_QA: ${{ runner.temp }}/original_taxonomy/NRSA0809_BERWW_TOTAL300_TAXA_ID_ORDER_ORIGINAL_CROSSWALK_SOURCE_QA.json
          ORIGINAL_2008_FIVE_SOURCE_QA: ${{ runner.temp }}/original_survey/NRSA0809_ORIGINAL_WADEABLE_BENTHIC_CHEMW_PHAB_SEMANTICS.json
        run: |
          python -m py_compile scripts/gesui_NRSA0809_EPT_raw_to_published_fidelity.py
          python -u scripts/gesui_NRSA0809_EPT_raw_to_published_fidelity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NRSA0809-original-EPT-fraction-source-fidelity
          path: ${{ runner.temp }}/gesui0809_count_fidelity/NRSA0809_EPT_REAL_TOTAL300_SOURCE_PUBLISHED_FIDELITY_QA.json
          if-no-files-found: warn
          retention-days: 60
