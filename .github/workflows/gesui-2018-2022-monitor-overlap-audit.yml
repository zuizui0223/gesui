name: gesui 2018-vs-2022 exact EQR monitoring sites and WWTP source reuse audit

on:
  push:
    branches:
      - "analysis/uwwtd2018-independent-bqe-validation-20261108"
    paths:
      - "scripts/audit_2018_2022_monitor_site_overlap.py"
      - ".github/workflows/gesui-2018-2022-monitor-overlap-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent-observation-QC:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only numerical data QC dependencies
        run: python -m pip install --quiet numpy pandas scipy
      - name: Exact original source-locked 2018 and 2022 monitoring station overlap and annual reported load presence
        run: |
          python -u scripts/audit_2018_2022_monitor_site_overlap.py \
            --year2018 results/eea2018_independent_temporal_bqe_20261108 \
            --year2022 results/eea2022_biology_bqe_20261108 \
            --out results/eea2018_independent_temporal_bqe_20261108/CROSS_YEAR_MONITOR_SITE_OVERLAP_AND_REPORTING_QC.json
      - name: Version the posthoc source-reuse diagnostic without refitting original 2018 or 2022 EQR models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2018_independent_temporal_bqe_20261108/CROSS_YEAR_MONITOR_SITE_OVERLAP_AND_REPORTING_QC.json
          git commit -m "Audit exact 2018/2022 EQR site overlap, methodology and report-source changes"
          git push origin HEAD:analysis/uwwtd2018-independent-bqe-validation-20261108
