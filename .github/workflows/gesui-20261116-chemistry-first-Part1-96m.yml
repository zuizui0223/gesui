name: gesui chemistry-first original 2026 EEA Part1 96m river TNTP source
on:
  push:
    branches:
      - analysis/gesui-20261116-chemistry-first-EU232-watershed
    paths:
      - 'analysis/20261116_chemistry_first_eu232/source_first_part1_TNTP.py'
      - 'docs/PROTOCOL_20261116_EEA_CHEMISTRY_FIRST_PART1_DISAGGREGATED_EXTENSION.md'
      - '.github/workflows/gesui-20261116-chemistry-first-Part1-96m.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_part1_strict_chemistry_source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal original-source dependencies and verify DEFLATE64 tool
        run: |
          python -m pip install --quiet requests
          7z | head -n 3
      - name: Restore original PRE-chemistry station H7 geometry freeze from prior successful Part2-only source gate
        uses: actions/download-artifact@v4
        with:
          run-id: 43816554985
          name: gesui-20261116-chemistry-first-original-EU232-H7-WQ-source-gates
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/genuine_232H7_geography
      - name: Stream FULL original 96m disaggregated EEA samples and report true 2018/2022 TNTP support only
        run: |
          python -m py_compile analysis/20261116_chemistry_first_eu232/source_first_part1_TNTP.py
          python -u analysis/20261116_chemistry_first_eu232/source_first_part1_TNTP.py \
            --geography '${{ runner.temp }}/genuine_232H7_geography' \
            --output '${{ runner.temp }}/source_only_part1_TNTP'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-chemistry-first-full96m-Part1-EU232-source-only
          path: |
            ${{ runner.temp }}/source_only_part1_TNTP/CHEMISTRY_FIRST_EU232_PART1_SOURCE_GATE.json
            ${{ runner.temp }}/source_only_part1_TNTP/CHEMISTRY_FIRST_EU232_PART1_H7_PERIOD_AMBIENT_TNTP.csv
          retention-days: 90
          if-no-files-found: warn
