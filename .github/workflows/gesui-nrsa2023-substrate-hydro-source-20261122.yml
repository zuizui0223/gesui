name: EPA2023 source-only substrate and hydrological covariate opportunity
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_nrsa2023_substrate_hydro_source_only_20261122.py
      - .github/workflows/gesui-nrsa2023-substrate-hydro-source-20261122.yml
permissions:
  contents: read
jobs:
  original-source-field-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.3,<2"
          python -m py_compile scripts/gesui_nrsa2023_substrate_hydro_source_only_20261122.py
      - name: Original EPA files for source environment only
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_siteinfo.csv" -o "${{ runner.temp }}/sites.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_waterchemistry.csv" -o "${{ runner.temp }}/water.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_physicalhabitat_metrics.csv" -o "${{ runner.temp }}/habitat.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_periphytonchlorophyll-a.csv" -o "${{ runner.temp }}/chla.csv"
      - name: Inspect substrate source and hydrological cover WITHOUT outcome data
        run: |
          python -u scripts/gesui_nrsa2023_substrate_hydro_source_only_20261122.py \
            --sites "${{ runner.temp }}/sites.csv" \
            --water "${{ runner.temp }}/water.csv" \
            --habitat "${{ runner.temp }}/habitat.csv" \
            --chla "${{ runner.temp }}/chla.csv" \
            --out "${{ runner.temp }}/2023_substrate_hydro_source_qa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2023-substrate-hydrology-original-source-only
          path: ${{ runner.temp }}/2023_substrate_hydro_source_qa.json
          if-no-files-found: warn
          retention-days: 60
