name: gesui Peters measured TN TP station river-topology match (source only)

on:
  push:
    branches:
      - "analysis/nutrient-source-coverage-20261107"
    paths:
      - "scripts/gesui_nutrient_station_network_gate.py"
      - ".github/workflows/gesui-nutrient-network-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet geopandas pandas pyarrow numpy scipy shapely
      - name: Fetch original station-metadata coverage, not the plant outcome
        run: |
          mkdir -p /tmp/gesui-stations
          gh run download 42369645480 --repo zuizui0223/gesui \
            --name gesui-Peters2026-TNTP-station-site-coverage --dir /tmp/gesui-stations
      - name: Fetch original v1-derived HydroRIVERS, verify immutable source hash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-stations/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-stations/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Snap nutrient stations <=500m and audit actual directed graph relationships
        run: |
          python -u scripts/gesui_nutrient_station_network_gate.py \
            --candidates /tmp/gesui-stations/nutrient_candidate_station_proximities.csv \
            --prior-coverage /tmp/gesui-stations/SOURCE_COVERAGE.json \
            --design results/hydrorivers_eu_source_gate_20261107/candidate_site_design.json \
            --river-parquet /tmp/gesui-stations/HydroRIVERS_v10_eu.geoparquet \
            --out /tmp/gesui-stations/network-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-Peters2026-TNTP-verified-river-network-coverage
          path: /tmp/gesui-stations/network-results/
          retention-days: 30
          if-no-files-found: warn
