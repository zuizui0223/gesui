name: gesui 2016 EEA BQE JRC GREEN NUTS2 predicted EQ R independent regional and country influence QA
on:
  push:
    branches: ["analysis/eea2016-thirdyear-benthic-NP-source-20261111"]
    paths:
      - ".github/workflows/gesui-2016-JRC-NUTS2-benthic-EQR-independent-QA.yml"
      - "scripts/audit_gesui_EEA2016_JRC_green_NP_benthic_phytobenthos_region_CV_country_influence.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent2016_EEA_EQR_region_disjoint_BQE_2014to18_JRC_sourceQA:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Independently verify 2016 real benthic and phytobenthos region CV metrics, region unit, 5fold and original JRC N/P collinearity without re-fetching EQR
        run: |
          python -m pip install --quiet "numpy<3" scipy
          python -m py_compile scripts/audit_gesui_EEA2016_JRC_green_NP_benthic_phytobenthos_region_CV_country_influence.py
          python -u scripts/audit_gesui_EEA2016_JRC_green_NP_benthic_phytobenthos_region_CV_country_influence.py \
            --out results/eea2016_thirdyear_source_20261111/2016_REAL_BENTHIC_EQR_JRC_GREEN_NUTS2_INDEPENDENT_COUNTRY_FOLD_QA.json
      - name: Preserve source-based original 2016 country influence and N/P collinearity full falsification rather than causal association
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2016_thirdyear_source_20261111/2016_REAL_BENTHIC_EQR_JRC_GREEN_NUTS2_INDEPENDENT_COUNTRY_FOLD_QA.json
          git diff --cached --quiet && exit 0
          git commit -m "Independently verify 2016 site vs region heldout MSE, country influences, N/P model collinearity on true official EEA and JRC source cohorts"
          git fetch origin analysis/eea2016-thirdyear-benthic-NP-source-20261111
          git rebase origin/analysis/eea2016-thirdyear-benthic-NP-source-20261111
          git push origin HEAD:analysis/eea2016-thirdyear-benthic-NP-source-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2016-original-benthic-JRC-point-NP-country-regionCV-independent-QA
          path: results/eea2016_thirdyear_source_20261111/2016_REAL_BENTHIC_EQR_JRC_GREEN_NUTS2_INDEPENDENT_COUNTRY_FOLD_QA.json
          retention-days: 90
