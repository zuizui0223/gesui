name: gesui global sPlotOpen 95k ORIGINAL vegetation plot source-only quality and WPI geometry
on:
  push:
    branches: ["analysis/global-splotopen-2015-WWp-plots-feasibility-20261110"]
    paths:
      - ".github/workflows/gesui-sPlotOpen95k-2015-WWp-sourceONLY.yml"
      - "scripts/gesui_splotopen_95104_source_only_plot_quality_and_WPI_overlap.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_splotopen95k_source_plots_before_species:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install numerical/geo source support only and identify Git LFS provenance
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy
          git lfs version
      - name: Fetch exact original open sPlotOpen header ONLY from public secondary dataset mirror with LFS-SHA check (NO species data)
        run: |
          git clone -q --depth 1 --filter=blob:none https://github.com/ezequielscott/sPlotOpen.git /tmp/gesui-splotopen-source
          GIT_LFS_SKIP_SMUDGE=1 git -C /tmp/gesui-splotopen-source lfs pull \
            --include='3474_76_Dataset/sPlotOpen_header(3).txt' --exclude=''
          echo 'b20e21c70bf1c7fc2d79db403797e018bacbc38f74bb851dcf28825bc131977a  /tmp/gesui-splotopen-source/3474_76_Dataset/sPlotOpen_header(3).txt' | sha256sum -c -
          test "$(wc -c < '/tmp/gesui-splotopen-source/3474_76_Dataset/sPlotOpen_header(3).txt')" -eq 24975505
      - name: Screen actual 95k 2000-2015 full-vascular 1-1000m2 plot quality and original source WPI1055 port opportunity, never species
        run: |
          python -m py_compile scripts/gesui_splotopen_95104_source_only_plot_quality_and_WPI_overlap.py
          python -u scripts/gesui_splotopen_95104_source_only_plot_quality_and_WPI_overlap.py \
            --header '/tmp/gesui-splotopen-source/3474_76_Dataset/sPlotOpen_header(3).txt' \
            --out results/global_splotopen_WWp2015_20261110/ORIGINAL_SPLOTOPEN95K_2000_15_PLOT_SOURCE_ONLY_GEOGRAPHY_QC.json
      - name: Archive original independent vegetation plot source gate, not licensed plot-level coordinate or species data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/global_splotopen_WWp2015_20261110/ORIGINAL_SPLOTOPEN95K_2000_15_PLOT_SOURCE_ONLY_GEOGRAPHY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze global sPlotOpen95k real plot site source year/area/precision and original WPI overlap without plant taxa"
          git fetch origin analysis/global-splotopen-2015-WWp-plots-feasibility-20261110
          git rebase origin/analysis/global-splotopen-2015-WWp-plots-feasibility-20261110
          git push origin HEAD:analysis/global-splotopen-2015-WWp-plots-feasibility-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-original-sPlotOpen-95k-2000to2015-site-only-header-QC
          path: results/global_splotopen_WWp2015_20261110/ORIGINAL_SPLOTOPEN95K_2000_15_PLOT_SOURCE_ONLY_GEOGRAPHY_QC.json
          retention-days: 90
