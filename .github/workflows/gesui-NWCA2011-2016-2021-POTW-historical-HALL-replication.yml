name: gesui NWCA2011 2016 2021 registered POTW national H_ALL unweighted vs surveyweighted replication
on:
  push:
    branches: ["analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111"]
    paths:
      - ".github/workflows/gesui-NWCA2011-2016-2021-POTW-historical-HALL-replication.yml"
      - "scripts/gesui_NWCA2011_2016_2021_POTW_near10_HALL_HNAT_FQAI_temporal_source_replay.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historical_NWCA2011_2016_2021_HALL_source_frozen_replication:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install standardized vegetation model dependencies, validate original protected source-only gates
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy statsmodels
          python -m py_compile scripts/gesui_NWCA2011_2016_2021_POTW_near10_HALL_HNAT_FQAI_temporal_source_replay.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_POTW2026_SOURCE_ONLY_NEAR10_FAR20_2CYCLE.json')
          obj=json.loads(p.read_text())
          for yr in ('2011','2016'):
              v=obj['source_2011_2016_years'][yr]
              assert v['source_precommitted_independent_year_gate']['may_open_original_NWCA_H_ALL_and_fit_2011_2016_comparison']
              assert v['all_original_source_site_plant_metrics_NOT_ACCESSED_before_2026_NPDES_geo_classification']
              print(yr,v['original_shared_state_and_ecoregion_near10_far20_source_n'])
          PY
      - name: Reacquire EXACT same original official 2011 and 2016 EPA source CSVs after historical source SHA frozen
        run: |
          mkdir -p /tmp/gesui-nwca-history
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-04/nwca11_siteinfo.csv" \
            -o /tmp/gesui-nwca-history/2011_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/sites/default/files/2016-10/nwca2011_vegmetrics.csv" \
            -o /tmp/gesui-nwca-history/2011_vegmetrics.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2022-04/nwca-2016-site-information-data_0.csv" \
            -o /tmp/gesui-nwca-history/2016_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-03/nwca_2016_veg_metrics.csv" \
            -o /tmp/gesui-nwca-history/2016_vegmetrics.csv
      - name: Reproduce original 2021 national weighted-positive/equal-negative reference, fit blind 2011/2016 true plant H_ALL against same POTW source geography
        run: |
          python -u scripts/gesui_NWCA2011_2016_2021_POTW_near10_HALL_HNAT_FQAI_temporal_source_replay.py \
            --source-dir /tmp/gesui-nwca-history \
            --out results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_2021_POTW_NEAR10_FAR20_HALL_THREE_SURVEY_YEARS.json
      - name: Archive all older-year source-controlled national vegetation slopes irrespective of sign, no WWTP discharge claim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_2021_POTW_NEAR10_FAR20_HALL_THREE_SURVEY_YEARS.json
          git diff --cached --quiet && exit 0
          git commit -m "Compare real NWCA2011 2016 independent wetland plants H_ALL source equal/weighted POTW near10 against original 2021"
          git fetch origin analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git rebase origin/analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git push origin HEAD:analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NWCA2011-2016-2021-POTW-plants-HALL-3cycles
          path: results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_2021_POTW_NEAR10_FAR20_HALL_THREE_SURVEY_YEARS.json
          retention-days: 90
