name: Gesui Clarke 2024 independent catalogue source gate
on:
  pull_request:
    paths:
      - '.github/workflows/gesui-20261124-clarke-source-gate.yml'
      - 'analysis/20261124_lycaenidae_resource_network/gesui_clarke*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install pandas==2.2.3 openpyxl==3.1.5 requests
      - name: Retrieve actual PMC OA-listed XLSX keys, inspect source content only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clarke_source"
          python - <<'PY'
          import requests,hashlib,io,json,os,zipfile,pathlib,pandas as pd
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'clarke_source'
          base='https://pmc-oa-opendata.s3.amazonaws.com/'
          # Inventory from prior signed source attempt run 45385384325, artifact 14915862892.
          keys=[f'PMC10771928.1/ECE3-14-e10834-s{i:03d}.xlsx' for i in range(1,6)]
          out={'doi':'10.1002/ece3.10834','pmcid':'PMC10771928','prior_inventory_run':45385384325,'prior_inventory_artifact':14915862892,'files':{},'attempts':[],'stage':'source_only_no_ecological_fit'}
          def get(k):
              errors=[]
              for host in [base,'https://pmc-oa-opendata.s3.us-east-1.amazonaws.com/']:
                  url=host+k
                  try:
                      r=requests.get(url,timeout=(10,25));r.raise_for_status();b=r.content
                      if not b.startswith(b'PK'):raise ValueError('not a ZIP/XLSX: '+repr(b[:80]))
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          if '[Content_Types].xml' not in z.namelist():raise ValueError('not OOXML')
                      sheets=pd.read_excel(io.BytesIO(b),header=None,sheet_name=None,dtype=str)
                      schema={s:{'rows':len(d),'columns':len(d.columns),'head':d.head(8).fillna('').iloc[:,:25].values.tolist()} for s,d in sheets.items()}
                      name=k.split('/')[-1];(root/name).write_bytes(b)
                      return name,{'url':r.url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'schema':schema},errors
                  except Exception as e:errors.append({'key':k,'url':url,'error':str(e)[:300]})
              return k,None,errors
          with ThreadPoolExecutor(max_workers=5) as pool:
              for name,rec,errors in pool.map(get,keys):
                  if rec:out['files'][name]=rec
                  out['attempts'].extend(errors)
          out['status']='XLSX_ACQUIRED_CONTENT_AUDIT_REQUIRED' if out['files'] else 'SOURCE_STOP'
          (root/'source_receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('CLARKE_S3_RECEIPT='+json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-clarke2024-pmc-xlsx-inventory
          path: ${{ runner.temp }}/clarke_source/
          if-no-files-found: error
          retention-days: 30
