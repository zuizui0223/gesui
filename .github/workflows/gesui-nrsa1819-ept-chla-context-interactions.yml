name: gesui 2018 true EPT-Chla canopy-embeddedness effect-modification macro

on:
  push:
    paths:
      - scripts/gesui_NRSA1819_EPT_CHLA_PHAB_five_context_interactions.py
      - .github/workflows/gesui-nrsa1819-ept-chla-context-interactions.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-native-frozen-moderators:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproducible numpy/pandas statsmodels
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen18
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozenCHLA
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1819-ept-chla-phab-source-native-UID
          run-id: 43528570410
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozenTriad
      - name: Rebuild original authentic EPA source cohort from previously fixed source-only manifests
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/frozen18/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/frozenCHLA/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
          FROZEN_TRIAD_SOURCE: ${{ runner.temp }}/frozenTriad/NRSA1819_ORIGINAL_EPT_CHLA_PHAB_SOURCE_ONLY_QA.json
        run: |
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/old_source_rebuild.log
          python scripts/gesui_NRSA1819_EPT_CHLA_PHAB_true_triad_models.py > ${{ runner.temp }}/triad_original_rebuild.log
      - name: Source-precommitted five moderator interactions, quadratic Chla and HUC8 whole-catchment holdouts
        run: |
          python -m py_compile scripts/gesui_NRSA1819_EPT_CHLA_PHAB_five_context_interactions.py
          python scripts/gesui_NRSA1819_EPT_CHLA_PHAB_five_context_interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa1819-EPT-Chla-five-physical-interactions-original-source
          path: ${{ runner.temp }}/gesui1819_triad_numeric/NRSA1819_EPT_CHLA_PHAB_INTERACTION_SOURCE_SIGNED_EXPLORATORY.json
          if-no-files-found: warn
          retention-days: 60

# The code sample-frame is fixed before outcome moderation; no automatic merge.
