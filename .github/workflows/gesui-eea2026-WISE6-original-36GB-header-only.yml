name: gesui 2026 official WISE6 36GB individual-chemistry CSV original HEADER ONLY
on:
  push:
    branches: ["analysis/lycaenidae-2022-measured-river-P-source-20261109"]
    paths:
      - "scripts/gesui_eea2026_wise6_disaggregated_range_header_only.py"
      - ".github/workflows/gesui-eea2026-WISE6-original-36GB-header-only.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  official-source-prefix-2MB-no-chemical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify original WISE6 2026 36GB individual 2022 TP schema using bounded 2MiB ZIP deflate prefix
        run: |
          python -m py_compile scripts/gesui_eea2026_wise6_disaggregated_range_header_only.py
          python -u scripts/gesui_eea2026_wise6_disaggregated_range_header_only.py \
            --out results/lycaenidae_2022_measured_river_P_bridge/EEA2026_WISE6_ORIGINAL_DISAGGREGATED_36GB_CSV_HEADER_ONLY_QC.json
      - name: Preserve official source WISE6 2022 site/measurement field names without numeric data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_2022_measured_river_P_bridge/EEA2026_WISE6_ORIGINAL_DISAGGREGATED_36GB_CSV_HEADER_ONLY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Preserve exact EEA2026 WISE6 individual-water TP 36GB source header through bounded original ZIP range"
          git fetch origin analysis/lycaenidae-2022-measured-river-P-source-20261109
          git rebase origin/analysis/lycaenidae-2022-measured-river-P-source-20261109
          git push origin HEAD:analysis/lycaenidae-2022-measured-river-P-source-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2026-WISE6-original-36GB-disaggregated-source-header-only
          path: results/lycaenidae_2022_measured_river_P_bridge/EEA2026_WISE6_ORIGINAL_DISAGGREGATED_36GB_CSV_HEADER_ONLY_QC.json
          retention-days: 90
          if-no-files-found: warn
