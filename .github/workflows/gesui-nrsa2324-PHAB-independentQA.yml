name: gesui NRSA2324 PHab nutrient biofilm independent pure NumPy audit
on:
  push:
    paths:
      - scripts/audit_NRSA2324_PHAB_NP_manual_numpy.py
      - .github/workflows/gesui-nrsa2324-PHAB-independentQA.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-physical-source-independent-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "statsmodels>=0.14,<1" "scipy>=1.12,<2"
      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen18
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen2324
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa2324-phab-original-UID-source-only
          run-id: 43459407538
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozenPHab
      - name: Reconstruct original EPA 2023–24 1,828 strict same-UID chemistry AFDM and Chla panel
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/frozen18/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/frozen2324/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
        run: python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/original_source_computation.log
      - name: Independent same-original-PHab source scan and original fixed model for honest agreement
        env:
          FROZEN_PHAB_SOURCE_QA: ${{ runner.temp }}/frozenPHab/NRSA2324_PHAB_SOURCE_ONLY_QA_20261114.json
        run: python scripts/gesui_NRSA2324_PHAB_NP_AFDM_CHLA_models.py > ${{ runner.temp }}/original_PHab_model.log
      - name: Completely separate Numpy normal equation, clustered sandwich and HUC8 OOF bootstrap
        run: |
          python -m py_compile scripts/audit_NRSA2324_PHAB_NP_manual_numpy.py
          python scripts/audit_NRSA2324_PHAB_NP_manual_numpy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa2324-phab-NP-independent-manual-OOS-clusterQA
          path: ${{ runner.temp }}/gesui_biomass_numeric/NRSA2324_PHAB_NP_INDEPENDENT_MANUAL_QA.json
          if-no-files-found: warn
          retention-days: 60
