name: gesui actual EPA nutrient vs biomass EPT two-era HUC8 CV

on:
  push:
    paths:
      - "scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py"
      - ".github/workflows/gesui-nrsa-nutrient-periphyton-EPT.yml"
  pull_request:
    paths:
      - "scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py"
      - ".github/workflows/gesui-nrsa-nutrient-periphyton-EPT.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  numeric-source-locked:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible matrix tools
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Immutable original benthic UID list from pre-effect PR58
        uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_benthos
      - name: New true 2018/23 biomass ID & unit crosswalk SOURCE artifact
        uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_biomass
      - name: Measured EPA TN/TP vs exact-visit biomass/chlorophyll/EPT (exploratory)
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/frozen_benthos/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/frozen_biomass/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
        run: |
          python -m py_compile scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py
      - name: Store inspectable aggregate outcome and source lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-epa-nrsa-two-era-measured-nutrient-biomass-ept-observational
          path: ${{ runner.temp }}/gesui_biomass_numeric/OBSERVED_NRSA_NUTRIENT_PERIPHYTON_EPT_TWO_ERAS_NO_WWTP_CAUSAL.json
          if-no-files-found: warn
          retention-days: 30
