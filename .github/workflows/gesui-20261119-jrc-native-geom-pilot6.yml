name: GESUI JRC native HydroID=6 versus BasinID=6 one-polygon SOURCE pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gesui-20261119-jrc-native-geom-pilot6.yml
      - analysis/20261119_jrc_native_basins/jrc_native_point_soil_id6_geom_pilot.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Shapely geometry for source polygon comparison
        run: python -m pip install --disable-pip-version-check shapely==2.0.6
      - name: Test EsriJSON polygon and hole conversion
        run: python -m unittest discover -s tests -p 'test_jrc_native_soil_point_geometry30_gate.py' -v
      - name: Compare one predefined soil HydroID 6 and point BasinID 6 original polygons in EPSG3035
        run: python analysis/20261119_jrc_native_basins/jrc_native_point_soil_id6_geom_pilot.py --out results/20261119_jrc_native_geom_pilot
      - name: Preserve source-only one-case pilot regardless of pass/fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-JRC-HydroID6-pointBasinID6-one-polygon-pilot
          path: results/20261119_jrc_native_geom_pilot/
          if-no-files-found: warn
          retention-days: 45
