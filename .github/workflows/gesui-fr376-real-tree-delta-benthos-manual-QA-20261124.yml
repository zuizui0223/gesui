name: Independent France376 real 2018 2022 IO tree EEA benthic change manual NumPy QA
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_fr376_real_IO_LULC_tree_delta_EEA_EQR_change_manual_NumPy_20261124.py
      - .github/workflows/gesui-fr376-real-tree-delta-benthos-manual-QA-20261124.yml
permissions:
  contents: read
  actions: read
jobs:
  true_source_pass_then_original_EEA_EQR_delta:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixed source-site and nested ridge numerical packages
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-20261117-RZ2018-2018Benthic-2639-source-only-physical-class-areas
          run-id: 44004357868
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_EEA_RZ2018
      - uses: actions/download-artifact@v4
        with:
          name: gesui-RZ2018-to-2022-benthos-same-station-source-only
          run-id: 45095545359
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_2018_2022_EEA_same_station
      - uses: actions/download-artifact@v4
        with:
          name: gesui-France381-real-2018RZ-to2022-benthos-EQR-spatial-holdout
          run-id: 45096054949
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous_signed_original_lagged_EQR
      - uses: actions/download-artifact@v4
        with:
          name: gesui-FR381-IO-2018-2022-full-native-10m-tree-class-quality-source
          run-id: 45247194137
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_376_annual_LULC_pixel_source
      - uses: actions/download-artifact@v4
        with:
          name: gesui-FR376-real-2018-22-tree-class-delta-to-EEA-benthic-change
          run-id: 45247849723
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed_original_model
      - name: Recover true original 2022 EEA benthic source exactly by Git blob SHA
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/analysis/eea2026-waterbase-biology-bqe-20261108"
          git show FETCH_HEAD:results/eea2022_biology_bqe_20261108/BENTHIC_INVERTEBRATES_2022_SOURCE_EQR.csv > "${{ runner.temp }}/original_2022_real_EQR.csv"
          test "$(git hash-object "${{ runner.temp }}/original_2022_real_EQR.csv")" = "325f199e985d9862ffee5b0edb205c61a7be3833"
      - name: Independently replay fivefold manual Ridge10 source EQR change and original 14block bootstrap
        run: |
          python -m py_compile scripts/audit_fr376_real_IO_LULC_tree_delta_EEA_EQR_change_manual_NumPy_20261124.py
          python -u scripts/audit_fr376_real_IO_LULC_tree_delta_EEA_EQR_change_manual_NumPy_20261124.py \
            --rz "${{ runner.temp }}/source_EEA_RZ2018/EEA2018_2018_RIPARIAN_ZONES_REST_OFFICIAL_SOURCE_ONLY_QA.json" \
            --eq22 "${{ runner.temp }}/original_2022_real_EQR.csv" \
            --cohort_source "${{ runner.temp }}/frozen_2018_2022_EEA_same_station/2018_to2022_riparian_benthos_same_site_SOURCE.json" \
            --old_original_lagged "${{ runner.temp }}/previous_signed_original_lagged_EQR/FR2018_RZ2018_TO_EEA2022_ACTUAL_BENTHIC_EQR_FUTURE.json" \
            --land_source "${{ runner.temp }}/original_376_annual_LULC_pixel_source/FR381_IO_10M_2018_2022_YEARPAIRED_CLASS_SOURCE_QUALITY.json" \
            --original_result "${{ runner.temp }}/signed_original_model/FR376_2018_2022_REAL_TREE_CLASS_DELTA_BENTHIC_EQR_DELTA_RESULTS.json" \
            --out "${{ runner.temp }}/FR376_IO_CLASS_CHANGE_BENTHIC_DELTA_INDEPENDENT_NUMPY_QA.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-FR376-IO-tree-change-EEA-EQR-change-independent-NumPy-QA
          path: ${{ runner.temp }}/FR376_IO_CLASS_CHANGE_BENTHIC_DELTA_INDEPENDENT_NUMPY_QA.json
          if-no-files-found: warn
          retention-days: 60
