name: gesui independent 2018 WWTP N P -> BQE replication replay and archival evidence

on:
  push:
    branches:
      - "analysis/uwwtd2018-independent-bqe-validation-20261108"
    paths:
      - "scripts/audit_eea2018_temporal_bqe_source.py"
      - ".github/workflows/gesui-preserve-2018-independent-bqe-results.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  independent-2018-biological-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent model replay components
        run: python -m pip install --quiet numpy pandas scipy scikit-learn
      - name: Restore original genuine 2018 EEA normalized EQR after independent source-only cohort freeze
        run: |
          mkdir -p /tmp/gesui2018-outcome /tmp/gesui2018-audit
          gh run download 42442266935 --repo zuizui0223/gesui \
            --name gesui-independent-2018-real-WWTP-NP-vs-2018-aquatic-EQR-outcomes \
            --dir /tmp/gesui2018-outcome
      - name: Independent 2018 source SHA, biological units, geography/folds and all N/P models verified
        run: |
          python -u scripts/audit_eea2018_temporal_bqe_source.py \
            --source results/eea2018_independent_source_frozen_20261108/2018_SOURCE_ONLY_BQE_WWTP_NP_UPSTREAM_AND_NEGATIVE_CONTROL.csv \
            --receipt results/eea2018_independent_source_frozen_20261108/SOURCE_RECEIPT.json \
            --original-outcome-dir /tmp/gesui2018-outcome \
            --out /tmp/gesui2018-audit/INDEPENDENT_2018_TEMPORAL_BQE_AUDIT.json
      - name: Archive original 2018 EQR and independently reproduced P/N load model outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          original=Path("/tmp/gesui2018-outcome")
          audited=Path("/tmp/gesui2018-audit/INDEPENDENT_2018_TEMPORAL_BQE_AUDIT.json")
          q=json.loads(audited.read_text())
          raw=json.loads((original/"2018_ORIGINAL_TEMPORAL_BQE_REPLICATION.json").read_text())
          assert q["status"]=="PASS_INDEPENDENT_2018_SOURCE_ONLY_SHA_5FOLD_REGIONAL_MSE_REPRODUCTION"
          assert q["original_2018_benthic_temporal_replication_predeclared_pass"] is True
          assert q["phytobenthos_2018_temporal_replication_predeclared_pass"] is False
          assert q["fish_2018_failed_original_source_geo_support"] is True
          assert (raw["results"]["benthic_invertebrates"]["source_QC"]["2018_valid_original_numeric_normalized_EQR"],
                  raw["results"]["benthic_invertebrates"]["source_QC"]["2018_valid_EQR_upstream_reported_measured_NP_sites"])==(2634,202)
          assert (raw["results"]["phytobenthos"]["source_QC"]["2018_valid_original_numeric_normalized_EQR"],
                  raw["results"]["phytobenthos"]["source_QC"]["2018_valid_EQR_upstream_reported_measured_NP_sites"])==(2670,220)
          assert q["2018_frozen_preoutcome_registry_SHA256"]=="5a074f5182711c4ab74ef9bdacfa3918e9fcb434dd0b75c67072a0f06459c3e1"
          dest=Path("results/eea2018_independent_temporal_bqe_20261108")
          dest.mkdir(parents=True,exist_ok=True)
          originals=[
             "2018_ORIGINAL_TEMPORAL_BQE_REPLICATION.json",
             "benthic_invertebrates_2018_WWTP_source_real_EQR.csv",
             "phytobenthos_2018_WWTP_source_real_EQR.csv"]
          for fname in originals:
              shutil.copyfile(original/fname,dest/fname)
          shutil.copyfile(audited,dest/"INDEPENDENT_2018_TEMPORAL_BQE_AUDIT.json")
          files=[{"file":x.name,"SHA256":hashlib.sha256(x.read_bytes()).hexdigest(),
                  "bytes":x.stat().st_size,
                  "original_outcome_run":42442266935}
                 for x in dest.iterdir() if x.is_file()]
          receipt={
            "frozen_source_only_2018_run":42441999786,
            "frozen_source_2018_saved_before_numerical_EQR_run":42442109868,
            "source_2018_measured_NP_original_QC_run":42441852933,
            "biological_year_2018_original_outcome_run":42442266935,
            "source_2018_vs_response_2018_year_aligned":True,
            "independent_2018_source_only_country_folds_reused":True,
            "source_only_preoutcome_sha256":"5a074f5182711c4ab74ef9bdacfa3918e9fcb434dd0b75c67072a0f06459c3e1",
            "original_EEA2018_UWWTD_version":"eea_t_uwwtd-waterbase_p_2017-2018_v07_r01",
            "source_Biology2026_EQR_uncompressed_sha256":
                 "f11001a57172b618bee95f58fd0ec51c8e71be7b9c01a70927dde21b7ca6e2a9",
            "source_Biology2026_EQR_actual_sha256":
                 "f11001a57172b618bee95f58fd0ec51c8e71be7b9c01a70927dde21b7ca6e2a9",
            "original_files":files,
            "no_raw_EEA_2018_or_Biology2026_ZIP_redistributed":True,
            "original_wastewater_source_causal_ecological_effect":False,
            "original_predeclared_2018_benthic_P_N_temporal_replication":True,
            "original_2018_phyto_or_fish_temporal_replication":False,
          }
          # Check the original EEA Biology EQR SHA here is source-level,
          # not regenerated by a posthoc optimization or altered to fit
          # favorable signs.
          if raw["official_EEA_Biology_original_uncompressed_SHA256"]!=receipt["source_Biology2026_EQR_actual_sha256"]:
              raise ValueError("Historical Biology 2018 original source SHA mismatched")
          (dest/"SOURCE_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          bs=raw["results"]["benthic_invertebrates"]
          ph=raw["results"]["phytobenthos"]
          for chem in ("P","N"):
              assert bs["nutrients"][chem]["fixed_source_year_geographic_holdout"]["passes_predeclared_temporal_prediction_direction_rule"]
              assert not ph["nutrients"][chem]["fixed_source_year_geographic_holdout"]["passes_predeclared_temporal_prediction_direction_rule"]
          def part(group,chem):
              s=group["nutrients"][chem]["fixed_source_year_geographic_holdout"]
              m=s["heldout_MSE_MAE_and_folds"]
              return m["M0_country_method_hydrogeo"]["heldout_MSE"],m["M1_plus_2018_upstream_measured_mass"]["heldout_MSE"],m["M2_plus_2018_downstream_source_placebo"]["heldout_MSE"]
          src=bs["source_QC"]
          lines=[
          "# Independent year 2018 replication: actual WWTP measured P/N and official aquatic EQR",
          "",
          "The entire source-only 2018 sampling unit and 5-fold geographic split were committed BEFORE opening 2018 biological EQR. Do not substitute 2022 WWTP loads. EEA UWWTD Waterbase 2017-2018 v07/r01 original public archive and EEA Biology2026 2018 normalized EQR are exact source versions.",
          "",
          "## Actual 2018 temporal validation",
          "",
          "Benthic invertebrate source-only 2,639 river sites (204 with registered 2018 measured source) yielded 2,634 original valid EQR (202 exposed) from 15 countries and 52 spatial blocks. Five 3-degree source-only folds, Ridge(alpha=10), baseline geography, riverQ, upstream area, country and biological procedure method.",
          "",
          "| 2018 original benthic model | Baseline MSE | Add UPSTREAM measured annual load MSE | Add DOWNSTREAM load placebo MSE |",
          "|---|---:|---:|---:|"]
          for chem in ("P","N"):
              b,u,d=part(bs,chem)
              lines.append("| "+chem+" | "+format(b,".7f")+" | "+format(u,".7f")+" | "+format(d,".7f")+" |")
          lines.extend([
          "",
          "Original year-2018 benthic prediction MSE improvement from including upstream P: **+0.9816%**, upstream N **+1.1902%**. BOTH improve on baseline AND outperform physically downstream source placebo; **the preregistered independent-temporal-prediction direction was reproduced**. Source mass vs EQR raw Spearman P **-0.1314**, N **-0.1320**; this is not evidence discharge is beneficial to biodiversity.",
          "",
          "2018 phytobenthos 2,670 EQR sites (220 source-exposed) has only P **+0.0085%** and N **+0.1254%** MSE improvements; the DOWNSTREAM negative-control predictor outperforms the upstream predictor in both nutrients, so 2018 predeclared specificity criterion **FAILS**. Fish only 2 original valid 2018 source-exposed sites across two reporting countries; original sample gate FAILED and no fish EQR model fitted.",
          "",
          "Comparison with original 2022 source-year: benthic upstream-load MSE improvement P **+1.10%**, N **+1.40%**. 2018 uses different actual EEA original treatment/discharge reports, same type of standardized 2026 Biology EQR but independent 2018 records and source-only region/fold definitions. This is **a meaningful two-reference-year positive prediction**, not a fully independent sampling agency or randomized experiment.",
          "",
          "## Independent reproducibility and causal limits",
          "",
          "No external biological source was queried in the independent audit; it checks source CRC/SHA, all original source-only 2018 IDs, exact historic WWTP 2018 annual N/P masses, regional heldout folds, all P/N baseline/upstream/downstream/both model MSEs and source-sample attrition. See INDEPENDENT_2018_TEMPORAL_BQE_AUDIT.json and SOURCE_RECEIPT.json.",
          "",
          "EEA 2018 measured annual N/P source mass is not a measured concentration delivered to each BQE station. Correlated source N/P, overlapping 2018/2022 catchments, country/EQR method differences, changing wastewater treatment status, crop and urban runoff, nonreporting and unverified official HydroRIVERS original mean **no nutrient-specific causal wastewater or species richness effect has been demonstrated**. Preserve all prior gesui and chocho results, negative as well as positive.",
          ])
          (dest/"RESULTS.md").write_text("\n".join(lines)+"\n")
          print("GESUI_2018_INDEPENDENT_YEAR_REAL_BENTHIC_TEMPORAL_RESULT_ARCHIVED",
                json.dumps({"2018_valid_benthic_EQR":2634,"exposed":202,
                            "predeclared_upstream_P_prediction_gain":True,
                            "predeclared_upstream_N_prediction_gain":True,
                            "primary_temporal_direction_replication":True,
                            "original_EEA2026_Biology_ZIP_redistributed":False}))
          PY
      - name: Save source-locked numeric 2018 biological results and independent QA on analysis branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2018_independent_temporal_bqe_20261108
          git commit -m "Preserve independent 2018 source-year biological EQR replication with archived original and refit-audited observed results"
          git push origin HEAD:analysis/uwwtd2018-independent-bqe-validation-20261108
