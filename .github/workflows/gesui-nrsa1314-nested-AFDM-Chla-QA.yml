name: gesui 2013 true source EPT AFDM Chla NP NumPy independent audit
on:
  push:
    paths:
      - scripts/audit_NRSA1314_EPT_Chla_AFDM_nested_numpy.py
      - .github/workflows/gesui-nrsa1314-nested-AFDM-Chla-QA.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  independently-confirm-instream-biofilm-EPT:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen1314
      - name: Reconstitute six original official EPA 2013 source tables
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/frozen1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: python scripts/gesui_NRSA1314_independent_cycle_numeric.py > ${{ runner.temp }}/independent_2013_source.log
      - name: Refit original source nested EPT AFDM Chla model
        run: python scripts/gesui_NRSA1314_EPT_CHLA_AFDM_sameUID_posthoc.py > ${{ runner.temp }}/original_nested_model.log
      - name: Independent NumPy matrix validation of source site heldout and cluster inference
        run: |
          python -m py_compile scripts/audit_NRSA1314_EPT_Chla_AFDM_nested_numpy.py
          python scripts/audit_NRSA1314_EPT_Chla_AFDM_nested_numpy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa1314-1094-EPT-AFDM-Chla-NP-independent-numpy
          path: ${{ runner.temp }}/gesui1314_independent_numeric/NRSA1314_TRUE_EPT_CHLA_AFDM_NP_MATRIX_QA.json
          if-no-files-found: warn
          retention-days: 60
