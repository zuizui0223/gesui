name: gesui 20261116 official EEA 2026 public ICM Part2 file index bounded metadata
on:
  push:
    branches:
      - analysis/gesui-reported-np-40h6-source-gate-20261116
    paths:
      - 'analysis/20261116_reported_np_source/inspect_official_publisher_file_index_v3.py'
      - '.github/workflows/gesui-20261116-EEA-ICM2026-public-file-index-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_2026_publisher_metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: Inspect metadata-only publisher file index, bounded to 250KB without data download
        run: |
          python -m py_compile analysis/20261116_reported_np_source/inspect_official_publisher_file_index_v3.py
          python -u analysis/20261116_reported_np_source/inspect_official_publisher_file_index_v3.py \
             --output '${{ runner.temp }}/publisher_file_index'
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-20261116-EEA-2026-publisher-public-Part2-file-index-diagnostic
          path: ${{ runner.temp }}/publisher_file_index/
          retention-days: 90
          if-no-files-found: warn
