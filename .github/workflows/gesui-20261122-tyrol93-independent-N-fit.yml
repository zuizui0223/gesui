name: gesui South Tyrol independent within-genus HNS by plant EIV-N test
on:
  push:
    branches:
      - analysis/gesui-butterfly-within-genus-20261122
    paths:
      - .github/workflows/gesui-20261122-tyrol93-independent-N-fit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploratory-independent-sample-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical libraries
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.1.3 scipy==1.14.1
      - name: Recheck two source SHA256, fit same-genus relative counts and H6-free site holdouts
        run: |
          python -B analysis/20261122_butterfly_within_genus/tyrol93_independent_fit.py \
            --hns results/20261115_sync/GESUI_303_HOST_NUTRIENT_SCORES.csv \
            --output source_gate/tyrol93_independent_N_results.json
      - name: Archive aggregate independent result, STOP, and negative validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-tyrol93-independent-congener-plant-N-numeric-model-or-STOP
          path: source_gate/tyrol93_independent_N_results.json
          if-no-files-found: error
          retention-days: 20
# Re-run with numpy integer JSON serialization repair; unchanged model and prelocked covariates.
# Re-run with full fixed taxon-pool CV and numpy-safe terminal summary; same model specification.
