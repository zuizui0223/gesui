name: gesui verify original BMLUK 2022-2024 river operative station and biological results Excel source
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/stage_official_BMLUK_river_workbooks.py'
      - '.github/workflows/gesui-20261116-BMLUK-original-river-result-workbooks-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_government_river_results_source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original publisher HTTP retrieval
        run: python -m pip install --quiet requests
      - name: Pin official 2022-2024 publisher ZIP SHA and stage genuine FW1 FW2 FW3 river workbooks temporarily for source grain inspection
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/stage_official_BMLUK_river_workbooks.py
          python -u analysis/20261116_austria_wisa_official_source/stage_official_BMLUK_river_workbooks.py \
            --output '${{ runner.temp }}/original_BMLUK_water_report_excel'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-original-BMLUK-2022-2024-river-results-three-xlsx-source-check
          path: '${{ runner.temp }}/original_BMLUK_water_report_excel/'
          retention-days: 2
          if-no-files-found: warn
