name: Source-only official CDSE S3 TCD 2018 and 2022 authorized preflight
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_FR381_CDSE_authorized_S3_TCD_TCDCL_2018_2022_preflight_20261124.py
      - .github/workflows/gesui-FR381-TCD-CDSE-S3-auth-source-preflight-20261124.yml
permissions:
  contents: read
jobs:
  source-only-authorized-four-original-TIFF-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
      CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official compatible S3 API client without storing credentials
        run: |
          python -m pip install --quiet "boto3>=1.34,<2"
          python -m py_compile scripts/gesui_FR381_CDSE_authorized_S3_TCD_TCDCL_2018_2022_preflight_20261124.py
      - name: Source official provider catalogue exact checksums and, only with secrets, range-read four TIFF headers (no EQR/pixel)
        run: |
          python -u scripts/gesui_FR381_CDSE_authorized_S3_TCD_TCDCL_2018_2022_preflight_20261124.py \
            --out "${{ runner.temp }}/FR381_CDSE_S3_AUTH_SOURCE_PREFLIGHT.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-France381-TCD2018-2022-authorized-CDSE-fourTIFF-source-preflight
          path: ${{ runner.temp }}/FR381_CDSE_S3_AUTH_SOURCE_PREFLIGHT.json
          if-no-files-found: warn
          retention-days: 60
