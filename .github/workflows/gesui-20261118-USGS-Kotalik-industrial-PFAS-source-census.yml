name: gesui USGS industrial wastewater PFAS Kotalik2025 raw source file and stages
on:
  push:
    branches: [docs/wastewater-riparian-interactions-outline]
    paths:
      - 'analysis/20261118_industrial_PFAS_source/hubbard_kotalik_2025_USGS_P13BSPG4_source_schema.py'
      - '.github/workflows/gesui-20261118-USGS-Kotalik-industrial-PFAS-source-census.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/20261118_industrial_PFAS_source/hubbard_kotalik_2025_USGS_P13BSPG4_source_schema.py'
      - '.github/workflows/gesui-20261118-USGS-Kotalik-industrial-PFAS-source-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  industrial_original_2021_22_USGS_PFAS_insects_spiders_source_without_ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source code syntax
        run: python -m py_compile analysis/20261118_industrial_PFAS_source/hubbard_kotalik_2025_USGS_P13BSPG4_source_schema.py
      - name: Fetch actual USGS published data item and original file schemas, before testing response
        run: |
          python -u analysis/20261118_industrial_PFAS_source/hubbard_kotalik_2025_USGS_P13BSPG4_source_schema.py \
            --out '${{ runner.temp }}/original_USGS_industrial_2021_22_PFAS_source'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261118-USGS-original-industrial-PFAS-Kotalik2025-insect-spider-source-schema
          path: '${{ runner.temp }}/original_USGS_industrial_2021_22_PFAS_source/'
          retention-days: 90
          if-no-files-found: warn
