name: gesui official WFD 2022 reported agriculture/urban river pressure data access schema

on:
  push:
    branches:
      - "analysis/bqe2022-missingness-wfd-pressure-20261108"
    paths:
      - "scripts/probe_eea_wfd2022_pressure_source.py"
      - ".github/workflows/gesui-wfd2022-pressure-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regulatory-source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests
      - name: Probe only original WFD 2022 significant pressure fields, code lists and data availability
        run: |
          python -u scripts/probe_eea_wfd2022_pressure_source.py \
            --out /tmp/gesui_wfd2022_source/PRESSURE_SOURCE_SCHEMA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-WFD2022-public-pressure-source-metadata
          path: /tmp/gesui_wfd2022_source/PRESSURE_SOURCE_SCHEMA.json
          retention-days: 45
          if-no-files-found: warn
