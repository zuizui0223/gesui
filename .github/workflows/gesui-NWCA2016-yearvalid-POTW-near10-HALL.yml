name: gesui NWCA2016 year-specific NPDES permit plausible 50near 162far H_ALL postsource
on:
  push:
    branches: ["analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111"]
    paths:
      - ".github/workflows/gesui-NWCA2016-yearvalid-POTW-near10-HALL.yml"
      - "scripts/gesui_NWCA2016_historicalyear_NPDES_near10_FAR20_actual_HALL.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_2016_historical_permit_source_valid_HALL:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Source-only original 2016 50 near/162 far quality was committed before H_ALL value access
        run: |
          python -m pip install --quiet numpy pandas scipy statsmodels
          python -m py_compile scripts/gesui_NWCA2016_historicalyear_NPDES_near10_FAR20_actual_HALL.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_2026_NPDES_PERMIT_EFF_ASOF2016_SOURCE_ONLY_NEAR10_FAR20.json")
          x=json.loads(p.read_text())
          assert x["original_2016_historical_source_vegmetric_plant_H_ALL_NOT_READ"]
          assert x["2016_historical_permit_year_source_near10_n"]==50
          assert x["2016_historical_permit_year_source_far20_n"]==162
          assert x["2011_historical_permit_source_failure_acknowledged_do_not_fit_old_2011"]
          print("2016 permit-year source prebiology gate PASS; 2011 historical exposure study NOT permitted")
          PY
      - name: Retrieve original 2016 EPA vegetation metrics and source sites, verify original independent SHA
        run: |
          mkdir -p /tmp/gesui-NWCA2016
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2022-04/nwca-2016-site-information-data_0.csv" \
            -o /tmp/gesui-NWCA2016/2016_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-03/nwca_2016_veg_metrics.csv" \
            -o /tmp/gesui-NWCA2016/2016_vegmetrics.csv
      - name: Evaluate both site-equal and NWCA sampling design-weighted 2016 H_ALL from exact historical permit age selected 212 wetlands
        run: |
          python -u scripts/gesui_NWCA2016_historicalyear_NPDES_near10_FAR20_actual_HALL.py \
            --source-dir /tmp/gesui-NWCA2016 \
            --out results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_ASOF2016_ECHO_REGISTERED_POTW_HALL_50NEAR162FAR_POSTHOC_QA.json
      - name: Preserve all original source-locked positive negative and zero results without changing old main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_ASOF2016_ECHO_REGISTERED_POTW_HALL_50NEAR162FAR_POSTHOC_QA.json
          git diff --cached --quiet && exit 0
          git commit -m "Report original 2016 wetland true plant Shannon against historically plausible 2016 permit outfall near10, not a 2026 sewage treatment causal study"
          git fetch origin analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git rebase origin/analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git push origin HEAD:analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NWCA2016-historical-registered-POTW-50near162far-HALL
          path: results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_ASOF2016_ECHO_REGISTERED_POTW_HALL_50NEAR162FAR_POSTHOC_QA.json
          retention-days: 90
