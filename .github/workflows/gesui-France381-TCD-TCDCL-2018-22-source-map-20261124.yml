name: France381 official CLMS TCD 2018 2022 quality grid source mapping
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_FR381_TCD2018_2022_quality_tile_matched_source_20261124.py
      - .github/workflows/gesui-France381-TCD-TCDCL-2018-22-source-map-20261124.yml
permissions:
  contents: read
  actions: read
jobs:
  true-France381-original-source-to-raster-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only geographical projection, source polygon semantics
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "pyproj>=3.5,<4"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-20261117-RZ2018-2018Benthic-2639-source-only-physical-class-areas
          run-id: 44004357868
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_real_RZ2018
      - name: Retrieve exact original 2022 EEA source site rows and verify Git blob SHA
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/analysis/eea2026-waterbase-biology-bqe-20261108"
          git show FETCH_HEAD:results/eea2022_biology_bqe_20261108/BENTHIC_INVERTEBRATES_2022_SOURCE_EQR.csv > "${{ runner.temp }}/2022_benthos_source.csv"
          test "$(git hash-object "${{ runner.temp }}/2022_benthos_source.csv")" = "325f199e985d9862ffee5b0edb205c61a7be3833"
      - name: Map unchanged France381 real 2018 2022 source site centroids to 10m TCD and confidence layer annual same-grid IDs, not pixels
        run: |
          python -m py_compile scripts/gesui_FR381_TCD2018_2022_quality_tile_matched_source_20261124.py
          python -u scripts/gesui_FR381_TCD2018_2022_quality_tile_matched_source_20261124.py \
            --rz "${{ runner.temp }}/source_real_RZ2018/EEA2018_2018_RIPARIAN_ZONES_REST_OFFICIAL_SOURCE_ONLY_QA.json" \
            --eq18 results/eea2018_independent_temporal_bqe_20261108/benthic_invertebrates_2018_WWTP_source_real_EQR.csv \
            --eq22 "${{ runner.temp }}/2022_benthos_source.csv" \
            --out "${{ runner.temp }}/FR381_2018_2022_TCD_TCDCL_SOURCE_SITE_GRIDS.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-FR381-TCD2018-2022-CLMS-native-tiles-and-annual-quality-source
          path: ${{ runner.temp }}/FR381_2018_2022_TCD_TCDCL_SOURCE_SITE_GRIDS.json
          if-no-files-found: warn
          retention-days: 60
