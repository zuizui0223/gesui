name: gesui WISE6 2022 measured river TP versus directed WWTP P (50km) vs downstream placebo 2degree CV
on:
  push:
    branches: ["analysis/wise6-2022-TP-directed-WWTP-reaches-20261109"]
    paths:
      - "scripts/gesui_2022_WISE6_realTP_directed_WWTP_source_vs_downstream_CV.py"
      - ".github/workflows/gesui-2022-WISE6-realTP-directed-source-vs-downstream-CV.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-2022-TP-directed-sourced-173-reach-geographic-CV:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet numpy
      - name: Check graph source/2022 TP numeric source/2021 WorldCover SHA then compare original upstream 2022 mass with downstream negative-control in 2degree heldout actual TP
        run: |
          python -m py_compile scripts/gesui_2022_WISE6_realTP_directed_WWTP_source_vs_downstream_CV.py
          python -u scripts/gesui_2022_WISE6_realTP_directed_WWTP_source_vs_downstream_CV.py \
            --source-only-directed-WWTP results/lycaenidae_2022_measured_river_P_bridge/2022_WISE6_187_TP_STATIONS_DIRECTED_ORIGINAL_EEA_WWTP_SOURCE_ONLY_QC.json \
            --original-WISE6-numeric-TP results/lycaenidae_2022_measured_river_P_bridge/2026_WISE6_2022_MEASURED_TP_SITE_YEAR_MEDIANS_AND_42_LYCAENIDAE_CELLS_QC.json \
            --original-WISE6-PREnumeric-TP-source results/lycaenidae_2022_measured_river_P_bridge/2026_WISE6_ORIGINAL_2022_DE_AT_RW_TP_INDIVIDUAL_SAMPLE_STATION_SOURCE_ONLY_QC.json \
            --WorldCover-2021-photo-original results/lycaenidae_worldcover2021_source_only/2022_LYCAENIDAE_ESAWC2021_DE_AT_URBAN_CROP_LANDAREA_POSTHOC_BLOCKCV.json \
            --out results/lycaenidae_2022_measured_river_P_bridge/2022_REAL_WISE6_TP_DIRECTED_UPSTREAM_WWTP_P_VS_DOWNSTREAM_PLACEBO_CV.json
      - name: Archive both source-positive and source-negative results with full per-site geographic heldout validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_2022_measured_river_P_bridge/2022_REAL_WISE6_TP_DIRECTED_UPSTREAM_WWTP_P_VS_DOWNSTREAM_PLACEBO_CV.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit actual 2022 WISE6 river TP vs strictly upstream freshwater WWTP reported P and downstream P placebo with hydrology WorldCover controls and 2degree heldouts"
          git fetch origin analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
          git rebase origin/analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
          git push origin HEAD:analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2022-WISE6-realTP-strict-upstream-WWTP-P-versus-downstream-negative-control
          path: results/lycaenidae_2022_measured_river_P_bridge/2022_REAL_WISE6_TP_DIRECTED_UPSTREAM_WWTP_P_VS_DOWNSTREAM_PLACEBO_CV.json
          retention-days: 90
