name: gesui EPA three-era EPT m100 same m200 sites versus expanded source external HUC8

on:
  push:
    paths:
      - scripts/gesui_NRSA3cycle_rarefaction100_same_vs_expanded_external.py
      - .github/workflows/gesui-nrsa-threecycle-rare100-external-compare200.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  true-original-sources-three-cycle-ept-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixed reproducible matrix and original source parsers
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" "statsmodels>=0.14,<1"

      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-five-original-EPA-source-census
          run-id: 43562414140
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src0809
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa0809-original-BERWW-TAXA-ID-to-ORDER-source-QA
          run-id: 43563239544
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/taxa0809
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-EPT-fraction-source-fidelity
          run-id: 43563366026
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fidelity0809

      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src1314

      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src1819
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src18chla
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1819-ept-chla-phab-source-native-UID
          run-id: 43528570410
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src18triad

      - name: Reconstruct independent 2008–09 ORIGINAL EPA BERWW chemistry and taxon share panel
        env:
          ORIGINAL_2008_SOURCE: ${{ runner.temp }}/src0809/NRSA0809_EPA_ORIGINAL_SOURCE_ONLY_COUNT_AND_GRANULARITY.json
          ORIGINAL_TAXON_QA: ${{ runner.temp }}/taxa0809/NRSA0809_BERWW_TOTAL300_TAXA_ID_ORDER_ORIGINAL_CROSSWALK_SOURCE_QA.json
          ORIGINAL_EPT_FIDELITY: ${{ runner.temp }}/fidelity0809/NRSA0809_EPT_REAL_TOTAL300_SOURCE_PUBLISHED_FIDELITY_QA.json
        run: |
          python scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py > ${{ runner.temp }}/rebuild_2008_original_source_model.log

      - name: Reconstruct independent 2013–14 ORIGINAL EPA BERW chemistry pigment PHab panel
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/src1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: |
          python scripts/gesui_NRSA1314_independent_cycle_numeric.py > ${{ runner.temp }}/rebuild_2013_original_source_model.log

      - name: Reconstruct independent 2018–19 ORIGINAL EPA BERW chemistry pigment PHab panel
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/src1819/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/src18chla/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
          FROZEN_TRIAD_SOURCE: ${{ runner.temp }}/src18triad/NRSA1819_ORIGINAL_EPT_CHLA_PHAB_SOURCE_ONLY_QA.json
        run: |
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/rebuild_2018_original_source_model.log
          python scripts/gesui_NRSA1819_EPT_CHLA_PHAB_true_triad_models.py > ${{ runner.temp }}/rebuild_2018_original_benthos_PHab.log

      - name: Source-first audit exact 2648 native UIDs, original HUC8 overlap and shared six environmental variables
        run: |
          python -m py_compile scripts/gesui_NRSA_3cycle_SOURCE_2648_EPT_PHab_NP_harmonize.py
          python -u scripts/gesui_NRSA_3cycle_SOURCE_2648_EPT_PHab_NP_harmonize.py

      - name: Source-only original native BERW taxon-ID and count distribution without rarefied ecological fits
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/src1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: |
          python -m py_compile scripts/gesui_NRSA_3cycle_EPT_taxonID_count200_SOURCE_census.py
          python -u scripts/gesui_NRSA_3cycle_EPT_taxonID_count200_SOURCE_census.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NRSA-three-era-original-EPT-taxa-rarefaction-count200-source-only
          path: ${{ runner.temp }}/gesui_threecycle_rarefied_taxa/NRSA_THREECYCLE_EPT_TAXA_SOURCE_CENSUS_PRE_EFFECT.json
          if-no-files-found: warn
          retention-days: 60
      - uses: actions/download-artifact@v4
        with:
          name: gesui-EPA-NRSA-three-era-m100-source-population-before-effects
          run-id: 43570309532
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior_m100_source

      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA-three-era-rarefied200-EPT-richness-fraction-nonEPT-crossperiod
          run-id: 43568477035
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior_m200_result

      - name: Source-only m100 exact original eligibility and independent same m200 cohort check
        run: |
          python scripts/gesui_NRSA3cycle_rare100_SOURCE_only_cohort.py

      - name: "100-individual hypergeom EPT taxon diversity, external HUC8 same vs expanded source sites"
        env:
          ORIGINAL_M100_SOURCE_ONLY_QA: ${{ runner.temp }}/prior_m100_source/NRSA_3ERA_RARE100_SOURCE_ONLY_COHORT_AND_ADDED_N_QA.json
          ORIGINAL_RARE200_MODEL_RESULT: ${{ runner.temp }}/prior_m200_result/NRSA_THREECYCLE_RARE200_EPT_SHARE_RICHNESS_EXTERNAL_TRANSPORT.json
        run: |
          python -m py_compile scripts/gesui_NRSA3cycle_rarefaction100_same_vs_expanded_external.py
          python -u scripts/gesui_NRSA3cycle_rarefaction100_same_vs_expanded_external.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EPA-NRSA-three-era-m100-same2209-vs-expanded2403-externalHUC8
          path: ${{ runner.temp }}/gesui_threecycle_rarefied_taxa/NRSA_THREECYCLE_RARE100_SAMESITES_VS_EXPANDED_HUC8_EXTERNAL.json
          if-no-files-found: warn
          retention-days: 60
