name: gesui official HydroRIVERS v1 Europe directed hydrograph source and NEXT_DOWN schema audit
on:
  push:
    paths:
      - 'analysis/20261120_wessex_wwtp/hydrorivers_official_europe_source_gate.py'
      - '.github/workflows/gesui-official-HydroRIVERS-EU-source-gate-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-official-directed-river-network-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight source-only original HydroRIVERS shapefile header reader
        run: python -m pip install --quiet 'pyshp>=2.3,<3'
      - name: Retrieve official HydroSHEDS 68MB European HydroRIVERS v1, validate topology field and original checksum, never rehost raw graph
        run: |
          python -m py_compile analysis/20261120_wessex_wwtp/hydrorivers_official_europe_source_gate.py
          python -u analysis/20261120_wessex_wwtp/hydrorivers_official_europe_source_gate.py \
            --out "${{ runner.temp }}/gesui_hyriv/HYDRORIVERS_EU_ORIGINAL_DIRECTED_NETWORK_SOURCE_ONLY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-HydroRIVERS-Europe-true-directional-network-source-only
          path: ${{ runner.temp }}/gesui_hyriv/HYDRORIVERS_EU_ORIGINAL_DIRECTED_NETWORK_SOURCE_ONLY.json
          if-no-files-found: warn
          retention-days: 90
