name: gesui EEA2026 Biology EQR real 2022 river station source coverage

on:
  push:
    branches:
      - "analysis/eea2026-waterbase-biology-bqe-20261108"
    paths:
      - "scripts/gesui_eea2026_bqe_source_quality.py"
      - ".github/workflows/gesui-eea2026-bqe-source-support.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  official-2022-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet numpy pandas
      - name: Download exact pinned public EEA 2026 official biology ZIP
        run: |
          mkdir -p /tmp/gesui-bqe-support
          curl --fail --location --silent --show-error --retry 2 --max-time 360 \
            https://sdi.eea.europa.eu/datashare/s/HCxTFz3Ac8xbHX6/download \
            -o /tmp/gesui-bqe-support/Waterbase_Biology_2026_original.zip
          echo "EEA Nextcloud may repackage ZIP with non-identical container SHA. Inner 12-file manifest is the source lock."
          sha256sum /tmp/gesui-bqe-support/Waterbase_Biology_2026_original.zip
          mkdir -p /tmp/gesui-bqe-reference
          gh run download 42430869887 --repo zuizui0223/gesui             --name gesui-EEA-Waterbase-Biology2026-source-inventory             --dir /tmp/gesui-bqe-reference
      - name: Audit 2022 river EQR observation support and exact official location identifiers (no effects)
        run: |
          python -u scripts/gesui_eea2026_bqe_source_quality.py \
            --archive /tmp/gesui-bqe-support/Waterbase_Biology_2026_original.zip             --original-manifest /tmp/gesui-bqe-reference/SOURCE_FILE_INVENTORY.json             --out /tmp/gesui-bqe-support/EEA_BIOLOGY_2022_RIVER_SOURCE_SUPPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA-Waterbase-Biology2026-2022-river-BQE-source-support
          path: /tmp/gesui-bqe-support/EEA_BIOLOGY_2022_RIVER_SOURCE_SUPPORT.json
          if-no-files-found: warn
          retention-days: 30
