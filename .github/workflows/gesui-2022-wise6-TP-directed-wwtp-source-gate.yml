name: gesui 2022 WISE6 TP source-only 187 sites x directed HydroRIVERS 2022 WWTP exposure
on:
  push:
    branches:
      - "analysis/wise6-2022-TP-directed-WWTP-reaches-20261109"
    paths:
      - ".github/workflows/gesui-2022-wise6-TP-directed-wwtp-source-gate.yml"
      - "scripts/gesui_2022_WISE6_TP_original_station_vs_directed_WWTP_sourceonly.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-metadata-geography-and-directive-flow-no-concentrations:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source-only geographical tools
        run: python -m pip install --quiet geopandas pyarrow shapely pandas numpy requests
      - name: Download exact previously validated EEA2026 spatial source and source-converted HydroRIVERS EU directed network
        run: |
          mkdir -p /tmp/gesui-2022-WISE-hydro-lib /tmp/gesui-2022-WISE-hydro-src
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            'https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet' \
            -o /tmp/gesui-2022-WISE-hydro-src/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-2022-WISE-hydro-src/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 2 --max-time 100 \
            'https://discodata.eea.europa.eu/download/WISE_SOE/latest/Waterbase_S_WISE_SpatialObject_DerivedData' \
            -o /tmp/gesui-2022-WISE-hydro-src/WISE_SpatialObject_DerivedData.zip
          echo "afd64e1d5582492c09453f5a05aae0b1a9d9a38c8814778afdb5c07e43a1c974  /tmp/gesui-2022-WISE-hydro-src/WISE_SpatialObject_DerivedData.zip" | sha256sum -c -
      - name: Download exact original 2022 official EEA WWTP to directed HydroRIVERS utility from pinned Git source commit
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 50 \
            'https://raw.githubusercontent.com/zuizui0223/gesui/6f037f65e9b948d6f8e324ad4eec9d8c03424b35/scripts/gesui_eea_nutrient_load_river_crosswalk.py' \
            -o /tmp/gesui-2022-WISE-hydro-lib/gesui_eea_nutrient_load_river_crosswalk.py
          test "$(git hash-object /tmp/gesui-2022-WISE-hydro-lib/gesui_eea_nutrient_load_river_crosswalk.py)" = "9c07ce9de7f5104b47052c7598a943df405a4b83"
      - name: Map strictly original WISE 2022 TP 187 station positions to nearest directed reach and 2022 official both-positive FW outfalls WITHOUT reading river chemistry
        run: |
          python -m py_compile scripts/gesui_2022_WISE6_TP_original_station_vs_directed_WWTP_sourceonly.py
          python -u scripts/gesui_2022_WISE6_TP_original_station_vs_directed_WWTP_sourceonly.py \
            --TP-sourceonly results/lycaenidae_2022_measured_river_P_bridge/2026_WISE6_ORIGINAL_2022_DE_AT_RW_TP_INDIVIDUAL_SAMPLE_STATION_SOURCE_ONLY_QC.json \
            --spatial-zip /tmp/gesui-2022-WISE-hydro-src/WISE_SpatialObject_DerivedData.zip \
            --river-parquet /tmp/gesui-2022-WISE-hydro-src/HydroRIVERS_v10_eu.geoparquet \
            --old-source-script /tmp/gesui-2022-WISE-hydro-lib/gesui_eea_nutrient_load_river_crosswalk.py \
            --out results/lycaenidae_2022_measured_river_P_bridge/2022_WISE6_187_TP_STATIONS_DIRECTED_HYDRO_WWTP_SOURCE_ONLY_QC.json
      - name: Commit source-only reached vs unreached water monitoring sites and upstream/downstream exposure before numerical river TP correlation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_2022_measured_river_P_bridge/2022_WISE6_187_TP_STATIONS_DIRECTED_HYDRO_WWTP_SOURCE_ONLY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Source-freeze 187 original WISE6 2022 TP stations' 500m HydroRIVERS directed upstream WWTP P/N and downstream negative control"
          git fetch origin analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
          git rebase origin/analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
          git push origin HEAD:analysis/wise6-2022-TP-directed-WWTP-reaches-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2022-WISE6-original-TP-stations-directed-HydroRIVERS-WWTP-sourceonly
          path: results/lycaenidae_2022_measured_river_P_bridge/2022_WISE6_187_TP_STATIONS_DIRECTED_HYDRO_WWTP_SOURCE_ONLY_QC.json
          retention-days: 90
          if-no-files-found: warn
