name: gesui global all 1055 original 42country WWp WPI ports SOURCE ONLY before new808 GBIF
on:
  push:
    branches: ["analysis/global-1055port-allPlantae-full-20261110"]
    paths:
      - ".github/workflows/gesui-global-1055-allplantae-source-freeze.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  freeze_original_1055_country_WWp_before_NEW808:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Rebuild original 2015 42country source site cohort with exact old beta; no new 808 GBIF species data
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy statsmodels
          python -m py_compile scripts/gesui_global_original_1055port_allPlantae_808NEW_source_freeze.py
      - name: Fetch original still-pinned 1596 WPI port source artifact Jones2015 and WorldCover2021
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gesui-all1055/jones /tmp/gesui-all1055/world
          gh run download 41563940689 --name pangaea-jones2015-5arc-wpi1596-wastewater-wwtp \
            --dir /tmp/gesui-all1055/jones --repo zuizui0223/chocho
          gh run download 41562997326 --name hydroWASTE-WPI1596-WorldCover2021-urban \
            --dir /tmp/gesui-all1055/world --repo zuizui0223/chocho
      - name: Commit source-only exact all1055 and new808 original WPI WWp coordinates after verifying old247 pilot source
        run: |
          python -u scripts/gesui_global_original_1055port_allPlantae_808NEW_source_freeze.py \
            --jones /tmp/gesui-all1055/jones/Jones2015_WPI1596_port_grid_census.csv \
            --worldcover /tmp/gesui-all1055/world/WPI1596_worldcover2021_port_measurements.csv \
            --out results/global_all_Plantae_WWp2015_20261110/ORIGINAL_ALL1055_42COUNTRY_WWp2015_BEFORE_NEW808_GBIF_SOURCE.json
      - name: Archive source metadata before accessing any new808 allflora plant taxa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/global_all_Plantae_WWp2015_20261110/ORIGINAL_ALL1055_42COUNTRY_WWp2015_BEFORE_NEW808_GBIF_SOURCE.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze all1055 original WPI country source and 808 remaining GBIF allflora queries after old247 source trace"
          git fetch origin analysis/global-1055port-allPlantae-full-20261110
          git rebase origin/analysis/global-1055port-allPlantae-full-20261110
          git push origin HEAD:analysis/global-1055port-allPlantae-full-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-global-all1055-WWp-source-before-808-newPlantae
          path: results/global_all_Plantae_WWp2015_20261110/ORIGINAL_ALL1055_42COUNTRY_WWp2015_BEFORE_NEW808_GBIF_SOURCE.json
          retention-days: 90
