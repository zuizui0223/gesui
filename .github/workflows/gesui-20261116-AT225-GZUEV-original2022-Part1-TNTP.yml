name: gesui original EEA2026 WISE6 2022 TNTP actual river samples at 225 Austrian GZUEV PKINT station IDs
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/AT225_EEA2026_part1_2022_PKINT_NP_source.py'
      - '.github/workflows/gesui-20261116-AT225-GZUEV-original2022-Part1-TNTP.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full_original_WISE6_2022_225_gzuev_pkint_nutrient_dates:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only official source-streaming dependencies and original DEFLATE64 reader
        run: |
          python -m pip install --quiet requests
          7z | head -n 3
      - name: Restore exact source-locked 117 positive UWWTD outlets x 225 official GZUEV PKINT IDs
        uses: actions/download-artifact@v4
        with:
          run-id: 43865663130
          name: gesui-20261116-official-BMLUK-FWMST-GZUEV-GPKG-source-AT145-geospatial-check
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed_AT225_original_station_crosswalk
      - name: Verify public original EEA 1.639GB source SHA and stream all 96.6m authentic water samples, 2022 true TNTP days at 225 PKINT
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/AT225_EEA2026_part1_2022_PKINT_NP_source.py
          python -u analysis/20261116_austria_wisa_official_source/AT225_EEA2026_part1_2022_PKINT_NP_source.py \
            --crosswalk '${{ runner.temp }}/signed_AT225_original_station_crosswalk/BMLUK_GZUEV_2022_AT145_2KM_SOURCE_STATION_PKINT_MATCHES.csv' \
            --output '${{ runner.temp }}/AT225_2022_original_EEA_water_sourceonly'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-authentic-AT225-GZUEV-PKINT-EEA2026-Part1-2022-river-TNTP
          path: |
            ${{ runner.temp }}/AT225_2022_original_EEA_water_sourceonly/AT225_GZUEV_2022_WISE6_PART1_CHEMISTRY_ONLY_GATE.json
            ${{ runner.temp }}/AT225_2022_original_EEA_water_sourceonly/AT225_GZUEV_PKINT_2022_WISE6_PART1_SOURCE_ONLY_TNTP_STATIONS.csv
          retention-days: 90
          if-no-files-found: warn
