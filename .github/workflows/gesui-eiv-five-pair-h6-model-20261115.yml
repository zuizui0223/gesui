name: gesui source-authentic five paired EIV NUTRI-specificity H6 and country holdout
on:
  push:
    branches:
      - analysis/gesui-eu454-eiv-specificity-20261115
    paths:
      - 'analysis/20261115_eiv_specificity/pairwise_model.py'
      - '.github/workflows/gesui-eiv-five-pair-h6-model-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  five-controlled-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy pandas scipy statsmodels
      - name: Original SHA-gated five pair-same-scored-species source-only
        uses: actions/download-artifact@v4
        with:
          run-id: 43720948781
          name: gesui-20261115-EU454-EIV-NUTRI-five-pairs-source-opportunity-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_five_pairs
      - name: Run all five site-matched EIV NUTRI versus other-trait H6 and country-out comparisons
        run: |
          python -m py_compile analysis/20261115_eiv_specificity/pairwise_model.py
          python -u analysis/20261115_eiv_specificity/pairwise_model.py \
            --source '${{ runner.temp }}/source_five_pairs' \
            --output '${{ runner.temp }}/five_pair_model'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-EU454-EIV-NUTRI-five-pairs-H6-country-BH5
          path: ${{ runner.temp }}/five_pair_model/
          retention-days: 90
          if-no-files-found: warn
