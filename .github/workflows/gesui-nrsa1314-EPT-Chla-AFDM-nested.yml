name: gesui NRSA2013 same visit EPT measured AFDM Chla N/P PHab cross-biota
on:
  push:
    paths:
      - scripts/gesui_NRSA1314_EPT_CHLA_AFDM_sameUID_posthoc.py
      - .github/workflows/gesui-nrsa1314-EPT-Chla-AFDM-nested.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  authentic-periphyton-and-benthos-joint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen1314
      - name: Recover authentic source-frozen independent EPA2013/14 original BERW, Chla, AFDM, TN TP, field physical six tables
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/frozen1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: python scripts/gesui_NRSA1314_independent_cycle_numeric.py > ${{ runner.temp }}/original_2013_cycle.log
      - name: Fit four pre-specified site-matched genuine AFDM/Chla nested EPT resource models with HUC8 grouped OOS, preserving nulls
        run: |
          python -m py_compile scripts/gesui_NRSA1314_EPT_CHLA_AFDM_sameUID_posthoc.py
          python scripts/gesui_NRSA1314_EPT_CHLA_AFDM_sameUID_posthoc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa1314-true-EPT-Chla-AFDM-NP-PHab-nested-resource
          path: ${{ runner.temp }}/gesui1314_independent_numeric/NRSA1314_EPT_CHLA_AREAL_AFDM_NP_PHAB_NESTED_SOURCE.json
          if-no-files-found: warn
          retention-days: 60
