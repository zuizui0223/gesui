name: EPA2023 true EPT ORDER taxonomy source-only gate
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_NRSA2023_EPT_order_SOURCE_ONLY_20261122.py
      - .github/workflows/gesui-nrsa2023-ept-order-source-gate-20261122.yml
permissions:
  contents: read
  actions: read
jobs:
  original-EPT-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source parser only
        run: |
          python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.3,<2"
          python -m py_compile scripts/gesui_NRSA2023_EPT_order_SOURCE_ONLY_20261122.py
      - uses: actions/download-artifact@v4
        with:
          name: nrsa2023-fourthcycle-berw-source-only
          run-id: 45017363050
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior_original_2023_source
      - name: SHA-pinned original five EPA tables
        run: |
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_siteinfo.csv -o "${{ runner.temp }}/sites.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_waterchemistry.csv -o "${{ runner.temp }}/water.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_physicalhabitat_metrics.csv -o "${{ runner.temp }}/habitat.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 https://www.epa.gov/system/files/other-files/2026-09/nrsa2324_benthiccount.csv -o "${{ runner.temp }}/benthos.csv"
          curl -fLsS --retry 3 --retry-all-errors --max-time 600 https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_periphytonchlorophyll-a.csv -o "${{ runner.temp }}/chla.csv"
      - name: Verify original UID, taxonomy source labels but do not read TOTAL300
        run: |
          python -u scripts/gesui_NRSA2023_EPT_order_SOURCE_ONLY_20261122.py \
            --sites "${{ runner.temp }}/sites.csv" \
            --water "${{ runner.temp }}/water.csv" \
            --habitat "${{ runner.temp }}/habitat.csv" \
            --benthos "${{ runner.temp }}/benthos.csv" \
            --chla "${{ runner.temp }}/chla.csv" \
            --source_qa "${{ runner.temp }}/prior_original_2023_source/nrsa2023_fourcycle_source_opportunity.json" \
            --out "${{ runner.temp }}/EPT_ORDER_SOURCE_ONLY_20261122.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-EPA-NRSA2023-EPT-order-source-only
          path: ${{ runner.temp }}/EPT_ORDER_SOURCE_ONLY_20261122.json
          if-no-files-found: warn
          retention-days: 60
