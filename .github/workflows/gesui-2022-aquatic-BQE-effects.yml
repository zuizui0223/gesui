name: gesui real 2022 EEA aquatic EQR versus measured WWTP N P load

on:
  push:
    branches:
      - "analysis/eea2026-waterbase-biology-bqe-20261108"
    paths:
      - "scripts/gesui_model_2022_eea_aquatic_EQR.py"
      - ".github/workflows/gesui-2022-aquatic-BQE-effects.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  biological-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent EEA biological model packages
        run: python -m pip install --quiet numpy pandas scipy scikit-learn
      - name: Retrieve exact source-only WWTP to biological station graph and five geographic folds
        run: |
          mkdir -p /tmp/gesui-eqr/source /tmp/gesui-eqr/original
          gh run download 42432030617 --repo zuizui0223/gesui \
            --name gesui-EEA2022-measured-NP-to-Biology2026-BQE-source-only \
            --dir /tmp/gesui-eqr/source
          echo "e12df511d64c4c580ef2422dccdbbd11a1309c84d29d467fd4527206e41fa636  /tmp/gesui-eqr/source/EQR_2022_river_source_only_station_registry.csv" | sha256sum -c -
      - name: Download official Biology 2026 original source (dynamic outer ZIP; cryptographically pin inner EQR)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 360 \
            https://sdi.eea.europa.eu/datashare/s/HCxTFz3Ac8xbHX6/download \
            -o /tmp/gesui-eqr/original/EEA_Waterbase_Biology_2026.zip
      - name: Join source-frozen 2022 stations with ORIGINAL normalized aquatic EQR and run fixed geographically withheld models
        run: |
          python -u scripts/gesui_model_2022_eea_aquatic_EQR.py \
            --source-registry /tmp/gesui-eqr/source/EQR_2022_river_source_only_station_registry.csv \
            --original-biology-zip /tmp/gesui-eqr/original/EEA_Waterbase_Biology_2026.zip \
            --out /tmp/gesui-eqr/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-real2022-benthic-phyto-fish-EQR-WWTP-reported-NP-models
          path: /tmp/gesui-eqr/out/
          retention-days: 30
          if-no-files-found: warn
