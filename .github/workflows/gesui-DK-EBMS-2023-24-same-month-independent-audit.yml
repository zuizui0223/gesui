name: gesui DK eBMS source-locked same-month family/source-cluster independent offline replay
on:
  push:
    branches: ["analysis/dk-ebms-2023-24-season-aligned-families-20261110"]
    paths:
      - ".github/workflows/gesui-DK-EBMS-2023-24-same-month-independent-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  same-calendar-month-original-math-independent-QC:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Independent family count, 2023–24 visit normalization and four-WWTP cluster arithmetic replay
        run: |
          python -m py_compile scripts/audit_gesui_DK_EBMS_2023_2024_same_month_original_family_source_4clusters.py
          python -u scripts/audit_gesui_DK_EBMS_2023_2024_same_month_original_family_source_4clusters.py \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_2024_SAME_MONTH_ORIGINAL_FAMILY_INDEPENDENT_REPLAY_QC.json
      - name: Preserve independent licensed aggregate output without raw biological records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_2024_SAME_MONTH_ORIGINAL_FAMILY_INDEPENDENT_REPLAY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit Denmark two-year common-month site/count and four-outfall leave-one-out sensitivity"
          git fetch origin analysis/dk-ebms-2023-24-season-aligned-families-20261110
          git rebase origin/analysis/dk-ebms-2023-24-season-aligned-families-20261110
          git push origin HEAD:analysis/dk-ebms-2023-24-season-aligned-families-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-Denmark-2023-2024-common-month-independent-licensed-count-QC
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_2024_SAME_MONTH_ORIGINAL_FAMILY_INDEPENDENT_REPLAY_QC.json
          retention-days: 90
