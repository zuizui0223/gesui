name: gesui 2020 registered measured WWTP load to source-blind BQE river sites (NO EQR)

on:
  push:
    branches:
      - "analysis/uwwtd2020-source-only-feasibility-20261108"
    paths:
      - "scripts/gesui_2020_source_only_bqe_river_graph.py"
      - ".github/workflows/gesui-2020-source-only-BQE-graph.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-source-2020-biology-no-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pandas numpy geopandas pyarrow pyogrio shapely scipy requests
      - name: Restore third-party HydroRIVERS EU graph from exact pinned source SHA
        run: |
          mkdir -p /tmp/gesui-source-2020
          curl --fail --location --silent --show-error --retry 2 --max-time 380 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-source-2020/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-source-2020/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Connect original 2020 reporter-year WWTP mass and fixed 2020 BQE geographic site IDs on directed river
        run: |
          python -m py_compile scripts/gesui_2020_source_only_bqe_river_graph.py
          python -u scripts/gesui_2020_source_only_bqe_river_graph.py \
            --source-candidates results/eea2020_source_only_20261108/2020_PUBLIC_CYCLE_BOTH_MEASURED_NP_UNIQUE_FW_OUTFALLS.csv \
            --source-qc results/eea2020_source_only_20261108/2020_PUBLIC_GPKG_NP_SOURCE_QC.json \
            --frozen-sites results/eea2020_source_only_20261108/BQE_2020_FROZEN_SITES/2020_FIXED_BQE_MONITORING_SITE_METADATA_NO_EQR.csv \
            --site-qc results/eea2020_source_only_20261108/BQE_2020_FROZEN_SITES/2020_BQE_PREOUTCOME_SOURCE_QC.json \
            --methods2018 results/eea2018_independent_source_frozen_20261108/2018_SOURCE_ONLY_BQE_WWTP_NP_UPSTREAM_AND_NEGATIVE_CONTROL.csv \
            --methods2022 results/eea2022_biology_bqe_20261108/SOURCE_ONLY_BQE_SITE_REGISTRY.csv \
            --river-parquet /tmp/gesui-source-2020/HydroRIVERS_v10_eu.geoparquet \
            --out results/eea2020_source_only_20261108/2020_BQE_RIVER_SOURCE_FROZEN
      - name: Archive original source-only 2020 exposure/negative control and method-support gate before any EQR scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2020_source_only_20261108/2020_BQE_RIVER_SOURCE_FROZEN/
          git diff --cached --quiet && exit 0
          git commit -m "Freeze 2020 registered measured WWTP mass river graph and original EQR method compatibility before scores"
          git fetch origin analysis/uwwtd2020-source-only-feasibility-20261108
          git rebase origin/analysis/uwwtd2020-source-only-feasibility-20261108
          git push origin HEAD:analysis/uwwtd2020-source-only-feasibility-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2020-WWTP-BQE-directed-graph-source-frozen-no-outcome
          path: results/eea2020_source_only_20261108/2020_BQE_RIVER_SOURCE_FROZEN/
          retention-days: 90
          if-no-files-found: warn
