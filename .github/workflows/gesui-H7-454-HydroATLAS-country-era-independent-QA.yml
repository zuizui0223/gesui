name: gesui 454 L7 source and actual HydroATLAS land-use original independent FR year QA

on:
  push:
    paths:
      - "scripts/audit_H7_454_HydroATLAS_country_period_independent_source_replay.py"
      - ".github/workflows/gesui-H7-454-HydroATLAS-country-era-independent-QA.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  independent-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=1.26,<3" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          run-id: 43225986249
          name: gesui-hydroatlas-1219-native-L07-cropland-artificial-source-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_crop_urban
      - uses: actions/download-artifact@v4
        with:
          run-id: 43222864099
          name: gesui-H7-454-reported-2018-2022-NP-to-site-flow-source-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_reported_source
      - uses: actions/download-artifact@v4
        with:
          run-id: 43215754868
          name: gesui-EU234-H7-three-outcome-static-WWTP-observational-macro
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_454_ecology
      - uses: actions/download-artifact@v4
        with:
          run-id: 43227058486
          name: gesui-H7-454-true-HydroATLAS-landuse-adjusted-WWTP-NP-3layer
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_land_adjusted
      - name: Independently reproduce original 15 H7×year environment regression MSE fits and cross country/year source sensitivity
        env:
          ORIGINAL_SOURCE_1219_HYDROATLAS: ${{ runner.temp }}/original_crop_urban/HYDROATLAS_V1_L07_1219_H7_BASIN_RAW_LANDUSE_ATTRIBUTES_SOURCE_ONLY.json
          ORIGINAL_SOURCE_454_REPORTED_NP: ${{ runner.temp }}/original_reported_source/EEA2018_EEA2022_454_H7_ORIGINAL_REPORTED_NP_SITE_FLOW_EQUIVALENT_SOURCE_ONLY.json
          ORIGINAL_454_BIOLOGICAL_ROWS: ${{ runner.temp }}/original_454_ecology/EU234_H7_ORIGINAL_STUDY_NATIVE_BASINPERIOD_EQR_PLANT_BUTTERFLY_SOURCE_COHORT.csv
          ORIGINAL_H7_LAND_ADJUSTED_MAIN_RESULT: ${{ runner.temp }}/original_land_adjusted/H7_454_EU_THREE_LAYER_STATIC_WWTP_REPORTED_NP_HYDROATLAS_CROP_URBAN_NATURAL_FLOW_RESULTS.json
        run: |
          python -m py_compile scripts/audit_H7_454_HydroATLAS_country_period_independent_source_replay.py
          python scripts/audit_H7_454_HydroATLAS_country_period_independent_source_replay.py
      - name: Preserve original data reproducibility and France/year restricted environmental sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-H7-454-HydroATLAS-original-independent-FR-year-QA
          path: ${{ runner.temp }}/gesui_H7_454_LANDUSE_INDEPENDENT_QA/
          if-no-files-found: warn
          retention-days: 30
