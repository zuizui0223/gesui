name: gesui DK2025 NEW399 original top3 accepted species x 2021 WorldCover actual habitat
on:
  push:
    branches: ["analysis/dk-ebms-2025-species-composition-decomposition-20261110"]
    paths:
      - ".github/workflows/gesui-DK2025-new399-top3species-worldcover-habitat.yml"
      - "scripts/gesui_DK2025_NEW399_top3_butterfly_species_2021_WorldCover500m_habitat.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_species_habitat_six_area_posthoc:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Only source-independent numeric linear algebra, no raw public site downloads
        run: python -m pip install --quiet numpy
      - name: Re-read official eBMS license source, verify original 399 taxa and 286 2021 WorldCover, calculate three dominant species with six-area resampling
        run: |
          python -m py_compile scripts/gesui_DK2025_NEW399_top3_butterfly_species_2021_WorldCover500m_habitat.py
          python -u scripts/gesui_DK2025_NEW399_top3_butterfly_species_2021_WorldCover500m_habitat.py \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_TOP3_SPECIES_WORLD_COVER2021_6REGION_POSTHOC_QC.json
      - name: Preserve only 3species summary counts and effects, not individual licensed species coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_TOP3_SPECIES_WORLD_COVER2021_6REGION_POSTHOC_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze Danish 2025 source-limited three dominant butterfly species vs 2021 WorldCover actual local habitat sensitivity"
          git fetch origin analysis/dk-ebms-2025-species-composition-decomposition-20261110
          git rebase origin/analysis/dk-ebms-2025-species-composition-decomposition-20261110
          git push origin HEAD:analysis/dk-ebms-2025-species-composition-decomposition-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-DK2025-new399-2021WorldCover-top3species-original-habitat-QA
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_TOP3_SPECIES_WORLD_COVER2021_6REGION_POSTHOC_QC.json
          retention-days: 90
