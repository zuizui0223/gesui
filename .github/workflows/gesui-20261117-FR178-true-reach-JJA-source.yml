name: gesui FR178 original true riverline and paired summer TP months SOURCE-only
on:
  push:
    branches: [analysis/gesui-20261117-onepaper-pathway-identification-decision]
    paths:
      - 'analysis/20261117_FR263_riverland/fr178_source_only_true_reach_JJA_cohort.py'
      - '.github/workflows/gesui-20261117-FR178-true-reach-JJA-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/20261117_FR263_riverland/fr178_source_only_true_reach_JJA_cohort.py'
      - '.github/workflows/gesui-20261117-FR178-true-reach-JJA-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_source_selection_178_water_sites_before_S2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44009618859
          name: gesui-20261117-FR263-HydroRIVERS-v1-thirdparty-conversion-geometry-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed_geometry
      - uses: actions/download-artifact@v4
        with:
          run-id: 43378522025
          name: gesui-FR263-2018-2022-true-TP-common-calendar-months-SOURCE
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed_tp_months
      - name: Verify original 263 IDs, freeze 178 near true river + summer measured date opportunity without outcomes
        run: |
          python -m py_compile analysis/20261117_FR263_riverland/fr178_source_only_true_reach_JJA_cohort.py
          python -u analysis/20261117_FR263_riverland/fr178_source_only_true_reach_JJA_cohort.py \
            --geometry '${{ runner.temp }}/signed_geometry/FR263_ORIGINAL_HYRIV_SOURCE_GEOMETRY_QA.csv' \
            --months '${{ runner.temp }}/signed_tp_months/FR263_ORIGINAL_TP_I2M2_SAME_STATION_COMMON_MONTHS_SOURCE_ONLY.json' \
            --out '${{ runner.temp }}/FR178_original_source_frozen'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261117-FR178-original-riverline-JJA-source-only
          path: '${{ runner.temp }}/FR178_original_source_frozen/'
          retention-days: 90
          if-no-files-found: warn
