name: GESUI 2022 additional-country butterfly GBIF registry metadata only
on:
  push:
    branches:
      - analysis/gesui-hns-family-taxon-attribution-20261115
    paths:
      - analysis/20261115_riparian_source_only/audit_gbif_2022_multicountry_dataset_registry.py
      - .github/workflows/gesui-20261115-2022-other-country-source-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datasets-only-no-butterfly-occs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify original frozen biological protocol and GBIF dataset registry metadata only
        shell: bash
        run: |
          set -euo pipefail
          python analysis/20261115_riparian_source_only/audit_gbif_2022_multicountry_dataset_registry.py \
            --freeze docs/FROZEN_PROTOCOL_20261115_WITHIN_H7_RIPARIAN_HNS_ONE_SHOT.md \
            --output results/20261115_riparian_source_only/GBIF_2022_OTHER_COUNTRY_DATASET_REGISTRY_SOURCE_ONLY.json
          python - <<'PY'
          import json
          p="results/20261115_riparian_source_only/GBIF_2022_OTHER_COUNTRY_DATASET_REGISTRY_SOURCE_ONLY.json"
          a=json.load(open(p))
          assert a["n_registry_candidates_preselected"]==11
          assert a["GBIF_event_occurrence_or_species_results_queried"] is False
          assert a["outfall_site_matching_or_HNS_performed"] is False
          assert a["frozen_biological_primary_status"]=="STOP_SOURCE_OPPORTUNITY_UNPROVEN"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-2022-additional-country-GBIF-dataset-registry-sourceonly
          path: results/20261115_riparian_source_only/GBIF_2022_OTHER_COUNTRY_DATASET_REGISTRY_SOURCE_ONLY.json
          if-no-files-found: error
