name: gesui 2013 EPA true same UID observational piecewise path vs physical filter
on:
  push:
    paths:
      - 'analysis/20261115_piecewise_path/**'
      - '.github/workflows/gesui-20261115-nrsa1314-piecewise-path.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-field-observational-path:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible numerical dependencies
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'statsmodels>=0.14,<1' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2'
      - name: Recover original publisher SHA and same-UID eligibility from signed 2013 EPA source census
        uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen1314
      - name: Reconstruct genuine EPA 2013-14 same native UID chemistry + areal standing biofilm + EPT + field habitat
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/frozen1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: |
          python -m py_compile scripts/gesui_NRSA1314_independent_cycle_numeric.py
          python -u scripts/gesui_NRSA1314_independent_cycle_numeric.py > ${{ runner.temp }}/original_epa2013_reconstruction.log
      - name: Fit observational source-path projection identity, HUC8 cluster CIs and genuine heldout habitat-resource competition
        run: |
          python -m py_compile analysis/20261115_piecewise_path/observational_paths.py
          python -u analysis/20261115_piecewise_path/observational_paths.py \
            --output ${{ runner.temp }}/gesui1314_independent_numeric/NRSA1314_OBSERVATIONAL_PIECEWISE_PATH.json \
            --bootstrap 500
      - name: Retain source-locked original analytical findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-20261115-nrsa1314-observed-path-vs-filter
          path: ${{ runner.temp }}/gesui1314_independent_numeric/NRSA1314_OBSERVATIONAL_PIECEWISE_PATH.json
          if-no-files-found: warn
          retention-days: 90
