name: ChemPop conditional EDF score specificity
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'analysis/20261125_chempop_edf_conditional/**'
      - '.github/workflows/gesui-chempop-edf-conditional-label.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'analysis/gesui-chempop-edf-conditional-label-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Original source replay and single conditional EDF null
        run: |
          mkdir -p "$RUNNER_TEMP/receipt" "$RUNNER_TEMP/edf"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14985171063/zip > "$RUNNER_TEMP/receipt/resolution.zip"
          python -m py_compile analysis/20261125_chempop_edf_conditional/edf_label.py
          python -u analysis/20261125_chempop_edf_conditional/edf_label.py --work "$RUNNER_TEMP/receipt" --out "$RUNNER_TEMP/edf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-chempop-conditional-edf-label-null
          path: ${{ runner.temp }}/edf
          if-no-files-found: warn
          retention-days: 90
