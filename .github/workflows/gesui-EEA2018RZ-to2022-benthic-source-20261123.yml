name: EEA 2018 mapped riverbanks to actual same-site 2022 benthos source gate
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_EEA2018_RZ_2022_benthos_same_site_source_gate_20261123.py
      - .github/workflows/gesui-EEA2018RZ-to2022-benthic-source-20261123.yml
permissions:
  contents: read
  actions: read
jobs:
  source-only-method-stable-revisited:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed parser for original RZ LCLU source, never biological outcome
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-20261117-RZ2018-2018Benthic-2639-source-only-physical-class-areas
          run-id: 44004357868
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/official_2018_riparian
      - name: Retrieve exact original source-locked 2022 EEA benthos panel as independent git blob
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/analysis/eea2026-waterbase-biology-bqe-20261108"
          git show FETCH_HEAD:results/eea2022_biology_bqe_20261108/BENTHIC_INVERTEBRATES_2022_SOURCE_EQR.csv > "${{ runner.temp }}/original_eea2022_benthos_source.csv"
          ACTUAL_BLOB=$(git hash-object "${{ runner.temp }}/original_eea2022_benthos_source.csv")
          test "$ACTUAL_BLOB" = "325f199e985d9862ffee5b0edb205c61a7be3833"
          echo "Original exact 2022 git blob verified $ACTUAL_BLOB"
      - name: Verify genuine official 2018 land source and source-only 2018-2022 same-site EQR support
        run: |
          sha256sum results/eea2018_independent_temporal_bqe_20261108/benthic_invertebrates_2018_WWTP_source_real_EQR.csv
          python -m py_compile scripts/gesui_EEA2018_RZ_2022_benthos_same_site_source_gate_20261123.py
          python -u scripts/gesui_EEA2018_RZ_2022_benthos_same_site_source_gate_20261123.py \
            --rz "${{ runner.temp }}/official_2018_riparian/EEA2018_2018_RIPARIAN_ZONES_REST_OFFICIAL_SOURCE_ONLY_QA.json" \
            --eq18 results/eea2018_independent_temporal_bqe_20261108/benthic_invertebrates_2018_WWTP_source_real_EQR.csv \
            --eq22 "${{ runner.temp }}/original_eea2022_benthos_source.csv" \
            --out "${{ runner.temp }}/2018_to2022_riparian_benthos_same_site_SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-RZ2018-to-2022-benthos-same-station-source-only
          path: ${{ runner.temp }}/2018_to2022_riparian_benthos_same_site_SOURCE.json
          if-no-files-found: warn
          retention-days: 60
