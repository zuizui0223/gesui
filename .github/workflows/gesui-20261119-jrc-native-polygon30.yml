name: GESUI fixed30 JRC native soil HydroID vs water point BasinID polygon comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gesui-20261119-jrc-native-polygon30.yml
      - analysis/20261119_jrc_native_basins/jrc_native_point_soil_polygon30_gate.py
      - tests/test_jrc_native_soil_point_geometry30_gate.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-polygon-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install polygon geometry source dependency
        run: python -m pip install --disable-pip-version-check shapely==2.0.6
      - name: Unit-test EsriJSON outer/hole geometry fidelity
        run: python -m unittest discover -s tests -p 'test_jrc_native_soil_point_geometry30_gate.py' -v
      - name: Retrieve unchanged full native JRC attribute census source-only artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gesui_nativefull
          gh run download 44440277477 --repo zuizui0223/gesui --name gesui-jrc-five-native-basin-source-area-census --dir /tmp/gesui_nativefull
          find /tmp/gesui_nativefull -type f -printf '%f %s bytes\n'
      - name: Full native SOURCE candidate exact area receipts then deterministic 30 original polygon overlays
        run: |
          python analysis/20261119_jrc_native_basins/jrc_native_point_soil_polygon30_gate.py \
            --source-csv /tmp/gesui_nativefull/JRC_NATIVE_POSSIBLE_SHARED_GEOMETRY_ONLY_SOURCE.csv \
            --source-report /tmp/gesui_nativefull/JRC_NATIVE_FIVE_LAYER_FULL_SOURCE_GATE.json \
            --out results/20261119_jrc_native_geom30
      - name: Archive complete 30-ID polygon identity, overlap and nested-basin diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-jrc-soilHydroID-waterBasinID-fixed30-original-polygon-source
          path: results/20261119_jrc_native_geom30/
          if-no-files-found: warn
          retention-days: 45
