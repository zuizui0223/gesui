name: gesui NRSA source-only biomass/chla UID crosswalk

on:
  push:
    paths:
      - "scripts/gesui_nrsa_2era_periphyton_UID_crosswalk_SOURCE_ONLY.py"
      - ".github/workflows/gesui-nrsa-2era-UID-crosswalk.yml"
  pull_request:
    paths:
      - "scripts/gesui_nrsa_2era_periphyton_UID_crosswalk_SOURCE_ONLY.py"
      - ".github/workflows/gesui-nrsa-2era-UID-crosswalk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blinded-id-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check ID and categorical unit concordance before biological effects
        run: |
          python -m py_compile scripts/gesui_nrsa_2era_periphyton_UID_crosswalk_SOURCE_ONLY.py
          python scripts/gesui_nrsa_2era_periphyton_UID_crosswalk_SOURCE_ONLY.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          path: ${{ runner.temp }}/nrsa_uid_biomass_crosswalk/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
          if-no-files-found: warn
          retention-days: 30
