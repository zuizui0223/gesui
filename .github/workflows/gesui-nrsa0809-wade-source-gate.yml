name: gesui original NRSA2008 source wadeable primary and HUC8 semantic gate
on:
  push:
    paths:
      - scripts/gesui_NRSA0809_original_Wade_Source_Gate.py
      - .github/workflows/gesui-nrsa0809-wade-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-2008-wade-source-population:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "pandas>=2.1,<3"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-five-original-EPA-source-census
          run-id: 43562414140
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orig0809
      - name: EPA SHA-canonical source only BERWW/CHEMW PROB/UID/HUC8 metadata check
        env:
          NRSA0809_SOURCE_LOCK: ${{ runner.temp }}/orig0809/NRSA0809_EPA_ORIGINAL_SOURCE_ONLY_COUNT_AND_GRANULARITY.json
        run: |
          python -m py_compile scripts/gesui_NRSA0809_original_Wade_Source_Gate.py
          python -u scripts/gesui_NRSA0809_original_Wade_Source_Gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NRSA0809-original-wade-BERWW-CHEMW-HUC8-gate
          path: ${{ runner.temp }}/gesui0809_semantics/NRSA0809_ORIGINAL_WADEABLE_BENTHIC_CHEMW_PHAB_SEMANTICS.json
          if-no-files-found: warn
          retention-days: 60
