name: gesui Denmark 2023-24 eBMS source unit independence BEFORE butterfly counts
on:
  push:
    branches: ["analysis/ebms-denmark-wwtp-source-feasibility-20261110"]
    paths:
      - ".github/workflows/gesui-DK-ebms-source-site-cluster-QA-before-butterflies.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-source-duplicates-not-butterfly-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Independently replay fixed 107 Event sites, 203 WWTP outfalls, 0.5km spatial pseudoreplication
        run: |
          python -m py_compile scripts/audit_DK_ebms_2023_24_5km_site_pseudoreplication_prebutterfly.py
          python -u scripts/audit_DK_ebms_2023_24_5km_site_pseudoreplication_prebutterfly.py \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_24_EVENT_SITE_WWTP_CLUSTER_PSEUDOREPLICATION_PREOUTCOME_QA.json
      - name: Archive source-only independent repeat-unit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_24_EVENT_SITE_WWTP_CLUSTER_PSEUDOREPLICATION_PREOUTCOME_QA.json
          git diff --cached --quiet && exit 0
          git commit -m "Archive four-outfall effective near-source sample before Denmark butterfly family counts"
          git fetch origin analysis/ebms-denmark-wwtp-source-feasibility-20261110
          git rebase origin/analysis/ebms-denmark-wwtp-source-feasibility-20261110
          git push origin HEAD:analysis/ebms-denmark-wwtp-source-feasibility-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-DK-eBMS-5km-2023-24-before-butterflies-source-clustering
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DENMARK_2023_24_EVENT_SITE_WWTP_CLUSTER_PSEUDOREPLICATION_PREOUTCOME_QA.json
          retention-days: 90
