name: gesui EPA NWCA 2011 2016 independent standardized wetland plant source gate
on:
  push:
    branches: ["analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111"]
    paths:
      - ".github/workflows/gesui-NWCA2011-2016-original-vegsurvey-siteONLY.yml"
      - "scripts/gesui_NWCA2011_2016_original_site_vegmetadata_SOURCE_FIRST.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_NWCA_2011_2016_siteIDs_veg_response_blind:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install official EPA source metadata reader
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile scripts/gesui_NWCA2011_2016_original_site_vegmetadata_SOURCE_FIRST.py
      - name: Download four explicit official EPA NWCA historical source files
        run: |
          mkdir -p /tmp/gesui-nwca-history
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-04/nwca11_siteinfo.csv" \
            -o /tmp/gesui-nwca-history/2011_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/sites/default/files/2016-10/nwca2011_vegmetrics.csv" \
            -o /tmp/gesui-nwca-history/2011_vegmetrics.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2022-04/nwca-2016-site-information-data_0.csv" \
            -o /tmp/gesui-nwca-history/2016_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-03/nwca_2016_veg_metrics.csv" \
            -o /tmp/gesui-nwca-history/2016_vegmetrics.csv
          sha256sum /tmp/gesui-nwca-history/*.csv
          for p in /tmp/gesui-nwca-history/*.csv; do test "$(wc -c < "$p")" -gt 1000; done
      - name: Observe source IDs/site-year/weights and original VEGETATION FIELD NAMES only; no H_ALL results
        run: |
          python -u scripts/gesui_NWCA2011_2016_original_site_vegmetadata_SOURCE_FIRST.py \
            --source-dir /tmp/gesui-nwca-history \
            --out results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_ORIGINAL_SITE_VEG_SOURCE_BEFORE_PLANT_OUTCOMES.json
      - name: Commit exact provenance/validity barriers even when a historical year cannot be admitted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_ORIGINAL_SITE_VEG_SOURCE_BEFORE_PLANT_OUTCOMES.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit 2011/2016 genuine EPA probability wetland site & vegmetric source years before Shannon outcome"
          git fetch origin analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git rebase origin/analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git push origin HEAD:analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NWCA2011-2016-original-plant-survey-source-only
          path: |
            results/us_NWCA2021_plant_TNTP_20261110/NWCA2011_2016_ORIGINAL_SITE_VEG_SOURCE_BEFORE_PLANT_OUTCOMES.json
            /tmp/gesui-nwca-history/*.csv
          retention-days: 60
