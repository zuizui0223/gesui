name: gesui EPA NRSA2013-14 independent BERW EPT Chla AFDM x riverbed cycle
on:
  push:
    paths:
      - scripts/gesui_NRSA1314_independent_cycle_numeric.py
      - .github/workflows/gesui-nrsa1314-independent-BERW-Chla-AFDM-numeric.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-frozen-real-independent-ecological-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen1314
      - name: Fresh six official 2013 original EPA CSVs, exact native UID and actual areal unit same-visit fit
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/frozen1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: |
          python -m py_compile scripts/gesui_NRSA1314_independent_cycle_numeric.py
          python -u scripts/gesui_NRSA1314_independent_cycle_numeric.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa1314-berw-ept-periphyton-chla-afdm-independent-cycle
          path: ${{ runner.temp }}/gesui1314_independent_numeric/NRSA1314_INDEPENDENT_BERW_AREAL_PCHL_AFDM_EMBED_RESULT.json
          if-no-files-found: warn
          retention-days: 60
