name: gesui EPA2008 NRSA wadeable EPT taxa MMI true nutrient physical macro
on:
  push:
    paths:
      - scripts/gesui_NRSA0809_real_EPT_NP_PHab_three_responses.py
      - .github/workflows/gesui-nrsa0809-EPT-NP-PHab-numeric.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-verified-three-independent-benthic-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-wade-BERWW-CHEMW-HUC8-gate
          run-id: 43562599406
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original0809
      - name: Original exact 2008 EPA water, berww, benthic MMI, physical and site source
        env:
          NRSA0809_FROZEN_SOURCE_QA: ${{ runner.temp }}/original0809/NRSA0809_ORIGINAL_WADEABLE_BENTHIC_CHEMW_PHAB_SEMANTICS.json
        run: |
          python -m py_compile scripts/gesui_NRSA0809_real_EPT_NP_PHab_three_responses.py
          python -u scripts/gesui_NRSA0809_real_EPT_NP_PHab_three_responses.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NRSA0809-EPTpercentage-EPTtaxa-MMI-real-ambientNP-PHab
          path: ${{ runner.temp }}/gesui0809_real_numeric/NRSA0809_ORIGINAL_EPT_TAXON_MMI_TRUE_NP_PHAB_RESULTS.json
          if-no-files-found: warn
          retention-days: 60
