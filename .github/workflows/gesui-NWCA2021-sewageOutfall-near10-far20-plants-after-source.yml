name: gesui NWCA2021 standardized wetland vegetation vs SOURCE-FROZEN NPDES sewage outfall near10 far20
on:
  push:
    branches: ["analysis/us-nwca2021-npdes-potential-exposure-source-20261110"]
    paths:
      - ".github/workflows/gesui-NWCA2021-sewageOutfall-near10-far20-plants-after-source.yml"
      - "scripts/gesui_NWCA2021_frozen_568_wetland_POTW_geodesic_near10_far20_plant_TNTP.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_frozen_568_NWCA2021_plants_actual_NP_vs_registered_NPDES_POTW:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source verified EPA 2021 wetland original plant model dependencies
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy statsmodels
          python -m py_compile scripts/gesui_NWCA2021_frozen_568_wetland_POTW_geodesic_near10_far20_plant_TNTP.py
      - name: Validate original NPDES POTW outfall source geometry and 2021 plausible permits passed BEFORE 2021 H_ALL opened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_NPDES_SEWAGE_OUTFALL_568SITE_SOURCE_ONLY_GEOGRAPHY_GATE.json")
          x=json.loads(p.read_text())
          assert x['original_2021_NWCA_plant_chemistry_568_site_rows_from_preoutcome_gate']==568
          assert x['no_original_NWCA_H_ALL_FQAI_or_TNTP_outcomes_accessed_in_source_stage']
          assert x['source_precommitted_GEO_eligibility_gate']['permitted_2021_outfall_distance_association_source_support_PASS'] is True
          r=x['predeclared_nearest_sewage_outfall_geodesic_source_controls']['strict']
          assert r['site_near10km_n']==128 and r['site_far_geodesic20km_or_more_n']==311
          assert r['nearest_10km_administrative_unique_NPDES_permits_n']==160
          print("Pre-outcome original source PASS: 128 near10/311 far20, 160 registered municipal permit IDs, no biological response inspected.")
          PY
      - name: Fetch exact original NWCA2021 public four CSV source files, source-SHA verified in estimator
        run: |
          mkdir -p /tmp/gesui-NWCA2021-original
          for item in siteinfo waterchem_wide vegmetrics hydrology_sources_wide; do
            curl --retry 4 --connect-timeout 25 --max-time 240 --fail --location --silent --show-error \
              "https://www.epa.gov/system/files/other-files/2024-05/nwca21_$item-data.csv" \
              -o "/tmp/gesui-NWCA2021-original/nwca21_$item-data.csv"
            test -s "/tmp/gesui-NWCA2021-original/nwca21_$item-data.csv"
          done
      - name: On original 568 same-source wetland plots, compare plant Shannon FQAI native alien and actual TN TP within original state x ecoregion near10 vs far20
        run: |
          python -u scripts/gesui_NWCA2021_frozen_568_wetland_POTW_geodesic_near10_far20_plant_TNTP.py \
            --nwca-source-dir /tmp/gesui-NWCA2021-original \
            --out results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_NPDES_WETLAND_HALL_FQAI_AND_ACTUAL_NP_STRICT_NEAR10_FAR20_RESULTS.json
      - name: Archive all signs/CI from original matched source, no hydrological or actual WWTP N/P causation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_NPDES_WETLAND_HALL_FQAI_AND_ACTUAL_NP_STRICT_NEAR10_FAR20_RESULTS.json
          git diff --cached --quiet && exit 0
          git commit -m "Report matched USA NWCA probability wetland Shannon and measured TN TP at registered municipal outfall source proximities"
          git fetch origin analysis/us-nwca2021-npdes-potential-exposure-source-20261110
          git rebase origin/analysis/us-nwca2021-npdes-potential-exposure-source-20261110
          git push origin HEAD:analysis/us-nwca2021-npdes-potential-exposure-source-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-US-NWCA2021-NPDES-registered-WWTP-proximity-plant-TNTP
          path: results/us_NWCA2021_plant_TNTP_20261110/EPA_NWCA2021_NPDES_WETLAND_HALL_FQAI_AND_ACTUAL_NP_STRICT_NEAR10_FAR20_RESULTS.json
          retention-days: 90
