name: gesui Peters 2026 source v5 TN TP measured station schema and years

on:
  push:
    branches:
      - "analysis/nutrient-source-coverage-20261107"
    paths:
      - "scripts/inspect_peters_nutrient_metadata.py"
      - ".github/workflows/gesui-peters-measured-source-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source reader
        run: python -m pip install --quiet requests pandas
      - name: Download and MD5 verify source only (5 files, <=5MB each)
        run: python -u scripts/inspect_peters_nutrient_metadata.py --out /tmp/gesui_peters/verified_source_schema.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-Peters2026-v5-measured-source-schema
          path: /tmp/gesui_peters/verified_source_schema.json
          if-no-files-found: warn
          retention-days: 30
