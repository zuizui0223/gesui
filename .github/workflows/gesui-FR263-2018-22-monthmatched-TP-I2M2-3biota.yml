name: gesui FR263 2018-22 real river TP common calendar months I2M2 EQR 3 biota

on:
  push:
    paths:
      - "scripts/gesui_FR263_2018_22_monthmatched_real_TP_I2M2_delta_H6_3biota.py"
      - ".github/workflows/gesui-FR263-2018-22-monthmatched-TP-I2M2-3biota.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  original-month-matched-source-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible numerical field and watershed models
        run: python -m pip install --quiet "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.4,<2"
      - name: Restore original outcome-blind 263 same-station calendar month overlap and source SHA
        uses: actions/download-artifact@v4
        with:
          run-id: 43378522025
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          name: gesui-FR263-2018-2022-true-TP-common-calendar-months-SOURCE
          path: ${{ runner.temp }}/source_original_common_months
      - name: Restore previous 263 source site exact measured TP and EEA I2M2 plus same 73 H7 GBIF trait-index outcomes
        uses: actions/download-artifact@v4
        with:
          run-id: 43373639391
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          name: gesui-FR2018-22-realTP-I2M2-263-identical-sites-73H7-H6-3biota
          path: ${{ runner.temp }}/source_original_TP_EQR_annual
      - name: Run original measured 2018 and 2022 TP monthly equal-common-month median contrast; same sample and 24 H6 regions
        env:
          PRE_OUTCOME_COMMON_MONTH_WQ_SOURCE: ${{ runner.temp }}/source_original_common_months/FR263_ORIGINAL_TP_I2M2_SAME_STATION_COMMON_MONTHS_SOURCE_ONLY.json
          ORIGINAL_263_SAME_SITE_RAW_ANNUAL_TP_EQR_STUDY: ${{ runner.temp }}/source_original_TP_EQR_annual/FR_REAL_2018_2022_I2M2_SAME_STATION_TP_DELTA_73H7_24H6_3BIOTA_RESULTS.json
          ORIGINAL_263_REAL_TP_I2M2_SITE_DATA: ${{ runner.temp }}/source_original_TP_EQR_annual/FR263_SAME_PHYSICAL_STATION_2018_2022_REAL_TP_AND_EEA_EQR.csv
          ORIGINAL_73_H7_TP_I2M2_GBIF_STUDY_DATA: ${{ runner.temp }}/source_original_TP_EQR_annual/FR73_HYBAS7_NATIVE_2018_2022_REAL_TP_I2M2_EQR_AND_GBIF_INDEX_DELTA.csv
        run: |
          python -m py_compile scripts/gesui_FR263_2018_22_monthmatched_real_TP_I2M2_delta_H6_3biota.py
          python scripts/gesui_FR263_2018_22_monthmatched_real_TP_I2M2_delta_H6_3biota.py
      - name: Preserve genuine original 263 same-site measured month-aligned TP and I2M2, 73 H7 24 H6, GBIF proxy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-FR263-2018-22-TP-calendar-month-balanced-I2M2-3biota-H6
          path: ${{ runner.temp }}/gesui_FR263_2018_22_TP_MONTH_BALANCED/
          if-no-files-found: warn
          retention-days: 30
