name: gesui NWCA2016 yearvalid 50near162far source HALL independent NumPy QA
on:
  push:
    branches: ["analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111"]
    paths:
      - ".github/workflows/gesui-NWCA2016-yearvalid-POTW-HALL-independentQA.yml"
      - "scripts/audit_gesui_NWCA2016_asof2016_source_HALL_independent_numpy.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_2016_EPA_yearvalid_asof2016_POTW_numpy_QA:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Prepare independent numerical source audit and original NWCA2016 files
        run: |
          python -m pip install --quiet numpy pandas scipy statsmodels
          python -m py_compile scripts/audit_gesui_NWCA2016_asof2016_source_HALL_independent_numpy.py
          mkdir -p /tmp/gesui-NWCA2016
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2022-04/nwca-2016-site-information-data_0.csv" \
            -o /tmp/gesui-NWCA2016/2016_siteinfo.csv
          curl --fail -L --retry 3 --max-time 120 -sS \
            "https://www.epa.gov/system/files/other-files/2023-03/nwca_2016_veg_metrics.csv" \
            -o /tmp/gesui-NWCA2016/2016_vegmetrics.csv
      - name: Independently replay 2016 strict asof2016 POTW geographic H_ALL from 50near162far with 19-state CR1 and leave-one-state-out
        run: |
          python -u scripts/audit_gesui_NWCA2016_asof2016_source_HALL_independent_numpy.py \
            --source-dir /tmp/gesui-NWCA2016 \
            --out results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_YEARVALID_SEWAGE_SOURCE_HALL_212SITE_INDEPENDENT_QA.json
      - name: Keep source-positive/negative audit without claiming 2016 true wastewater discharge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_YEARVALID_SEWAGE_SOURCE_HALL_212SITE_INDEPENDENT_QA.json
          git diff --cached --quiet && exit 0
          git commit -m "Verify 2016 POTW historical permit date site source 50near162far WLS/OLS H_ALL and 19-state deletion independently"
          git fetch origin analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git rebase origin/analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
          git push origin HEAD:analysis/us-nwca-2011-2016-2021-potw-plant-replication-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NWCA2016-NPDES-yearvalid-HALL-source-NumPy-independent
          path: results/us_NWCA2021_plant_TNTP_20261110/NWCA2016_YEARVALID_SEWAGE_SOURCE_HALL_212SITE_INDEPENDENT_QA.json
          retention-days: 90
