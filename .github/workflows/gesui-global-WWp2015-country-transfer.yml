name: gesui global original WWp positive 1055 ports 42-country macro transport
on:
  push:
    branches: ["analysis/global-2015-WWp-positive-country-transfer-20261110"]
    paths:
      - ".github/workflows/gesui-global-WWp2015-country-transfer.yml"
      - "scripts/gesui_global_WWp2015_original_1055port_country_transfer.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  global_original42country_2015WWp_macro_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install only original public source model dependencies
        run: |
          python -m pip install --quiet "numpy<3" pandas scipy statsmodels
          python -m py_compile scripts/gesui_global_WWp2015_original_1055port_country_transfer.py
      - name: Recover three pinned successful original world/global Jones/WPI port SOURCE artifacts from public chocho Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gesui-global2015/wwtp /tmp/gesui-global2015/jones /tmp/gesui-global2015/world
          gh run download 41414513676 --name global-hydrowaste-58502-WPI1596-port-host-study \
            --dir /tmp/gesui-global2015/wwtp --repo zuizui0223/chocho
          gh run download 41563940689 --name pangaea-jones2015-5arc-wpi1596-wastewater-wwtp \
            --dir /tmp/gesui-global2015/jones --repo zuizui0223/chocho
          gh run download 41562997326 --name hydroWASTE-WPI1596-WorldCover2021-urban \
            --dir /tmp/gesui-global2015/world --repo zuizui0223/chocho
          test -s /tmp/gesui-global2015/wwtp/WWTP_port_1596_features.csv
          test -s /tmp/gesui-global2015/jones/Jones2015_WPI1596_port_grid_census.csv
          test -s /tmp/gesui-global2015/world/WPI1596_worldcover2021_port_measurements.csv
          sha256sum /tmp/gesui-global2015/wwtp/WWTP_port_1596_features.csv \
            /tmp/gesui-global2015/jones/Jones2015_WPI1596_port_grid_census.csv \
            /tmp/gesui-global2015/world/WPI1596_worldcover2021_port_measurements.csv
      - name: Independently replay exact original positive 1055/42 beta and score country 2deg block / unseen country heldout WITHOUT retuning
        run: |
          python -u scripts/gesui_global_WWp2015_original_1055port_country_transfer.py \
            --jones /tmp/gesui-global2015/jones/Jones2015_WPI1596_port_grid_census.csv \
            --worldcover /tmp/gesui-global2015/world/WPI1596_worldcover2021_port_measurements.csv \
            --out results/global_WWp2015_country_transfer_20261110/GLOBAL_1055_PORT_42_COUNTRY_WWp_OUTOFCOUNTRY_AND_GEO_HOLDOUT.json
      - name: Preserve only global macro country/fold aggregate results and original source hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/global_WWp2015_country_transfer_20261110/GLOBAL_1055_PORT_42_COUNTRY_WWp_OUTOFCOUNTRY_AND_GEO_HOLDOUT.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit original global WWp positive under country-deletion, 2degree geographic and out-of-country holdout"
          git fetch origin analysis/global-2015-WWp-positive-country-transfer-20261110
          git rebase origin/analysis/global-2015-WWp-positive-country-transfer-20261110
          git push origin HEAD:analysis/global-2015-WWp-positive-country-transfer-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-original-global-WWp2015-1055port-42country-positive-transport
          path: results/global_WWp2015_country_transfer_20261110/GLOBAL_1055_PORT_42_COUNTRY_WWp_OUTOFCOUNTRY_AND_GEO_HOLDOUT.json
          retention-days: 90
