name: gesui 2022 Austrian 67 real river stations WWTP reported P presence vs dose after ESA2021 land cover
on:
  push:
    branches:
      - analysis/gesui-20261116-AT67-same-riverbank-S2-landgreenness
    paths:
      - 'analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_WWTP_report_presence_vs_Pdose.py'
      - '.github/workflows/gesui-20261116-AT67-worldcover-WWTP-presence-vs-PQ.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_original_2022_same_at67_source_reporting_proxy_vs_load_amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
      GDAL_HTTP_MAX_RETRY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original BMLUK river source, ESA WorldCover2021 and ridge numerical libraries
        run: python -m pip install --quiet numpy scipy requests "rasterio>=1.4,<2" "pyproj>=3,<4"
      - name: Verify all 67 authentic same-2022 river sites, true WorldCover original pixel classes and original source annual WWTP P reporting presence versus load magnitude after actual 2022 stream TP
        run: |
          python -m py_compile analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_WWTP_report_presence_vs_Pdose.py
          python -u analysis/20261116_AT67_riparian_satellite/WorldCover_AT67_WWTP_report_presence_vs_Pdose.py \
            --output '${{ runner.temp }}/austria67_source_report_binary_vs_annualP_Q'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-original-Austria67-WorldCover-2022-WWTP-report-presence-vs-Pdose
          path: '${{ runner.temp }}/austria67_source_report_binary_vs_annualP_Q/'
          retention-days: 90
          if-no-files-found: warn
