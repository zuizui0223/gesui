name: EPA2023 source-frozen grain/hydro HUC matched independent NumPy audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_NRSA2023_novelHUC_grain_hydro_manual_numpy_20261122.py
      - .github/workflows/gesui-nrsa2023-grain-hydro-matched-numpy-qa-20261122.yml

permissions:
  contents: read
  actions: read

jobs:
  true-original-sources-three-cycle-ept-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixed reproducible matrix and original source parsers
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "scipy>=1.12,<2" "statsmodels>=0.14,<1"

      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-five-original-EPA-source-census
          run-id: 43562414140
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src0809
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa0809-original-BERWW-TAXA-ID-to-ORDER-source-QA
          run-id: 43563239544
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/taxa0809
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-EPT-fraction-source-fidelity
          run-id: 43563366026
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fidelity0809

      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1314-original-source-schema-BERW-measurements
          run-id: 43560769667
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src1314

      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src1819
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src18chla
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa1819-ept-chla-phab-source-native-UID
          run-id: 43528570410
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/src18triad

      - name: Reconstruct independent 2008–09 ORIGINAL EPA BERWW chemistry and taxon share panel
        env:
          ORIGINAL_2008_SOURCE: ${{ runner.temp }}/src0809/NRSA0809_EPA_ORIGINAL_SOURCE_ONLY_COUNT_AND_GRANULARITY.json
          ORIGINAL_TAXON_QA: ${{ runner.temp }}/taxa0809/NRSA0809_BERWW_TOTAL300_TAXA_ID_ORDER_ORIGINAL_CROSSWALK_SOURCE_QA.json
          ORIGINAL_EPT_FIDELITY: ${{ runner.temp }}/fidelity0809/NRSA0809_EPT_REAL_TOTAL300_SOURCE_PUBLISHED_FIDELITY_QA.json
        run: |
          python scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py > ${{ runner.temp }}/rebuild_2008_original_source_model.log

      - name: Reconstruct independent 2013–14 ORIGINAL EPA BERW chemistry pigment PHab panel
        env:
          NRSA1314_SEMANTIC_SOURCE_QA: ${{ runner.temp }}/src1314/NRSA1314_SIX_ORIGINAL_MEASUREMENT_SEMANTICS_SOURCE_ONLY.json
        run: |
          python scripts/gesui_NRSA1314_independent_cycle_numeric.py > ${{ runner.temp }}/rebuild_2013_original_source_model.log

      - name: Reconstruct independent 2018–19 ORIGINAL EPA BERW chemistry pigment PHab panel
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/src1819/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/src18chla/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
          FROZEN_TRIAD_SOURCE: ${{ runner.temp }}/src18triad/NRSA1819_ORIGINAL_EPT_CHLA_PHAB_SOURCE_ONLY_QA.json
        run: |
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/rebuild_2018_original_source_model.log
          python scripts/gesui_NRSA1819_EPT_CHLA_PHAB_true_triad_models.py > ${{ runner.temp }}/rebuild_2018_original_benthos_PHab.log

      - name: Source-first audit exact 2648 native UIDs, original HUC8 overlap and shared six environmental variables
        run: |
          python -m py_compile scripts/gesui_NRSA_3cycle_SOURCE_2648_EPT_PHab_NP_harmonize.py
          python -u scripts/gesui_NRSA_3cycle_SOURCE_2648_EPT_PHab_NP_harmonize.py

      - name: Leave-one-cycle-out with ZERO shared HUC8 train and target, HUC equal weighting and fixed 2000 HUC bootstrap
        run: |
          python -m py_compile scripts/gesui_NRSA_3cycle_EPT_NOHUC_external_transport_models.py
          python -u scripts/gesui_NRSA_3cycle_EPT_NOHUC_external_transport_models.py

      - name: Recover frozen independently audited ORIGINAL 2023–24 source-only cohort
        uses: actions/download-artifact@v4
        with:
          name: nrsa2023-fourthcycle-berw-source-only
          run-id: 45017363050
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_2023_source

      - name: Acquire original independent EPA 2023–24 SiteInfo WaterChem PHab Benthos and Periphyton
        run: |
          mkdir -p "${{ runner.temp }}/original_2023"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_siteinfo.csv" -o "${{ runner.temp }}/original_2023/sites.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_waterchemistry.csv" -o "${{ runner.temp }}/original_2023/water.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_physicalhabitat_metrics.csv" -o "${{ runner.temp }}/original_2023/habitat.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-09/nrsa2324_benthiccount.csv" -o "${{ runner.temp }}/original_2023/benthos.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_periphytonchlorophyll-a.csv" -o "${{ runner.temp }}/original_2023/chla.csv"
      - name: Re-audit source-only published 2023 cohort before EPT outcome transport
        run: |
          python -u scripts/gesui_nrsa2324_fourthcycle_source_only_20261122.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --benthos "${{ runner.temp }}/original_2023/benthos.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --out "${{ runner.temp }}/original_2023/source_only_current.json"

      - name: SOURCE-ONLY original HUC8 novelty ecological domain and match opportunity
        run: |
          python -m py_compile scripts/gesui_nrsa2023_HUC8_source_novelty_environment_20261122.py
          python -u scripts/gesui_nrsa2023_HUC8_source_novelty_environment_20261122.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --old_panel "${{ runner.temp }}/gesui_threecycle_ept_transfer/AUDIT_ONLY_NRSA_THREE_REAL_CYCLE_EPT_NP_PHAB.csv" \
            --out "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA_2023_NOVEL_HUC8_ENVIRONMENT_SOURCE_ONLY.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa2023-novel-huc8-ecological-domain-source-only
          path: ${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA_2023_NOVEL_HUC8_ENVIRONMENT_SOURCE_ONLY.json
          if-no-files-found: warn
          retention-days: 60

      - name: Freeze original 2023 source-only substrate and hydrology HUC matches before new outcome residuals
        run: |
          python -m py_compile scripts/gesui_nrsa2023_huc_novelty_extra_source_matching_20261122.py
          python -u scripts/gesui_nrsa2023_huc_novelty_extra_source_matching_20261122.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --old_panel "${{ runner.temp }}/gesui_threecycle_ept_transfer/AUDIT_ONLY_NRSA_THREE_REAL_CYCLE_EPT_NP_PHAB.csv" \
            --out "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_SUBSTRATE_HYDROLOGICAL_NOVEL_HUC8_SOURCE_MATCH.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2023-substrate-hydro-novelHUC8-source-matches
          path: ${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_SUBSTRATE_HYDROLOGICAL_NOVEL_HUC8_SOURCE_MATCH.json
          if-no-files-found: warn
          retention-days: 60

      - name: Recover separately signed substrate/hydrology matching source-only artifact
        uses: actions/download-artifact@v4
        with:
          name: nrsa2023-substrate-hydro-novelHUC8-source-matches
          run-id: 45021173233
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_extra_source_only
      - name: Refit original previous-3-era EPA EPT model only, no 2023 outcomes in training
        run: |
          python -u scripts/gesui_NRSA_fourthcycle_2023_EPT_heldout_transport.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --benthos "${{ runner.temp }}/original_2023/benthos.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --source-qa "${{ runner.temp }}/frozen_2023_source/nrsa2023_fourcycle_source_opportunity.json" \
            --old-panel "${{ runner.temp }}/gesui_threecycle_ept_transfer/AUDIT_ONLY_NRSA_THREE_REAL_CYCLE_EPT_NP_PHAB.csv" \
            --out "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA_FOURTH_2023_ACTUAL_EPT_EXTERNAL_3OLD_CYCLES_TRAIN.json"
      - name: Evaluate fixed old models only within separately frozen substrate/hydro source matches
        run: |
          python -m py_compile scripts/gesui_nrsa2023_novel_huc_extended_matched_EPT_20261122.py
          python -u scripts/gesui_nrsa2023_novel_huc_extended_matched_EPT_20261122.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --benthos "${{ runner.temp }}/original_2023/benthos.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --old_panel "${{ runner.temp }}/gesui_threecycle_ept_transfer/AUDIT_ONLY_NRSA_THREE_REAL_CYCLE_EPT_NP_PHAB.csv" \
            --source_qa "${{ runner.temp }}/frozen_2023_source/nrsa2023_fourcycle_source_opportunity.json" \
            --original_result "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA_FOURTH_2023_ACTUAL_EPT_EXTERNAL_3OLD_CYCLES_TRAIN.json" \
            --extension_source "${{ runner.temp }}/frozen_extra_source_only/NRSA2023_SUBSTRATE_HYDROLOGICAL_NOVEL_HUC8_SOURCE_MATCH.json" \
            --out "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_NOVEL_HUC_SUBSTRATE_HYDRO_EPT_MATCHED.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2023-novel-HUC-grain-hydrology-source-matched-EPT
          path: ${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_NOVEL_HUC_SUBSTRATE_HYDRO_EPT_MATCHED.json
          if-no-files-found: warn
          retention-days: 60
      - name: Recover separately signed original grain/hydro matched EPT numeric artifact
        uses: actions/download-artifact@v4
        with:
          name: nrsa2023-novel-HUC-grain-hydrology-source-matched-EPT
          run-id: 45021358057
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_original_2023_extra_match

      - name: Independent weighted NumPy normal equations and paired bootstrap on source-frozen HUC matches
        run: |
          python -m py_compile scripts/audit_NRSA2023_novelHUC_grain_hydro_manual_numpy_20261122.py
          python -u scripts/audit_NRSA2023_novelHUC_grain_hydro_manual_numpy_20261122.py \
            --sites "${{ runner.temp }}/original_2023/sites.csv" \
            --water "${{ runner.temp }}/original_2023/water.csv" \
            --habitat "${{ runner.temp }}/original_2023/habitat.csv" \
            --benthos "${{ runner.temp }}/original_2023/benthos.csv" \
            --chla "${{ runner.temp }}/original_2023/chla.csv" \
            --old_panel "${{ runner.temp }}/gesui_threecycle_ept_transfer/AUDIT_ONLY_NRSA_THREE_REAL_CYCLE_EPT_NP_PHAB.csv" \
            --source_qa "${{ runner.temp }}/frozen_2023_source/nrsa2023_fourcycle_source_opportunity.json" \
            --extension_source "${{ runner.temp }}/frozen_extra_source_only/NRSA2023_SUBSTRATE_HYDROLOGICAL_NOVEL_HUC8_SOURCE_MATCH.json" \
            --original_matched "${{ runner.temp }}/frozen_original_2023_extra_match/NRSA2023_NOVEL_HUC_SUBSTRATE_HYDRO_EPT_MATCHED.json" \
            --out "${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_GRAIN_HYDRO_MATCHED_INDEPENDENT_NUMPY_QA.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2023-novel-HUC-grain-hydro-independent-numpy-qa
          path: ${{ runner.temp }}/gesui_fourcycle_2023_transport/NRSA2023_GRAIN_HYDRO_MATCHED_INDEPENDENT_NUMPY_QA.json
          if-no-files-found: warn
          retention-days: 60
