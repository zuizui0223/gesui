name: gesui H7 reported EEA upstream NP source versus HNS EQR and plants
on:
  push:
    paths:
      - 'analysis/20261115_reported_np_hns/**'
      - 'results/20261115_reported_np_hns/**'
      - '.github/workflows/gesui-20261115-actual-reported-np-hns-qa.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  original-reported-source-and-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific packages for independent sklearn and H6-cluster audit
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2'
      - name: Retrieve source-frozen 2018 2022 EEA upstream reported-mass to site-flow original data
        uses: actions/download-artifact@v4
        with:
          run-id: 43222864099
          name: gesui-H7-454-reported-2018-2022-NP-to-site-flow-source-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/true_reported_source
      - name: Source-locked 454 H7 test suite
        env:
          GESUI_NP_SOURCE_INPUT: ${{ runner.temp }}/true_reported_source/EEA2018_EEA2022_454_H7_ORIGINAL_REPORTED_NP_SITE_FLOW_EQUIVALENT_SOURCE_ONLY.json
          GESUI_HNS_PANEL: results/20261115_sync/hns_macro/H7_454_HNS_panel.csv
          GESUI_MULTILAYER_CORE_PATH: analysis/20261115_multilayer/scripts/multilayer.py
        run: python -m unittest discover -s analysis/20261115_reported_np_hns/tests -v
      - name: Fit H6-disjoint reported N/P source and three independent ecology outcomes
        env:
          SOURCE_FILE: ${{ runner.temp }}/true_reported_source/EEA2018_EEA2022_454_H7_ORIGINAL_REPORTED_NP_SITE_FLOW_EQUIVALENT_SOURCE_ONLY.json
          OUT: ${{ runner.temp }}/NP_HNS_OOS
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python analysis/20261115_reported_np_hns/scripts/analyze_reported_np.py --panel results/20261115_sync/hns_macro/H7_454_HNS_panel.csv --source-zip "$SOURCE_FILE" --reference-core analysis/20261115_multilayer/scripts/multilayer.py --out "$OUT"
          python analysis/20261115_reported_np_hns/scripts/independent_sklearn_qa.py --panel results/20261115_sync/hns_macro/H7_454_HNS_panel.csv --source-zip "$SOURCE_FILE" --results "$OUT/RESULTS_EEA_REPORTED_NP_TO_HNS_EQR_PLANT.json" --out "$OUT/INDEPENDENT_SKLEARN_QA.json"
          python analysis/20261115_reported_np_hns/scripts/selection_sensitivity.py --panel results/20261115_sync/hns_macro/H7_454_HNS_panel.csv --source-zip "$SOURCE_FILE" --reference-core analysis/20261115_multilayer/scripts/multilayer.py --out "$OUT"
          python analysis/20261115_reported_np_hns/scripts/validate_results.py --results "$OUT"
          python analysis/20261115_reported_np_hns/scripts/compare_against_archive.py --reference results/20261115_reported_np_hns --new "$OUT"
      - name: Retain source-frozen fitted values and QA; never interpret zero-report as no sewage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-H7-454-year-reported-NP-HNS-EQR-Plant-20261115
          path: ${{ runner.temp }}/NP_HNS_OOS/
          if-no-files-found: warn
          retention-days: 90
