name: gesui independent 2018 historical measured WWTP N/P to 2018 BQE site source gate

on:
  push:
    branches:
      - "analysis/uwwtd2018-independent-bqe-validation-20261108"
    paths:
      - "scripts/gesui_2018_wwtp_bqe_graph_source.py"
      - ".github/workflows/gesui-2018-source-BQE-hydrograph-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-only-2018:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pandas numpy geopandas pyogrio pyarrow shapely requests
      - name: Restore both independently verified ORIGINAL 2018 source tables before any historical EQR
        run: |
          mkdir -p /tmp/gesui-2018-source /tmp/gesui-2018-source/ww /tmp/gesui-2018-source/bqe
          gh run download 42441852933 --repo zuizui0223/gesui \
            --name gesui-independent2018-WWTP-NP-measured-original-source-support \
            --dir /tmp/gesui-2018-source/ww
          gh run download 42441464939 --repo zuizui0223/gesui \
            --name gesui-2018-independent-BQE-source-only-site-frozen-cohort \
            --dir /tmp/gesui-2018-source/bqe
      - name: Fetch exactly original 2018 public EEA treatment source and source-pinned hydrological network
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 420 \
            https://sdi.eea.europa.eu/datashare/s/mGmXg3zcEqKQLTG/download \
            -o /tmp/gesui-2018-source/old_UWWTD2018.zip
          curl --fail --location --silent --show-error --retry 2 --max-time 300 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-2018-source/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-2018-source/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Source-only network of ACTUAL 2018 measured nitrogen and phosphorus, no numeric 2018 biological EQR opened
        run: |
          python -u scripts/gesui_2018_wwtp_bqe_graph_source.py \
            --historical-zip /tmp/gesui-2018-source/old_UWWTD2018.zip \
            --historical-qc /tmp/gesui-2018-source/ww/2018_NP_MEASURED_SOURCE_QC.json \
            --original-sites /tmp/gesui-2018-source/bqe/2018_FIXED_BQE_MONITORING_SITE_METADATA_NO_EQR.csv \
            --original-sites-qc /tmp/gesui-2018-source/bqe/2018_BQE_PREOUTCOME_SOURCE_QC.json \
            --river-parquet /tmp/gesui-2018-source/HydroRIVERS_v10_eu.geoparquet \
            --out /tmp/gesui-2018-source/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-independent2018-measured-NP-to-BQE-source-locked-river-network
          path: /tmp/gesui-2018-source/results/
          retention-days: 90
          if-no-files-found: warn
