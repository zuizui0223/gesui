name: gesui NRSA1819 original riparian vegetation same-UID source gate

on:
  push:
    paths:
      - "scripts/gesui_NRSA1819_riparian_physical_habitat_source_only_20261112.py"
      - ".github/workflows/gesui-riparian-1819-source-gate.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  native-uid-physical-habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get immutable pre-outcome official EPA river 1221 UID source manifest
        uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_epa_benthic_source
      - name: Source-only examine original physical habitat columns and same visit support
        env:
          NRSA_FROZEN_MANIFEST: ${{ runner.temp }}/original_epa_benthic_source/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
        run: |
          python -m py_compile scripts/gesui_NRSA1819_riparian_physical_habitat_source_only_20261112.py
          python scripts/gesui_NRSA1819_riparian_physical_habitat_source_only_20261112.py
      - name: Archive source SHA, same-UID manifest and support decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrsa1819-original-riparian-native-uid-source-gate
          path: |
            ${{ runner.temp }}/nrsa1819_riparian_source/NRSA1819_RIPARIAN_UID_SOURCE_ONLY_MANIFEST.json
            ${{ runner.temp }}/nrsa1819_riparian_source/NRSA1819_RIPARIAN_QA_SOURCE_GATE_REPORT.json
          if-no-files-found: warn
          retention-days: 30
