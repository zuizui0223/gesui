name: GESUI France ROSEAU SILLAGE sludge spreading official exporter SOURCE-only

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gesui-20261119-fr-sludge-source-form.yml
      - analysis/20261119_fr_sludge_routeC/**
      - tests/test_fr_sludge_spreading_source_form.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-discovery-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official public page metadata parsers
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Offline invariants for year-form and hidden auth-token redaction
        run: python -m unittest discover -s tests -p 'test_fr_sludge_spreading_source_form.py' -v
      - name: Get only official public forms and scripts, no biological outcomes or POSTs
        run: |
          python analysis/20261119_fr_sludge_routeC/fr_sillage_spreading_form_source_probe.py \
            --out results/20261119_fr_sludge_SOURCE_form_probe/
      - name: Publish original government form provenance, fields, year options and access STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-France-ROSEAU-SILLAGE-sludge-application-form-source-only
          path: results/20261119_fr_sludge_SOURCE_form_probe/
          if-no-files-found: warn
          retention-days: 60
