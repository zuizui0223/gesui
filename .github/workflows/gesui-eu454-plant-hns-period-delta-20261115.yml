name: gesui authentic EU H7 2017-19 to 2020-22 plant N and butterfly HNS temporal cochange falsification
on:
  push:
    branches:
      - analysis/gesui-eu454-full-plant-nutri-20261115
    paths:
      - 'analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py'
      - '.github/workflows/gesui-eu454-plant-hns-period-delta-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-original-H7-periods:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen original-source H6 array and regressions
        run: python -m pip install --quiet pandas numpy scipy statsmodels
      - uses: actions/download-artifact@v4
        with:
          run-id: 43718069015
          name: gesui-20261115-EU454-11511-EIV-source-v2-official-hybrid-qa-no-trait-change
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/real_source_v2
      - name: Compare same-H7 paired period changes, adjust GBIF survey shifts and hold out genuine H6
        run: |
          python -m py_compile analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py
          python -u analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py \
            --source '${{ runner.temp }}/real_source_v2' \
            --output '${{ runner.temp }}/paired_true_H7'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-EU454-H7-temporal-plantN-butterflyHNS-source-verified
          path: ${{ runner.temp }}/paired_true_H7/
          retention-days: 90
          if-no-files-found: warn
