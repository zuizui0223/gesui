name: gesui ChemPop v2 original same-sample family score and effluent data source-only census
on:
  push:
    paths:
      - 'analysis/20261119_europe_benthic_taxa/chempop_v2_source_census.py'
      - '.github/workflows/gesui-chempop-v2-source-census-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-eidc-original-source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only R published index reader
        run: python -m pip install --quiet 'pandas>=2,<3' 'pyreadr>=0.5,<1'
      - name: Rebuild original seven-region site/analysis/family support and official modelled effluent source quality
        run: |
          python -m py_compile analysis/20261119_europe_benthic_taxa/chempop_v2_source_census.py
          python -u analysis/20261119_europe_benthic_taxa/chempop_v2_source_census.py \
            --output "${{ runner.temp }}/chempop_v2_source/CHEMPOP_V2_SITE_FAMILY_EDF_SOURCE_CENSUS.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261119-ChemPop-v2-original-same-sample-family-source-census
          path: ${{ runner.temp }}/chempop_v2_source/CHEMPOP_V2_SITE_FAMILY_EDF_SOURCE_CENSUS.json
          if-no-files-found: error
          retention-days: 90
