name: gesui official HydroRIVERS-directed STW actual 2017-18 TP to same-year ChemPop source-only route
on:
  push:
    paths:
      - 'analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_HydroRIVERS_directed_route_gate.py'
      - '.github/workflows/gesui-EA-STW-HydroRIVERS-directed-source-gate-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-STW-samplepoint-to-sourcequalified-benthos-directed-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproducible spatial original source dependencies
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'shapely>=2.0,<3' 'pyproj>=3.6,<4' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Original native SA source-year matched TP and ChemPop site history, HydroRIVERS v1 official directed NEXT_DOWN with missing-small-stream and reverse-downstream controls
        run: |
          python -m py_compile analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_HydroRIVERS_directed_route_gate.py
          python -u analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_HydroRIVERS_directed_route_gate.py \
            --out "${{ runner.temp }}/gesui_hydro_route/EA_SA_ACTUAL_TP_2017_18_CHEMPOP_HYDRORIVERS_DIRECTION_SOURCE_ONLY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-official-HydroRIVERS-native-STW-TP-ChemPop-direction-source-only
          path: ${{ runner.temp }}/gesui_hydro_route/EA_SA_ACTUAL_TP_2017_18_CHEMPOP_HYDRORIVERS_DIRECTION_SOURCE_ONLY.json
          if-no-files-found: warn
          retention-days: 90
