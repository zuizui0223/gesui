name: gesui official EEA 2020 UWWTD source accessibility gate (NO EQR outcomes)

on:
  push:
    branches:
      - "analysis/uwwtd2020-source-only-feasibility-20261108"
    paths:
      - "scripts/gesui_probe_2020_official_uwwtd_sources.py"
      - ".github/workflows/gesui-2020-source-access-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  official-2020-source-access-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify syntax and probe only publicly indexed official EEA historical source landing pages
        run: |
          python -m py_compile scripts/gesui_probe_2020_official_uwwtd_sources.py
          python -u scripts/gesui_probe_2020_official_uwwtd_sources.py \
            --out results/eea2020_source_only_20261108/OFFICIAL_2020_UWWTD_PUBLIC_SOURCE_ACCESS_GATE.json
      - name: Archive outcome-blind source-access receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2020_source_only_20261108/OFFICIAL_2020_UWWTD_PUBLIC_SOURCE_ACCESS_GATE.json
          git diff --cached --quiet && exit 0
          git commit -m "Record original EEA 2020 UWWTD source access and strict outcome-blind feasibility"
          git fetch origin analysis/uwwtd2020-source-only-feasibility-20261108
          git rebase origin/analysis/uwwtd2020-source-only-feasibility-20261108
          git push origin HEAD:analysis/uwwtd2020-source-only-feasibility-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2020-official-EEA-public-source-gate-NO-EQR
          path: results/eea2020_source_only_20261108/OFFICIAL_2020_UWWTD_PUBLIC_SOURCE_ACCESS_GATE.json
          retention-days: 90
          if-no-files-found: warn
