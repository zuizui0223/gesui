name: gesui ChemPop original N-P censoring and one-site-only EDF prediction adversarial
on:
  push:
    paths:
      - 'analysis/20261120_chempop_bmwp/loq_sitelevel_falsifier.py'
      - '.github/workflows/gesui-chempop-WQ-LOQ-sitelevel-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-verified-exact-LOQ-and-sitelevel-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed source and regression dependencies
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Replay exact original matched EDF and three nutrient models, then LOQ alternate and single-site stress
        run: |
          python -m py_compile analysis/20261120_chempop_bmwp/loq_sitelevel_falsifier.py
          python -u analysis/20261120_chempop_bmwp/loq_sitelevel_falsifier.py \
            --out "${{ runner.temp }}/chempop_loq/20261120_EDF_NP_CENSOR_SITELEVEL_STRESS.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-ChemPop-EDF-NP-LOQ-sitelevel-adversarial
          path: ${{ runner.temp }}/chempop_loq/20261120_EDF_NP_CENSOR_SITELEVEL_STRESS.json
          if-no-files-found: warn
          retention-days: 90
