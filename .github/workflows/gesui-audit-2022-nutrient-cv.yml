name: gesui independent 2022 EEA versus measured river water chemistry CV replay

on:
  push:
    branches:
      - "analysis/eea-wwtp-nutrient-load-source-20261107"
    paths:
      - "scripts/audit_eea2022_receptor_cv.py"
      - ".github/workflows/gesui-audit-2022-nutrient-cv.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independently replayable statistical source dependencies
        run: python -m pip install --quiet numpy pandas scipy scikit-learn
      - name: Recover original source-only EEA load crosswalk and measured 2022 outcome files
        run: |
          mkdir -p /tmp/gesui-source /tmp/gesui-outcome
          gh run download 42374105184 --repo zuizui0223/gesui \
            --name gesui-EEA2022-measured-NP-direct-river-source-crosswalk \
            --dir /tmp/gesui-source
          gh run download 42375542151 --repo zuizui0223/gesui \
            --name gesui-real2022-EEAmeasured-WWTP-load-Peters-observed-river-chemistry \
            --dir /tmp/gesui-outcome
      - name: Independently replay all geographic blocks, TP and TN source outcomes
        run: |
          python -u scripts/audit_eea2022_receptor_cv.py \
            --source /tmp/gesui-source/original_Peters_station_EEA_measured_load_source_only.csv \
            --original /tmp/gesui-outcome \
            --out /tmp/gesui-audit/AUDIT_2022_SOURCE_REPLAY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2022-original-source-and-holdout-audit
          path: /tmp/gesui-audit/
          if-no-files-found: warn
          retention-days: 30
