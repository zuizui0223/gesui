name: gesui ChemPop v2 genuine nutrient N-P matched source-only gate
on:
  push:
    paths:
      - 'analysis/20261120_chempop_bmwp/nutrient_source_gate.py'
      - '.github/workflows/gesui-chempop-nutrient-source-gate-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-EIDC-NP-site-date-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original fixed scoring and source-only parsers
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Audit source P/N analyte files and exact biological source-date matching before any outcome
        run: |
          python -m py_compile analysis/20261120_chempop_bmwp/nutrient_source_gate.py
          python -u analysis/20261120_chempop_bmwp/nutrient_source_gate.py \
            --out "${{ runner.temp }}/chem_np_source/20261120_CHEMPOP_NUTRIENT_SITE_DATE_SOURCE_ONLY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-ChemPop-actual-NP-original-sampledate-source-only
          path: ${{ runner.temp }}/chem_np_source/20261120_CHEMPOP_NUTRIENT_SITE_DATE_SOURCE_ONLY.json
          if-no-files-found: warn
          retention-days: 90
