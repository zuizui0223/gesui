name: gesui 2023 original WISE6 TP at fixed 2022 Germany 8 WWTP/control quartets SOURCE-DATES ONLY
on:
  push:
    branches:
      - "analysis/wise6-2023-DE-original-quartets-time-support-20261109"
    paths:
      - "scripts/gesui_2023_DE_original_2022quartets_sample_dates_only.py"
      - ".github/workflows/gesui-2023-DE-original2022-quartets-Tp-datesonly.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original2023-waterTP-32site-sampling-calendar-before-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify exact original 2022 eight WWTP/registered-zero quartets were fixed before 2023 TP calendar check
        run: |
          test "$(git hash-object results/wise6_2022_DE_quartets_exacttime/2022_DE_8WWTP_QUARTETS_EXACT_SAMEDAY_MONTH_SAMPLE_SOURCE_ONLY_GATE.json)" = "c09582bee2c09ad038bd9fd16926d837644da075"
      - name: Stream original EEA2026 2GB ZIP 36GB CSV, date-only 2023 Germany river TP sample metadata at original 32 monitoring sites, no numeric concentrations
        run: |
          python -m py_compile scripts/gesui_2023_DE_original_2022quartets_sample_dates_only.py
          python -u scripts/gesui_2023_DE_original_2022quartets_sample_dates_only.py \
            --original-2022-eightquartet-source results/wise6_2022_DE_quartets_exacttime/2022_DE_8WWTP_QUARTETS_EXACT_SAMEDAY_MONTH_SAMPLE_SOURCE_ONLY_GATE.json \
            --tmpdir /tmp/gesui-DE2023-WISE6-2GB-original-date-source \
            --out results/wise6_2023_DE_original_quartet_temporal/2023_ORIGINAL8_QUARTETS_32SITE_SAMEDAY_SAMEMONTH_DATE_ONLY_GATE.json
      - name: Archive 2023 source-only complete site-date missingness and locked gates BEFORE reading future chemical values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/wise6_2023_DE_original_quartet_temporal/2023_ORIGINAL8_QUARTETS_32SITE_SAMEDAY_SAMEMONTH_DATE_ONLY_GATE.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze 2023 WISE6 TP site dates and four-arm temporal data support at original 2022 German eight WWTP quartets before numeric concentrations"
          git fetch origin analysis/wise6-2023-DE-original-quartets-time-support-20261109
          git rebase origin/analysis/wise6-2023-DE-original-quartets-time-support-20261109
          git push origin HEAD:analysis/wise6-2023-DE-original-quartets-time-support-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2023-original-DE-WISE6-8WWTP-quartets-32site-dates-only-source
          path: results/wise6_2023_DE_original_quartet_temporal/2023_ORIGINAL8_QUARTETS_32SITE_SAMEDAY_SAMEMONTH_DATE_ONLY_GATE.json
          retention-days: 90
          if-no-files-found: warn
