name: gesui 2020 EEA biological monitoring source-only site-and-method freeze (NO EQR)

on:
  push:
    branches:
      - "analysis/uwwtd2020-source-only-feasibility-20261108"
    paths:
      - "scripts/gesui_2020_bqe_source_only_sites.py"
      - ".github/workflows/gesui-2020-bqe-site-source-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-2020-no-numeric-EQR:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pandas numpy
      - name: Download verified official EEA Biology 2026 original only for 2020 site metadata (no numeric EQRs)
        run: |
          mkdir -p /tmp/gesui-2020-biological-source
          curl --fail --location --silent --show-error --retry 2 --max-time 360 \
            https://sdi.eea.europa.eu/datashare/s/HCxTFz3Ac8xbHX6/download \
            -o /tmp/gesui-2020-biological-source/EEA_Waterbase_Biology2026.zip
      - name: Freeze exact original 2020 BQE monitoring sites/assessment methods/folds without opening numeric EQR
        run: |
          python -u scripts/gesui_2020_bqe_source_only_sites.py \
            --archive /tmp/gesui-2020-biological-source/EEA_Waterbase_Biology2026.zip \
            --out results/eea2020_source_only_20261108/BQE_2020_FROZEN_SITES
      - name: Commit source-only original 2020 monitor cohort before any outcome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2020_source_only_20261108/BQE_2020_FROZEN_SITES/
          git diff --cached --quiet && exit 0
          git commit -m "Freeze original 2020 Biology/EQR monitoring site IDs and method groups with no scores viewed"
          git fetch origin analysis/uwwtd2020-source-only-feasibility-20261108
          git rebase origin/analysis/uwwtd2020-source-only-feasibility-20261108
          git push origin HEAD:analysis/uwwtd2020-source-only-feasibility-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2020-EQR-original-site-method-freeze-no-biology-scores
          path: results/eea2020_source_only_20261108/BQE_2020_FROZEN_SITES/
          retention-days: 90
          if-no-files-found: warn
