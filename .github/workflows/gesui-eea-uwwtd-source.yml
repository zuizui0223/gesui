name: gesui EEA official UWWTD2022 measured N P discharge source coverage
on:
  push:
    branches:
      - "analysis/eea-wwtp-nutrient-load-source-20261107"
    paths:
      - "scripts/probe_eea_uwwtd_measured_load.py"
      - ".github/workflows/gesui-eea-uwwtd-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet requests
      - name: Read official EU public UWWTP measured N P loads, treatment fields and counts (no bulk data)
        run: python -u scripts/probe_eea_uwwtd_measured_load.py --out /tmp/gesui_eea_uwwtd2022/public_source_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA-UWWTD2022-official-PN-measured-load-source-metadata
          path: /tmp/gesui_eea_uwwtd2022/
          if-no-files-found: warn
          retention-days: 30
