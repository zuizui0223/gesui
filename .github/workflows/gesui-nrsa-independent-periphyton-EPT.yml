name: gesui independent two-era periphyton EPT sklearn audit

on:
  push:
    paths:
      - "scripts/audit_NRSA_biomass_EPT_two_era_independent_sklearn.py"
      - ".github/workflows/gesui-nrsa-independent-periphyton-EPT.yml"
  pull_request:
    paths:
      - "scripts/audit_NRSA_biomass_EPT_two_era_independent_sklearn.py"
      - ".github/workflows/gesui-nrsa-independent-periphyton-EPT.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  independent-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent estimator packages
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "statsmodels>=0.14,<1"
      - uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_benthos
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa-two-era-source-only-uid-crosswalk
          run-id: 43417864266
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen_biomass
      - name: Rebuild original source-locked panels and primary results
        env:
          SOURCE_FROZEN_18_MANIFEST: ${{ runner.temp }}/frozen_benthos/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          SOURCE_FROZEN_BIOMASS_CROSSWALK: ${{ runner.temp }}/frozen_biomass/SOURCE_ONLY_NRSA_2ERA_UID_CONCORDANCE.json
        run: |
          python scripts/gesui_nrsa_nutrient_periphyton_EPT_two_era_numeric.py > ${{ runner.temp }}/main_result_readout.txt
      - name: Refit exact same frozen site cohorts using independent sklearn and statsmodels
        run: |
          python -m py_compile scripts/audit_NRSA_biomass_EPT_two_era_independent_sklearn.py
          python scripts/audit_NRSA_biomass_EPT_two_era_independent_sklearn.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-nrsa-biomass-ept-independent-sk-statsmodels-QA
          path: ${{ runner.temp }}/gesui_biomass_numeric/NRSA_2ERA_PERIPHYTON_EPT_INDEPENDENT_NUMERIC_QA.json
          if-no-files-found: warn
          retention-days: 30
