name: GESUI French ROSEAU 2018 original sewage sludge spreading CSV SOURCE-only

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gesui-20261119-fr-sludge-2018-csv.yml
      - analysis/20261119_fr_sludge_routeC/fr_roSEAU_original_sludge_csv_source_audit.py
      - tests/test_fr_roSEAU_original_sludge_csv_source.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-2018-source-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only public export client
        run: python -m pip install --disable-pip-version-check requests
      - name: Test no-data rejection, exact original columns and year guardrails
        run: python -m unittest discover -s tests -p 'test_fr_roSEAU_original_sludge_csv_source.py' -v
      - name: Official 2018 public CSV via identical government JavaScript handler and submitted form
        run: |
          python analysis/20261119_fr_sludge_routeC/fr_roSEAU_original_sludge_csv_source_audit.py \
            --years 2018 --out results/20261119_fr_sludge_2018_original_source/
      - name: Archive only source metadata, all original CSV column names and hashes, not individual rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-France-ROSEAU-2018-sludge-spreading-original-public-CSV-source-audit
          path: results/20261119_fr_sludge_2018_original_source/
          if-no-files-found: warn
          retention-days: 60
