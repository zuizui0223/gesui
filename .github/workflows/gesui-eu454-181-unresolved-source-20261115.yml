name: gesui original GBIF 181 incomplete EU H7 plant speciesKey source-field QA
on:
  push:
    branches:
      - analysis/gesui-eu454-full-plant-nutri-20261115
    paths:
      - 'analysis/20261115_eu454_plant_nutri/diagnose_unresolved.py'
      - '.github/workflows/gesui-eu454-181-unresolved-source-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gbif-181-field-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source metadata inspection client
        run: python -m pip install --quiet requests
      - name: Retrieve all 8 SHA-gated original GBIF speciesKey source archives
        uses: actions/download-artifact@v4
        with:
          run-id: 43717141966
          pattern: gesui-20261115-11511-original-EIV-GBIF-taxonomy-shard-*
          merge-multiple: true
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/full_8_shards
      - name: Recheck only genuinely incomplete original speciesKey API responses
        run: |
          python -m py_compile analysis/20261115_eu454_plant_nutri/diagnose_unresolved.py
          python -u analysis/20261115_eu454_plant_nutri/diagnose_unresolved.py \
            --shards '${{ runner.temp }}/full_8_shards' \
            --output '${{ runner.temp }}/recheck'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-EU454-181-source-schema-recheck
          path: ${{ runner.temp }}/recheck/
          retention-days: 90
          if-no-files-found: warn
