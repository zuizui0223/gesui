name: gesui EPA NRSA 2018-19 same-river riparian × EPT × TNTP bridge

on:
  push:
    paths:
      - "scripts/gesui_NRSA1819_EPT_TNTP_riparian_same_UID_models_20261112.py"
      - "scripts/audit_NRSA1819_XGVEG_range_and_interaction_20261112.py"
      - ".github/workflows/gesui-riparian-ept-bridge-20261112.yml"
      - "docs/NRSA1819_RIPARIAN_EPT_NP_SAME_SITE_ANALYSIS_FREEZE_20261112.md"
  pull_request:
    paths:
      - "scripts/gesui_NRSA1819_EPT_TNTP_riparian_same_UID_models_20261112.py"
      - ".github/workflows/gesui-riparian-ept-bridge-20261112.yml"
      - "docs/NRSA1819_RIPARIAN_EPT_NP_SAME_SITE_ANALYSIS_FREEZE_20261112.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  same-river-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric dependencies
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Get frozen EPA river benthic/nutrient UID source (pre-numeric EPT)
        uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_frozen_epa
      - name: Get independently frozen EPA PHab native UID source (before riparian numeric)
        uses: actions/download-artifact@v4
        with:
          name: nrsa1819-original-riparian-native-uid-source-gate
          run-id: 43048691795
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_frozen_riparian
      - name: Check source-locked code syntax
        run: python -m py_compile scripts/gesui_NRSA1819_EPT_TNTP_riparian_same_UID_models_20261112.py
      - name: Verify exact source SHA and run nested HUC8-disjoint EPT/N/P/PHab comparison
        env:
          NRSA_FROZEN_MANIFEST: ${{ runner.temp }}/original_frozen_epa/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          NRSA_RIPARIAN_MANIFEST: ${{ runner.temp }}/original_frozen_riparian/NRSA1819_RIPARIAN_UID_SOURCE_ONLY_MANIFEST.json
        run: python scripts/gesui_NRSA1819_EPT_TNTP_riparian_same_UID_models_20261112.py
      - name: Independent source-value range and interaction sensitivity audit
        env:
          NRSA_FROZEN_MANIFEST: ${{ runner.temp }}/original_frozen_epa/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
          NRSA_RIPARIAN_MANIFEST: ${{ runner.temp }}/original_frozen_riparian/NRSA1819_RIPARIAN_UID_SOURCE_ONLY_MANIFEST.json
        run: |
          python -m py_compile scripts/audit_NRSA1819_XGVEG_range_and_interaction_20261112.py
          python scripts/audit_NRSA1819_XGVEG_range_and_interaction_20261112.py
      - name: Preserve aggregate original-source reproducible result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrsa1819-ept-riparian-tntp-samesite-huc8-model
          path: |
            ${{ runner.temp }}/gesui_nrsa_riparian_ept/NRSA1819_EPT_TNTP_RIPARIAN_SAME_UID_HUC8_OUTCOME_REPORT_20261112.json
            ${{ runner.temp }}/gesui_nrsa_riparian_ept/NRSA1819_RIPARIAN_XGVEG_RANGE_INDEPENDENT_SENSITIVITY_20261112.json
          if-no-files-found: warn
          retention-days: 30
