name: gesui 20261115 four original analysis unit suites
on:
  push:
    paths:
      - 'analysis/20261114_host_network/**'
      - 'analysis/20261114_network_robustness/**'
      - 'analysis/20261115_host_scores/**'
      - 'analysis/20261115_hns/**'
      - '.github/workflows/gesui-20261115-four-suites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-unit-suite-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        analysis:
          - 20261114_host_network
          - 20261114_network_robustness
          - 20261115_host_scores
          - 20261115_hns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --quiet numpy scipy pandas scikit-learn statsmodels shapely pyproj
      - name: Run original code tests in each isolated project folder
        working-directory: analysis/${{ matrix.analysis }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
