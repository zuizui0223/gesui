name: Actual FR381 same EEA sites original IO LULC 2018 2022 UTM footprint source
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_fr381_IO_LULC2018_2022_real_site_UTM_source_20261124.py
      - .github/workflows/gesui-fr381-io-lulc-2018-22-site-utm-source-20261124.yml
permissions:
  contents: read
  actions: read
jobs:
  native_FR381_site_geometry_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original RZ2018 EEA station source identity parser only
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<2" "pyproj>=3.5,<4"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-20261117-RZ2018-2018Benthic-2639-source-only-physical-class-areas
          run-id: 44004357868
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_RZ2018
      - name: Recover exact original 2022 benthic site registry by pinned Git blob with NO EQR numerical opening
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/analysis/eea2026-waterbase-biology-bqe-20261108"
          git show FETCH_HEAD:results/eea2022_biology_bqe_20261108/BENTHIC_INVERTEBRATES_2022_SOURCE_EQR.csv > "${{ runner.temp }}/source_EEA2022.csv"
          test "$(git hash-object "${{ runner.temp }}/source_EEA2022.csv")" = "325f199e985d9862ffee5b0edb205c61a7be3833"
      - name: Reconstruct original 381 France method-stable sites and map only 2018 2022 actual MGRS original STAC tile IDs
        run: |
          python -m py_compile scripts/gesui_fr381_IO_LULC2018_2022_real_site_UTM_source_20261124.py
          python -u scripts/gesui_fr381_IO_LULC2018_2022_real_site_UTM_source_20261124.py \
            --rz "${{ runner.temp }}/source_RZ2018/EEA2018_2018_RIPARIAN_ZONES_REST_OFFICIAL_SOURCE_ONLY_QA.json" \
            --eq18 results/eea2018_independent_temporal_bqe_20261108/benthic_invertebrates_2018_WWTP_source_real_EQR.csv \
            --eq22 "${{ runner.temp }}/source_EEA2022.csv" \
            --out "${{ runner.temp }}/FR381_IO_LULC_2018_2022_NATIVE_TILE_SITE_SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-France381-real-IO-LULC2018-2022-UTM-site-SOURCE
          path: ${{ runner.temp }}/FR381_IO_LULC_2018_2022_NATIVE_TILE_SITE_SOURCE.json
          if-no-files-found: warn
          retention-days: 60
