name: gesui original ESA WorldCover 2021 categorical COG source feasibility pilot (NO butterflies)
on:
  push:
    branches:
      - "analysis/lycaenidae-worldcover2021-urban-crop-20261108"
    paths:
      - "scripts/gesui_2021_esawc_original_cog_country_masked_source.py"
      - ".github/workflows/gesui-esawc2021-sourceonly-cog-3cell-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2021-COG-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install rasterio original GeoTIFF source reader
        run: python -m pip install --quiet rasterio numpy
      - name: Probe 3 initial original source tiles and Natural Earth country clipping only (do not use WMS RGB)
        run: |
          python -m py_compile scripts/gesui_2021_esawc_original_cog_country_masked_source.py
          python -u scripts/gesui_2021_esawc_original_cog_country_masked_source.py \
            --source-manifest results/lycaenidae_de_at_2022_source_only/EEA2022_DE_AT_PUBLIC_BOTH_NP_MEASURED_ONE_FW_OUTFALLS.csv \
            --source-tile-csv results/lycaenidae_de_at_2022_source_only/EEA2022_DE_AT_ORIGINAL_FW_OUTFALLS_IN_ONE_DEGREE_SOURCE_TILES.csv \
            --source-tile-qc results/lycaenidae_de_at_2022_source_only/EEA2022_DE_AT_ORIGINAL_WWTP_SOURCE_1DEG_TILE_QC.json \
            --out /tmp/gesui-esawc2021-3cell-source-pilot.json \
            --max-cells 3
          python - <<'PY'
          import json
          j=json.load(open('/tmp/gesui-esawc2021-3cell-source-pilot.json'))
          assert j['source_only_processed_cells']==3
          assert j['NO_2022_BUTTERFLY_PHOTO_RESULTS_OPENED'] is True
          assert j['source_land_quality_pass_count']>=1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2021-ESA-WorldCover-original-categorical-3cell-source-pilot-no-butterflies
          path: /tmp/gesui-esawc2021-3cell-source-pilot.json
          if-no-files-found: warn
          retention-days: 90
