name: Butterfly ant occurrence source pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'analysis/20261125_butterfly_ant_resources/ant_occurrence_pilot.py'
      - '.github/workflows/gesui-ant-occurrence-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'analysis/gesui-butterfly-adult-ant-resources-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'requests==2.32.5'
      - name: Audit exact native ant genus and occurrence source
        run: |
          mkdir -p "$RUNNER_TEMP/ant_pilot"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14113695873/zip > "$RUNNER_TEMP/historical.zip"
          python -u analysis/20261125_butterfly_ant_resources/ant_occurrence_pilot.py --historical "$RUNNER_TEMP/historical.zip" --out "$RUNNER_TEMP/ant_pilot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-ant-occurrence-pilot
          path: ${{ runner.temp }}/ant_pilot
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve source STOP
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"ant_pilot"/"results.json").read_text())
          assert r["status"]=="PILOT_GATE_PASS",r["status"]
          PY
