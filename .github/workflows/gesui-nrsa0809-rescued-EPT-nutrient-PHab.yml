name: gesui genuine EPA2008 reconstructed EPT counts original nutrients PHab
on:
  push:
    paths:
      - scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py
      - .github/workflows/gesui-nrsa0809-rescued-EPT-nutrient-PHab.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  original-EPA-real-third-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3" "statsmodels>=0.14,<1" "scipy>=1.12,<2" "scikit-learn>=1.5,<2"
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-five-original-EPA-source-census
          run-id: 43562414140
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/first_source
      - uses: actions/download-artifact@v4
        with:
          name: gesui-nrsa0809-original-BERWW-TAXA-ID-to-ORDER-source-QA
          run-id: 43563239544
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/taxon_source
      - uses: actions/download-artifact@v4
        with:
          name: gesui-NRSA0809-original-EPT-fraction-source-fidelity
          run-id: 43563366026
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fidelity
      - name: Original independently published EPT fraction vs fresh original TAXA_ID count full source
        env:
          ORIGINAL_2008_SOURCE: ${{ runner.temp }}/first_source/NRSA0809_EPA_ORIGINAL_SOURCE_ONLY_COUNT_AND_GRANULARITY.json
          ORIGINAL_TAXON_QA: ${{ runner.temp }}/taxon_source/NRSA0809_BERWW_TOTAL300_TAXA_ID_ORDER_ORIGINAL_CROSSWALK_SOURCE_QA.json
          ORIGINAL_EPT_FIDELITY: ${{ runner.temp }}/fidelity/NRSA0809_EPT_REAL_TOTAL300_SOURCE_PUBLISHED_FIDELITY_QA.json
        run: |
          python -m py_compile scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py
          python -u scripts/gesui_NRSA0809_rescued_EPT_NP_PHAB_numeric.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-NRSA0809-original-EPT-rawcount-ambientTNTP-PHab-three-responses
          path: ${{ runner.temp }}/gesui0809_reconstructed_EPT/NRSA0809_RECONSTRUCTED_EPT_REAL_AMBIENT_NP_PHab_NUMERIC_RESULTS.json
          if-no-files-found: warn
          retention-days: 60
