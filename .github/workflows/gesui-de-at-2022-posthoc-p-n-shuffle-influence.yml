name: gesui 2022 Lycaenidae posthoc P and N WWTP source spatial-shuffle and outlier tests
on:
  push:
    branches:
      - "analysis/lycaenidae-de-at-2022-landscape-source-photo-20261108"
    paths:
      - ".github/workflows/gesui-de-at-2022-posthoc-p-n-shuffle-influence.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  P-N-source-null-and-leverage-no-photo-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet numpy
      - name: Refit locked 2022 P N source mass models with country and block-shuffled placebo sources and source-only maximum deletion
        run: |
          python -m py_compile scripts/gesui_de_at_2022_posthoc_P_N_source_shuffle_influence.py
          python -u scripts/gesui_de_at_2022_posthoc_P_N_source_shuffle_influence.py \
            --source-result results/lycaenidae_de_at_2022_macro_source_photo/2022_DE_AT_LYCAENIDAE_PHOTO_SHARE_VS_WWTP_SOURCE_EXPLORATORY.json \
            --plant-gate results/lycaenidae_de_at_2022_macro_source_photo/2021_PLANT_ONLY_SOURCE_AND_EFFORT_GATE.json \
            --first-block-cv results/lycaenidae_de_at_2022_macro_source_photo/2022_POSTHOC_2DEG_BLOCK_OUTOFREGION_WWTP_SOURCE_PREDICTION.json \
            --out results/lycaenidae_de_at_2022_macro_source_photo/2022_POSTHOC_P_N_MASS_SHUFFLED_SOURCE_AND_MAXIMUM_REMOVAL.json
      - name: Archive both favorable and unfavorable tests without adding any 2022 observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_de_at_2022_macro_source_photo/2022_POSTHOC_P_N_MASS_SHUFFLED_SOURCE_AND_MAXIMUM_REMOVAL.json
          git diff --cached --quiet && exit 0
          git commit -m "Record P/N reported WWTP source posthoc shuffled controls and original-source outlier influence"
          git fetch origin analysis/lycaenidae-de-at-2022-landscape-source-photo-20261108
          git rebase origin/analysis/lycaenidae-de-at-2022-landscape-source-photo-20261108
          git push origin HEAD:analysis/lycaenidae-de-at-2022-landscape-source-photo-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2022-Lycaenidae-P-N-WWTP-source-mass-posthoc-shuffles
          path: results/lycaenidae_de_at_2022_macro_source_photo/2022_POSTHOC_P_N_MASS_SHUFFLED_SOURCE_AND_MAXIMUM_REMOVAL.json
          retention-days: 90
          if-no-files-found: warn
