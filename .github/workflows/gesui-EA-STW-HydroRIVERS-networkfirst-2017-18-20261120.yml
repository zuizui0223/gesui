name: gesui EA all national SA network first original 2017-18 TP samplepoint vs ChemPop
on:
  push:
    paths:
      - 'analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_networkfirst_allSA_history.py'
      - 'analysis/20261120_wessex_wwtp/ea_WQE_national_SA_actual2017_18_TP_chemistry_bio_screen.py'
      - '.github/workflows/gesui-EA-STW-HydroRIVERS-networkfirst-2017-18-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-allSA-network-first-source-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official original WQE, ChemPop and HydroRIVERS graph dependencies
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'shapely>=2.0,<3' 'pyproj>=3.6,<4' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Verify all current SA registered sources on official directed network then historical 2017-18 numeric total P measurements to original BIO year without 2km prefilter
        run: |
          python -m py_compile analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_networkfirst_allSA_history.py
          python -u analysis/20261120_wessex_wwtp/ea_SA_TP_ChemPop_networkfirst_allSA_history.py \
            --out "${{ runner.temp }}/gesui_allSA_source/ALL_SA_NETWORK_FIRST_2017_18_TP_BIO_SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-allSA-network-first-2017-18-genuine-TP-source
          path: ${{ runner.temp }}/gesui_allSA_source/ALL_SA_NETWORK_FIRST_2017_18_TP_BIO_SOURCE.json
          if-no-files-found: warn
          retention-days: 90
