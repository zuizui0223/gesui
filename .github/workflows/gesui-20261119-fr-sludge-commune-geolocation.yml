name: GESUI France 2018 sludge official commune text and GeoJSON location audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gesui-20261119-fr-sludge-commune-geolocation.yml
      - analysis/20261119_fr_sludge_routeC/fr_roSEAU_2018_commune_geojson_source_audit.py
      - tests/test_fr_roSEAU_2018_commune_geojson.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-geojson:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public source client
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify source-only GeoJSON does not prove field application
        run: python -m unittest discover -s tests -p 'test_fr_roSEAU_2018_commune_geojson.py' -v
      - name: Check exact archived 2018 CSV hash, public commune text and original GeoJSON geometry
        run: |
          python analysis/20261119_fr_sludge_routeC/fr_roSEAU_2018_commune_geojson_source_audit.py \
            --out results/20261119_fr_sludge_commune_geojson_2018/
      - name: Archive sanitized public kommune format and geometry type only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesui-France2018-sludge-commune-text-GEOJSON-location-provenance
          path: results/20261119_fr_sludge_commune_geojson_2018/
          if-no-files-found: warn
          retention-days: 60
