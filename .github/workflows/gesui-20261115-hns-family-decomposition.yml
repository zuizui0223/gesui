name: GESUI original H7 family decomposition (posthoc association)
on:
  push:
    branches:
      - analysis/gesui-hns-family-decomposition-20261115
    paths:
      - analysis/20261115_hns_family_decomposition/**
      - .github/workflows/gesui-20261115-hns-family-decomposition.yml
  pull_request:
    branches:
      - analysis/gesui-updown-conditional-placebo-20261115
  workflow_dispatch:

jobs:
  source-locked-decomposition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'statsmodels>=0.14,<0.16'
      - name: Refit 10 observational source-locked regressions and check original PR88
        run: |
          python analysis/20261115_hns_family_decomposition/analyse.py \
            --panel results/20261115_sync/hns_macro/H7_454_HNS_panel.csv \
            --outdir results/20261115_hns_family_decomposition
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-h7-hns-family-decomposition
          path: |
            results/20261115_hns_family_decomposition/SOURCE_LOCKED_HNS_FAMILY_DECOMPOSITION.json
            results/20261115_hns_family_decomposition/SOURCE_LOCKED_HNS_FAMILY_DECOMPOSITION.csv
          if-no-files-found: error
