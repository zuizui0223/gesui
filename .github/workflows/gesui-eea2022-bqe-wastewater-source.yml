name: gesui 2022 freshwater macroinvertebrate phytobenthos fish BQE × actual WWTP source gate

on:
  push:
    branches:
      - "analysis/eea2026-waterbase-biology-bqe-20261108"
    paths:
      - "scripts/gesui_eea2022_bqe_source_river_join.py"
      - ".github/workflows/gesui-eea2022-bqe-wastewater-source.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  biology-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only GIS and biological monitoring metadata readers
        run: python -m pip install --quiet pandas numpy geopandas pyogrio shapely pyarrow requests
      - name: Retrieve official EEA2026 Biology ZIP and exact derived HydroRIVERS source
        run: |
          mkdir -p /tmp/gesui-bqe-crosswalk
          curl --fail --location --silent --show-error --retry 2 --max-time 360 \
            https://sdi.eea.europa.eu/datashare/s/HCxTFz3Ac8xbHX6/download \
            -o /tmp/gesui-bqe-crosswalk/Waterbase_Biology2026_official.zip
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-bqe-crosswalk/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-bqe-crosswalk/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Join EEA 2022 reported N/P source masses to official Biology site ID and directed river reach without reading EQR scores
        run: |
          python -u scripts/gesui_eea2022_bqe_source_river_join.py \
            --biology-zip /tmp/gesui-bqe-crosswalk/Waterbase_Biology2026_official.zip \
            --river-parquet /tmp/gesui-bqe-crosswalk/HydroRIVERS_v10_eu.geoparquet \
            --out /tmp/gesui-bqe-crosswalk/output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2022-measured-NP-to-Biology2026-BQE-source-only
          path: /tmp/gesui-bqe-crosswalk/output/
          if-no-files-found: warn
          retention-days: 30
