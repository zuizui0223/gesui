name: gesui EEA actual measured N P WWTP load × river receiving source-only gate

on:
  push:
    branches:
      - "analysis/eea-wwtp-nutrient-load-source-20261107"
    paths:
      - "scripts/gesui_eea_nutrient_load_river_crosswalk.py"
      - ".github/workflows/gesui-eea-load-river-crosswalk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official source and vector geometry dependencies
        run: python -m pip install --quiet pandas numpy requests geopandas shapely pyarrow
      - name: Retrieve source-locked Europe HydroRIVERS mirror
        run: |
          mkdir -p /tmp/gesui-eea-source /tmp/gesui-eea-prior
          curl --fail --location --silent --show-error --retry 2 --max-time 300 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-eea-source/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-eea-source/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Restore original source-only 1418 TP and 294 TN monitoring station list
        run: |
          gh run download 42371629424 --repo zuizui0223/gesui \
            --name gesui-EU-TP-TN-observed-station-source-only-upstream-wwtp \
            --dir /tmp/gesui-eea-prior
          echo "47fb5bb92726602170a98473d02d2c810f98e49a51ef867d017190a85ae2f10b  /tmp/gesui-eea-prior/nutrient_monitor_station_source_features.csv" | sha256sum -c -
      - name: Query official 2022 measured N/P load and discharge outlets; attach to directed rivers without chemistry outcome
        run: |
          python -u scripts/gesui_eea_nutrient_load_river_crosswalk.py \
            --river-parquet /tmp/gesui-eea-source/HydroRIVERS_v10_eu.geoparquet \
            --original-monitor-source /tmp/gesui-eea-prior/nutrient_monitor_station_source_features.csv \
            --out /tmp/gesui-eea-source/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2022-measured-NP-direct-river-source-crosswalk
          path: /tmp/gesui-eea-source/results/
          if-no-files-found: warn
          retention-days: 30
