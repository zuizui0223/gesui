name: gesui 20261116 reported WWTP NP within-true-H6 source-only gate
on:
  push:
    branches:
      - analysis/gesui-reported-np-40h6-source-gate-20261116
    paths:
      - 'analysis/20261116_reported_np_source/**'
      - '.github/workflows/gesui-20261116-reported-NP-183H7-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-reported-np-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-table reader only, no model fit
        run: python -m pip install --quiet pandas
      - name: Retrieve 183 native H7 and 40 H6 original terrestrial-source cohort
        uses: actions/download-artifact@v4
        with:
          run-id: 43726596337
          name: gesui-20261115-genuine-183H7-40H6-terrestrial-EIV-HNS-source-replayed
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/genuine_183_source
      - name: Verify 454 original EEA reported N/P and up/down blob SHAs and audit exact within-H6 replication
        run: |
          python -m py_compile analysis/20261116_reported_np_source/source_only_gate.py
          python -u analysis/20261116_reported_np_source/source_only_gate.py \
            --original183 '${{ runner.temp }}/genuine_183_source' \
            --output '${{ runner.temp }}/reportedNP_source_gate'
      - name: Preserve source-only positive/unknown/mixed 40 true-H6 audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-original-reportedNP-183H7-40H6-source-replication-only
          path: ${{ runner.temp }}/reportedNP_source_gate/
          retention-days: 90
          if-no-files-found: warn
