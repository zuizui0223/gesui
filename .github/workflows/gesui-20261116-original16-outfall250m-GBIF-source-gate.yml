name: gesui original 16 outfall source 250m upstream downstream GBIF opportunity 2017 2022
on:
  push:
    branches:
      - analysis/gesui-outfall-local-riparian-trait-source-gate-20261116
    paths:
      - 'analysis/20261116_outfall_riparian_local_source/gbif_local_250m_count_opportunity.py'
      - '.github/workflows/gesui-20261116-original16-outfall250m-GBIF-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_only_new_local_riparian_gbif_recording_opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original public GBIF source HTTP client
        run: python -m pip install --quiet requests
      - uses: actions/download-artifact@v4
        with:
          run-id: 43846527119
          name: gesui-20261116-source-authentic-local1500m-original16-outfalls-geospatial-QA
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_geom_local16
      - name: True GBIF original count opportunities on source-frozen 250m outfall-up/down buffer circles in two periods, no biological effect
        run: |
          python -m py_compile analysis/20261116_outfall_riparian_local_source/gbif_local_250m_count_opportunity.py
          python -u analysis/20261116_outfall_riparian_local_source/gbif_local_250m_count_opportunity.py \
            --geometry '${{ runner.temp }}/original_geom_local16' \
            --output '${{ runner.temp }}/local16_gbif_sourceonly'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-realWWTP-local250m-128GBIF-plant-opportunity-source-gate
          path: ${{ runner.temp }}/local16_gbif_sourceonly/
          retention-days: 90
          if-no-files-found: warn
