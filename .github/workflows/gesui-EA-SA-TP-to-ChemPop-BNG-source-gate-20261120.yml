name: gesui EA treated STW total P SA sampling sites vs authentic ChemPop BNG geography source-only
on:
  push:
    paths:
      - 'analysis/20261120_wessex_wwtp/ea_SA_TP_to_ChemPop_location_sourcegate.py'
      - '.github/workflows/gesui-EA-SA-TP-to-ChemPop-BNG-source-gate-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-EA-STW-to-ChemPop-geometry-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only scientific original RData and ChemPop v2 raw archive parsers
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1'
      - name: Test native EA Water Company final treated TP and same-year ChemPop bio BNG geography, not directed river exposure
        run: |
          python -m py_compile analysis/20261120_wessex_wwtp/ea_SA_TP_to_ChemPop_location_sourcegate.py
          python -u analysis/20261120_wessex_wwtp/ea_SA_TP_to_ChemPop_location_sourcegate.py \
            --out "${{ runner.temp }}/gesui_source_spatial/EA_SA_TP_2017_18_CHEMPOP_BNG_PROXIMITY_SOURCEONLY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261120-EA-SA-TP-ChemPop-BNG-geographic-source-only
          path: ${{ runner.temp }}/gesui_source_spatial/EA_SA_TP_2017_18_CHEMPOP_BNG_PROXIMITY_SOURCEONLY.json
          if-no-files-found: warn
          retention-days: 90
