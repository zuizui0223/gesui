name: gesui official EEA 2026 WISE6 REAL 2022 river TP annual station source 42 cell geofence
on:
  push:
    branches: ["analysis/lycaenidae-2022-measured-river-P-source-20261109"]
    paths:
      - "scripts/gesui_eea2026_wise6_original_2022_TP_annual_station_coverage.py"
      - ".github/workflows/gesui-eea2026-wise6-2022TP-site-coverage-sourceonly.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-eea2026-river-TP-source-STATIONS-no-chemistry-values:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet shapely
      - name: Audit official original 2026 WISE6 compressed annual and spatial source 2022 RW TP site metadata vs fixed 42 DE AT butterfly source cells
        run: |
          python -m py_compile scripts/gesui_eea2026_wise6_original_2022_TP_annual_station_coverage.py
          python -u scripts/gesui_eea2026_wise6_original_2022_TP_annual_station_coverage.py \
            --2022-original-WorldCover-source results/lycaenidae_worldcover2021_source_only/2022_LYCAENIDAE_ESAWC2021_DE_AT_URBAN_CROP_LANDAREA_POSTHOC_BLOCKCV.json \
            --2023-exact-photo-cell-source results/lycaenidae_2023_photo_temporal_source/2023_INDEPENDENT_YEAR_FAMILY_PHOTO_TOTALS_ORIGINAL43_SOURCE_QC.json \
            --tmpdir /tmp/gesui2026-original-eea-wise6-waterquality \
            --out results/lycaenidae_2022_measured_river_P_bridge/2026_EEA_WISE6_2022_RW_TP_ACTUAL_ANNUAL_STATION_SOURCE_ONLY_QC.json
      - name: Preserve official annual TP station counts and 2022 source-only geofence failures, never numerical TP values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_2022_measured_river_P_bridge/2026_EEA_WISE6_2022_RW_TP_ACTUAL_ANNUAL_STATION_SOURCE_ONLY_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Archive original EEA 2026 annual 2022 RW total-P site-year sample coverage for fixed DE/AT Lycaenidae cells without TP concentrations"
          git fetch origin analysis/lycaenidae-2022-measured-river-P-source-20261109
          git rebase origin/analysis/lycaenidae-2022-measured-river-P-source-20261109
          git push origin HEAD:analysis/lycaenidae-2022-measured-river-P-source-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2026-original-2022-riverTP-annual-WISE6-42-Lycaenidae-cell-sourceonly
          path: results/lycaenidae_2022_measured_river_P_bridge/2026_EEA_WISE6_2022_RW_TP_ACTUAL_ANNUAL_STATION_SOURCE_ONLY_QC.json
          retention-days: 90
          if-no-files-found: warn
