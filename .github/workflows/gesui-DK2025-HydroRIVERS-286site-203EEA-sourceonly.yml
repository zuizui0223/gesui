name: gesui DK2025 new399 original source-only 203 EEA outfalls to 286 EBMS river-directed exposure feasibility
on:
  push:
    branches: ["analysis/dk-ebms2025-hydrorivers-outfall-exposure-gate-20261110"]
    paths:
      - ".github/workflows/gesui-DK2025-HydroRIVERS-286site-203EEA-sourceonly.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_Denmark_source_only_river_transport_feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install geospatial source-geometry readers only
        run: python -m pip install --quiet "numpy<3" pandas pyarrow "geopandas>=1" pyogrio shapely
      - name: Download exact original previously-used EU HydroRIVERS GeoParquet and verify immutable source SHA
        run: |
          mkdir -p /tmp/gesui-dk2025-directedriver
          curl --fail --location --silent --show-error --retry 3 --max-time 320 \
            https://huggingface.co/datasets/cassini-team-todo/hydro-rivers-europe/resolve/d43804121071d6693ec545fa43c27addbd686cad/HydroRIVERS_v10_eu.geoparquet \
            -o /tmp/gesui-dk2025-directedriver/HydroRIVERS_v10_eu.geoparquet
          echo "5e6327c6dd34a81bd7768d840f25c0569d4361b7e078065a97214563bd01b32f  /tmp/gesui-dk2025-directedriver/HydroRIVERS_v10_eu.geoparquet" | sha256sum -c -
      - name: Lock source-only original 286 public EBMS sites/203 original EEA outlets to downstream/upstream directed river reaches WITHOUT taxon/count data
        run: |
          python -m py_compile scripts/gesui_DK2025_286site_EEA203_HydroRIVERS_directed_source_only.py
          python -u scripts/gesui_DK2025_286site_EEA203_HydroRIVERS_directed_source_only.py \
            --river-geoparquet /tmp/gesui-dk2025-directedriver/HydroRIVERS_v10_eu.geoparquet \
            --out results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_286SITE_203WWTP_SHA_LOCKED_HYDRORIVERS_DIRECTED_SOURCE_FEASIBILITY.json
      - name: Preserve only source/monitor reach IDs, direction QA and non-biological opportunity gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_286SITE_203WWTP_SHA_LOCKED_HYDRORIVERS_DIRECTED_SOURCE_FEASIBILITY.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze DK 2025 eBMS 286-site 203-WWTP source-only directed river candidate coverage and stop gate"
          git fetch origin analysis/dk-ebms2025-hydrorivers-outfall-exposure-gate-20261110
          git rebase origin/analysis/dk-ebms2025-hydrorivers-outfall-exposure-gate-20261110
          git push origin HEAD:analysis/dk-ebms2025-hydrorivers-outfall-exposure-gate-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-DK2025-sourceonly-286sites-203outfalls-HydroRIVERS-v1
          path: results/ebms_denmark_2023_2024_WWTP_source_only/DK2025_NEW399_286SITE_203WWTP_SHA_LOCKED_HYDRORIVERS_DIRECTED_SOURCE_FEASIBILITY.json
          retention-days: 90
