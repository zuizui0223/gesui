name: gesui full source-blind EEA2018 2639 benthic station RZ2018 250m/500m habitat classification census
on:
  push:
    branches:
      - analysis/gesui-20261117-2018-riparian-official-common-site-source
    paths:
      - 'analysis/20261117_RZ2018/eea2018_original_riparian_lclu_source_pilot.py'
      - '.github/workflows/gesui-20261117-RZ2018-full-2639-census.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/20261117_RZ2018/eea2018_original_riparian_lclu_source_pilot.py'
      - '.github/workflows/gesui-20261117-RZ2018-full-2639-census.yml'
permissions:
  contents: read
jobs:
  original_2018_EEA_benthic_2639_sites_RZ_2018_full_source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original coordinate geometry and HTTP libraries
        run: python -m pip install --quiet requests "shapely>=2,<3" "pyproj>=3,<4"
      - name: 2018 original all2639 physical benthic river sites × open official 2018 Riparian Zones LCLU polygon source area; never fit biological outcome
        run: |
          python -m py_compile analysis/20261117_RZ2018/eea2018_original_riparian_lclu_source_pilot.py
          python -u analysis/20261117_RZ2018/eea2018_original_riparian_lclu_source_pilot.py \
            --full-census \
            --output '${{ runner.temp }}/RZ2018_original_full_2018_eea_water_stations'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261117-RZ2018-2018Benthic-2639-source-only-physical-class-areas
          path: '${{ runner.temp }}/RZ2018_original_full_2018_eea_water_stations/'
          retention-days: 90
          if-no-files-found: warn
