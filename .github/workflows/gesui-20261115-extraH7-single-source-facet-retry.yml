name: gesui source-only selective one missing Papilionidae facet retry, preserve 359 GBIF originals
on:
  push:
    branches:
      - analysis/gesui-h6-multih7-source-expansion-20261115
    paths:
      - 'analysis/20261115_h6_source_expansion/retry_missing_papilio_1.py'
      - '.github/workflows/gesui-20261115-extraH7-single-source-facet-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only-selective-one-facet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43724346859
          name: gesui-20261115-extraH7-30-official-H7-original-specieskey-shard-0
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_shards/0
      - uses: actions/download-artifact@v4
        with:
          run-id: 43724346859
          name: gesui-20261115-extraH7-30-official-H7-original-specieskey-shard-1
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_shards/1
      - uses: actions/download-artifact@v4
        with:
          run-id: 43724346859
          name: gesui-20261115-extraH7-30-official-H7-original-specieskey-shard-2
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_shards/2
      - uses: actions/download-artifact@v4
        with:
          run-id: 43197894183
          name: hybas7-1219-original-polygon-wkt-pre-gbif-source
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_1219WKT
      - uses: actions/download-artifact@v4
        with:
          run-id: 43204064427
          name: gesui-h7-234-EU-repeated-EQR-source-frozen-taxonomy-and-WKT
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_taxon_families
      - name: Retry only the exact missing H7-2017-19-Papilionidae original speciesKey facet
        run: |
          python -m py_compile analysis/20261115_h6_source_expansion/retry_missing_papilio_1.py
          python -u analysis/20261115_h6_source_expansion/retry_missing_papilio_1.py \
            --original '${{ runner.temp }}/original_shards' \
            --wkt '${{ runner.temp }}/original_1219WKT' \
            --taxonomy '${{ runner.temp }}/original_taxon_families' \
            --output '${{ runner.temp }}/repaired_original'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-original-30-extraH7-360-speciesKey-one-missing-recovery
          path: ${{ runner.temp }}/repaired_original/
          retention-days: 90
          if-no-files-found: warn
