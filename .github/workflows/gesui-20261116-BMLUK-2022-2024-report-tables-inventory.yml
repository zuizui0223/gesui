name: gesui original BMLUK 2022-2024 water results tables ZIP source types and station-grain inventory
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/BMLUK_2022_2024_results_tables_inventory.py'
      - '.github/workflows/gesui-20261116-BMLUK-2022-2024-report-tables-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_2022_2024_wq_report_tables_source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original official publisher HTTP client
        run: python -m pip install --quiet requests
      - name: Verify official BMLUK 2022–2024 report ZIP archive members/format, no chemical or biotic values
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/BMLUK_2022_2024_results_tables_inventory.py
          python -u analysis/20261116_austria_wisa_official_source/BMLUK_2022_2024_results_tables_inventory.py \
            --output '${{ runner.temp }}/original_BMLUK_2022_2024_report_source'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-official-BMLUK-2022-2024-report-source-file-types
          path: '${{ runner.temp }}/original_BMLUK_2022_2024_report_source/BMLUK_2022_24_PUBLIC_WATER_REPORT_RESULTS_TABLES_SOURCE_INVENTORY.json'
          retention-days: 90
          if-no-files-found: warn
