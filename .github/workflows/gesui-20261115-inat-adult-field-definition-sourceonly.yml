name: GESUI 2026 adult butterfly feeding iNaturalist field source-only definitions
on:
  push:
    branches:
      - analysis/gesui-hns-family-taxon-attribution-20261115
    paths:
      - analysis/20261115_adult_resource_behavior/audit_inat_behavior_field_definitions.py
      - .github/workflows/gesui-20261115-inat-adult-field-definition-sourceonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only-no-butterfly-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit actual original unregulated behavior field schema, no observation records
        shell: bash
        run: |
          set -euo pipefail
          python analysis/20261115_adult_resource_behavior/audit_inat_behavior_field_definitions.py \
            --output results/20261115_adult_resource_behavior/INAT_ADULT_FIELD_DEFINITIONS_SOURCE_ONLY.json
          python - <<'PY'
          import json
          d=json.load(open('results/20261115_adult_resource_behavior/INAT_ADULT_FIELD_DEFINITIONS_SOURCE_ONLY.json'))
          assert d['mixed_field_17428_cannot_claim_puddling_ingestion']
          assert d['no_species_or_observations_read'] and d['no_adult_resource_family_contrast_run']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gesui-inaturalist-adult-behavior-field-original-sourceonly
          path: results/20261115_adult_resource_behavior/INAT_ADULT_FIELD_DEFINITIONS_SOURCE_ONLY.json
          if-no-files-found: error
