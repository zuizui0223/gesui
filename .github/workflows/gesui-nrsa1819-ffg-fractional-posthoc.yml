name: gesui 2018-19 FFG fractional assignments and nutrient associations (posthoc)

on:
  push:
    paths:
      - "scripts/gesui_NRSA1819_fractional_FFG_nutrient_functions_20261112.py"
      - ".github/workflows/gesui-nrsa1819-ffg-fractional-posthoc.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  exact-original-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible numeric packages
        run: python -m pip install --quiet "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Reuse the frozen original native UID pre-nutrient result
        uses: actions/download-artifact@v4
        with:
          name: nrsa1819-genuine-source-only-qc
          run-id: 43034107486
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nrsa_pinned
      - name: Rebuild the exact original 3 EPA files and original fixed numeric model
        env:
          NRSA_FROZEN_MANIFEST: ${{ runner.temp }}/nrsa_pinned/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
        run: python scripts/gesui_aquatic_terrestrial_NRSA1819_functional_proxy_after_UID_freeze.py
      - name: Apply unbiased fractional split of multiply assigned FFG guilds and compare held-out MSE
        env:
          NRSA_FROZEN_MANIFEST: ${{ runner.temp }}/nrsa_pinned/NRSA1819_BERW_NATIVE_UID_SITE_GEOGRAPHY_MANIFEST_SOURCE_ONLY.json
        run: |
          python -m py_compile scripts/gesui_NRSA1819_fractional_FFG_nutrient_functions_20261112.py
          python scripts/gesui_NRSA1819_fractional_FFG_nutrient_functions_20261112.py
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrsa1819-fractional-ffg-original-np-posthoc
          path: ${{ runner.temp }}/nrsa1819_functional/NRSA1819_FFG_FRACTIONAL_MULTILABEL_NP_POSTHOC_20261112.json
          if-no-files-found: warn
          retention-days: 30
