name: TREAM basin-associated spatial persistence
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'analysis/20261125_tream_basin/**'
      - '.github/workflows/gesui-tream-basin-structure.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'analysis/gesui-tream-basin-structure-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'requests==2.32.5' 'numpy>=1.26,<3' 'pandas>=2,<3'
      - name: Retrieve signed source and panel, freeze geographical memberships, then evaluate fixed diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/receipt" "$RUNNER_TEMP/basin"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14989507257/zip > "$RUNNER_TEMP/receipt/source.zip"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14989139284/zip > "$RUNNER_TEMP/receipt/panel.zip"
          python -m py_compile analysis/20261125_tream_basin/basin_structure.py
          python -u analysis/20261125_tream_basin/basin_structure.py --work "$RUNNER_TEMP/receipt" --out "$RUNNER_TEMP/basin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-tream-basin-structure
          path: ${{ runner.temp }}/basin
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve primary geographical support status
        run: |
          python - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"basin"/"results.json").read_text())
          print(r["status"])
          if r["status"]!="COMPLETE_PRIMARY":
              raise SystemExit("Primary geographic support STOP")
          PY
