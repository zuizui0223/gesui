name: gesui genuine same-larval-host EIV N and MOIST butterfly trait H7 water-land matching
on:
  push:
    branches:
      - analysis/gesui-20261117-butterfly-host-moisture-source-gate
    paths:
      - 'analysis/20261117_host_moisture/strict_FerrerParis_pair_H7_water_land_model.py'
      - '.github/workflows/gesui-20261117-original-same-host-pair-water-land-H7.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_true_2014_larval_host_N_and_F_2022_EU_H7:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original 454 H7 geography and numerical sources
        run: python -m pip install --quiet numpy scipy pandas statsmodels
      - uses: actions/download-artifact@v4
        with:
          run-id: 43593227162
          name: gesui-H7-234x2x6-only429-source-merged-20261114
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_2808_GBIF_H7_facets
      - uses: actions/download-artifact@v4
        with:
          run-id: 43720948781
          name: gesui-20261115-EU454-EIV-NUTRI-five-pairs-source-opportunity-only
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_paired_EIV_plant_N_MOIST_H7
      - uses: actions/download-artifact@v4
        with:
          run-id: 43899851159
          name: gesui-20261117-genuine-FerrerParis-same-larval-host-EIV-N-MOIST-303
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original_paired_EIV_N_MOIST_same_larval_HOST
      - name: Reconstruct and compare 162 same-host species along original 4.318m GBIF butterfly records with original same-H7 pair-scored plant community and water EQR, no wastewater causality
        run: |
          python -m py_compile analysis/20261117_host_moisture/strict_FerrerParis_pair_H7_water_land_model.py
          python -u analysis/20261117_host_moisture/strict_FerrerParis_pair_H7_water_land_model.py \
            --samehosts '${{ runner.temp }}/original_paired_EIV_N_MOIST_same_larval_HOST' \
            --facets '${{ runner.temp }}/original_2808_GBIF_H7_facets' \
            --plants '${{ runner.temp }}/original_paired_EIV_plant_N_MOIST_H7' \
            --output '${{ runner.temp }}/original_STRICT_same_larvalHOST_2022_water_land_H7'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261117-H7-original162-same-HOST-N-F-plant-moisture-real-aquaticEQ
          path: '${{ runner.temp }}/original_STRICT_same_larvalHOST_2022_water_land_H7/'
          retention-days: 90
          if-no-files-found: warn
