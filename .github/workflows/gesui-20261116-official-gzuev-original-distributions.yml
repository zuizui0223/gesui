name: gesui public original Austrian GZUEV station distribution source authenticity
on:
  push:
    branches:
      - analysis/gesui-20261116-wisa-gzuev-water-benthos-2022-source-access
    paths:
      - 'analysis/20261116_austria_wisa_official_source/original_gzuev_distribution.py'
      - '.github/workflows/gesui-20261116-official-gzuev-original-distributions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_gzuev_public_distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source HTTP client
        run: python -m pip install --quiet requests
      - name: Verify genuine BMLUK GZÜV flowing-water station dataset and actual public distribution HTTP without biology
        run: |
          python -m py_compile analysis/20261116_austria_wisa_official_source/original_gzuev_distribution.py
          python -u analysis/20261116_austria_wisa_official_source/original_gzuev_distribution.py \
            --output '${{ runner.temp }}/original_GZUEV_distribution'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261116-BMLUK-original-GZUEV-river-station-real-distributions
          path: '${{ runner.temp }}/original_GZUEV_distribution/'
          retention-days: 90
          if-no-files-found: warn
