name: gesui 2023 Lycaenidae temporal geographic WWTP P falsifier after frozen 2023 photos
on:
  push:
    branches: ["analysis/lycaenidae-2023-photo-time-negativecontrol-20261108"]
    paths:
      - ".github/workflows/gesui-2023-lycaenidae-Psource-geoCV-yearcheck.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixed-2022-vs-2023-geographic-photo-source-temporal-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reproducible source-only model dependencies
        run: python -m pip install --quiet numpy scipy
      - name: Use frozen 2023 family photorecord source, historic 2021, original 2022 WorldCover 43 cells only
        run: |
          python -m py_compile scripts/gesui_2023_lycaenidae_sourceP_geographic_year_check.py
          python -u scripts/gesui_2023_lycaenidae_sourceP_geographic_year_check.py \
            --source-2023-photography results/lycaenidae_2023_photo_temporal_source/2023_INDEPENDENT_YEAR_FAMILY_PHOTO_TOTALS_ORIGINAL43_SOURCE_QC.json \
            --original-2022-landcover results/lycaenidae_worldcover2021_source_only/2022_LYCAENIDAE_ESAWC2021_DE_AT_URBAN_CROP_LANDAREA_POSTHOC_BLOCKCV.json \
            --optional-2021-family-history results/lycaenidae_2021_prior_butterfly_photo_source/2021_HISTORICAL_3FAMILY_PHOTO_COUNTS_ORIGINAL43_SOURCE_ONLY.json \
            --out results/lycaenidae_2023_photo_temporal_source/2023_LYCAENIDAE_PREVIOUSYEAR_2022_PSOURCE_GEOBLOCK_POSTHOC_QC.json
      - name: Preserve opposite/positive 2023 source year stress outcomes without claiming causal sewage response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/lycaenidae_2023_photo_temporal_source/2023_LYCAENIDAE_PREVIOUSYEAR_2022_PSOURCE_GEOBLOCK_POSTHOC_QC.json
          git diff --cached --quiet && exit 0
          git commit -m "Test whether original 2022 reported WWTP P geography predicts 2023 Lycaenidae photos beyond 2022 photo composition"
          git fetch origin analysis/lycaenidae-2023-photo-time-negativecontrol-20261108
          git rebase origin/analysis/lycaenidae-2023-photo-time-negativecontrol-20261108
          git push origin HEAD:analysis/lycaenidae-2023-photo-time-negativecontrol-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-2023-Lycaenidae-2022-WWTP-P-geographic-temporal-posthoc
          path: results/lycaenidae_2023_photo_temporal_source/2023_LYCAENIDAE_PREVIOUSYEAR_2022_PSOURCE_GEOBLOCK_POSTHOC_QC.json
          retention-days: 90
