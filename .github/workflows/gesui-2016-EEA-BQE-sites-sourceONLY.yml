name: gesui 2016 third independent year EEA actual river biology BQE SITE-only source
on:
  push:
    branches: ["analysis/eea2016-thirdyear-benthic-NP-source-20261111"]
    paths:
      - ".github/workflows/gesui-2016-EEA-BQE-sites-sourceONLY.yml"
      - "scripts/gesui_2016_bqe_source_only_sites.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze_original2016_BQE_NO_EQR_values:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source-only site geometry and national method readers
        run: python -m pip install --quiet "numpy<3" pandas
      - name: Download precisely original EEA Waterbase Biology 2026 public source archive to screen 2016 site IDs and country×procedure
        run: |
          mkdir -p /tmp/gesui-2016-biology
          curl --fail --location --silent --show-error --retry 3 --max-time 420 \
            https://sdi.eea.europa.eu/datashare/s/HCxTFz3Ac8xbHX6/download \
            -o /tmp/gesui-2016-biology/EEA_Waterbase_Biology2026.zip
          test -s /tmp/gesui-2016-biology/EEA_Waterbase_Biology2026.zip
      - name: Fix 2016 original BQE biological monitoring-sites, distinct countries, method groups and 3degree folds BEFORE numeric EQR
        run: |
          python -m py_compile scripts/gesui_2016_bqe_source_only_sites.py
          python -u scripts/gesui_2016_bqe_source_only_sites.py \
            --archive /tmp/gesui-2016-biology/EEA_Waterbase_Biology2026.zip \
            --out results/eea2016_thirdyear_source_20261111/2016_BQE_PREOUTCOME_SOURCE_ONLY
      - name: Archive the whole 2016 original aquatic BQE monitoring site population before exposure and biology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eea2016_thirdyear_source_20261111/2016_BQE_PREOUTCOME_SOURCE_ONLY/
          git diff --cached --quiet && exit 0
          git commit -m "Freeze independent 2016 benthic/phytobenthos/fish EEA site-method cohorts and folds before EQR results"
          git fetch origin analysis/eea2016-thirdyear-benthic-NP-source-20261111
          git rebase origin/analysis/eea2016-thirdyear-benthic-NP-source-20261111
          git push origin HEAD:analysis/eea2016-thirdyear-benthic-NP-source-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-EEA2016-original-benthic-BQE-preoutcome-site-metadata
          path: results/eea2016_thirdyear_source_20261111/2016_BQE_PREOUTCOME_SOURCE_ONLY/
          retention-days: 90
