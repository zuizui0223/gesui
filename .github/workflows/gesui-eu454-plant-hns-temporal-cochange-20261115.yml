name: gesui EU H7 paired periods genuine plant N and butterfly HNS cochange falsification
on:
  push:
    branches:
      - analysis/gesui-eu454-full-plant-nutri-20261115
    paths:
      - 'analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py'
      - '.github/workflows/gesui-eu454-plant-hns-temporal-cochange-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-H7-two-period-differences:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible original-source numerical dependencies
        run: python -m pip install --quiet pandas numpy scipy statsmodels
      - name: Restore official source-v2 SHA-gated plant EIV traits
        uses: actions/download-artifact@v4
        with:
          run-id: 43718069015
          name: gesui-20261115-EU454-11511-EIV-source-v2-official-hybrid-qa-no-trait-change
          repository: zuizui0223/gesui
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source_v2
      - name: Freeze true 2017–19 to 2020–22 same-H7 differences, test delta EIV versus delta HNS H6-out
        run: |
          python -m py_compile analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py
          python -u analysis/20261115_eu454_plant_nutri/paired_temporal_cochange.py \
            --source '${{ runner.temp }}/source_v2' \
            --output '${{ runner.temp }}/temporal'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261115-EU454-original-H7-paired-temporal-plantN-butterflyHNS-H6-out
          path: ${{ runner.temp }}/temporal/
          retention-days: 90
          if-no-files-found: warn
