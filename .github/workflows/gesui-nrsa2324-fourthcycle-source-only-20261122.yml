name: NRSA 2023 fourth-cycle EPT source-only opportunity
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/gesui_nrsa2324_fourthcycle_source_only_20261122.py
      - .github/workflows/gesui-nrsa2324-fourthcycle-source-only-20261122.yml
permissions:
  contents: read
jobs:
  fourth-cycle-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-only validation prerequisites
        run: |
          python -m pip install --quiet "pandas>=2.1,<3" "numpy>=1.26,<3"
          python -m py_compile scripts/gesui_nrsa2324_fourthcycle_source_only_20261122.py
      - name: Original EPA 2023–24 site, water, habitat, benthos, chlorophyll
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_siteinfo.csv" -o "${{ runner.temp }}/sites.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_waterchemistry.csv" -o "${{ runner.temp }}/water.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_physicalhabitat_metrics.csv" -o "${{ runner.temp }}/habitat.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-09/nrsa2324_benthiccount.csv" -o "${{ runner.temp }}/benthos.csv"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 "https://www.epa.gov/system/files/other-files/2026-06/nrsa2324_periphytonchlorophyll-a.csv" -o "${{ runner.temp }}/chla.csv"
      - name: Original source-only visit, protocol, chemistry and six-habitat validity
        run: |
          python -u scripts/gesui_nrsa2324_fourthcycle_source_only_20261122.py \
            --sites "${{ runner.temp }}/sites.csv" \
            --water "${{ runner.temp }}/water.csv" \
            --habitat "${{ runner.temp }}/habitat.csv" \
            --benthos "${{ runner.temp }}/benthos.csv" \
            --chla "${{ runner.temp }}/chla.csv" \
            --out "${{ runner.temp }}/nrsa2023_fourcycle_source_opportunity.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrsa2023-fourthcycle-berw-source-only
          path: ${{ runner.temp }}/nrsa2023_fourcycle_source_opportunity.json
          if-no-files-found: warn
          retention-days: 45
