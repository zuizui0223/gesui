name: gesui UK2018 UWWTD reported PRemoval vs observed EA treated effluent TP 2018 source-matched
on:
  push:
    paths:
      - 'analysis/20261121_uk_prtr/eea2018_PRemoval_to_EA_TP_effluent_source_test.py'
      - 'analysis/20261121_uk_prtr/premoval_source_support.py'
      - 'analysis/20261121_uk_prtr/test_premoval_source_*.py'
      - '.github/workflows/gesui-UWWTD2018-UK-PRemoval-to-EA-final-TP-concentration-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-2018-P-removal-vs-final-TP-source-gated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source QA RData, EEA 2018 UWWTP and original EA WQE 2018 chemistry parsers
        run: python -m pip install --quiet 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.12,<2' 'pyproj>=3.6,<4' 'statsmodels>=0.14,<1' 'scikit-learn>=1.5,<2' 'pyreadr>=0.5,<1' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'shapely>=2.0,<3'
      - name: Offline source-support, original-coordinate and record-fate regressions
        run: python -m unittest discover -s analysis/20261121_uk_prtr -p 'test_premoval_source_*.py' -v
      - name: Original 930 candidate support and distinct median versus complete-case BNG-adjusted log-mean estimands
        run: |
          python -m py_compile analysis/20261121_uk_prtr/eea2018_PRemoval_to_EA_TP_effluent_source_test.py
          python -u analysis/20261121_uk_prtr/eea2018_PRemoval_to_EA_TP_effluent_source_test.py \
            --out "${{ runner.temp }}/uk_2018_p_removal/UK2018_PRemoval_SOURCE_VS_EA_FINAL_TP_MG_L_NONCAUSAL.json"
          python - "${{ runner.temp }}/uk_2018_p_removal/UK2018_PRemoval_SOURCE_VS_EA_FINAL_TP_MG_L_NONCAUSAL.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert 'source_error' not in result, 'Unexpected source/model exception'
          print('VERIFIED_JSON_STATUS='+result['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesui-20261121-UK2018-UWWTD-PRemoval-to-final-EA-TP-source-contrast
          path: ${{ runner.temp }}/uk_2018_p_removal/UK2018_PRemoval_SOURCE_VS_EA_FINAL_TP_MG_L_NONCAUSAL.json
          if-no-files-found: warn
          retention-days: 90

